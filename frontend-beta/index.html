    {id:"pcoa",     g:"Beta", label:"PCoA",         f:"pca_scores.csv",   kind:"scatter"},
    {id:"scree",    g:"Beta", label:"PCA Scree",    f:"pca_scree.csv",    kind:"scree"},
    {id:"nmds_b",   g:"Beta", label:"NMDS Bray",    f:"nmds_bray.csv",    kind:"scatter"},
    {id:"nmds_j",   g:"Beta", label:"NMDS Jaccard", f:"nmds_jaccard.csv", kind:"scatter"},
    {id:"hm_bray",  g:"Beta", label:"Heatmap (Bray)", f:"beta_heatmap.csv",
     alt:"bray_curtis_distance_matrix.csv", kind:"matrix"},
    {id:"hm_jac",   g:"Beta", label:"Heatmap (Jac)",  f:"jaccard_heatmap.csv", kind:"matrix"},
    {id:"upgma_b",  g:"Beta", label:"UPGMA Bray",     f:"beta_heatmap.csv",
     alt:"bray_curtis_distance_matrix.csv", kind:"dendro"},
    {id:"upgma_j",  g:"Beta", label:"UPGMA Jaccard",  f:"jaccard_heatmap.csv", kind:"dendro"},

    {id:"reads",    g:"Other", label:"Read Counts",  f:"asv_summary.csv",    kind:"alpha", metric:""},
    {id:"rtrack",   g:"Other", label:"Read Tracking", f:"read_tracking.csv", kind:"grouped"},
    {id:"rarefy",   g:"Other", label:"Rarefaction",  f:"rarefaction.csv",    kind:"lines"},
    {id:"specacc",  g:"Other", label:"Spec. Accum.", f:"specaccum.csv",      kind:"lines"},
    {id:"rankab",   g:"Other", label:"Rank Abund.",  f:"rank_abundance.csv", kind:"lines"},
    {id:"asvlen",   g:"Other", label:"ASV Lengths",  f:"asv_lengths.csv",    kind:"hist"},
    {id:"otu",      g:"Other", label:"OTU Dist",     f:"otu_distribution.csv", kind:"box"}
  ];
  var TAB_GROUPS = ["Taxonomy", "Alpha", "Beta", "Other"];

  /* Sequential ramps for the heatmaps — the production console's list, kept so
     a job styled there looks the same here. Viridis is the default because it
     is monotonic in lightness and holds up under colour-blind simulation;
     RdYlGn is the one scale in the list that does not, and says so rather than
     being quietly dropped from a list the other console still offers. */
  var SCALES = {
    Viridis: ["#440154","#414487","#2a788e","#22a884","#7ad151","#fde725"],
    Plasma:  ["#0d0887","#6a00a8","#b12a90","#e16462","#fca636","#f0f921"],
    Blues:   ["#f7fbff","#c6dbef","#6baed6","#2171b5","#08519c","#08306b"],
    Reds:    ["#fff5f0","#fcbba1","#fc8d59","#ef3b2c","#cb181d","#67000d"],
    YlOrRd:  ["#ffffcc","#ffeda0","#fed976","#fd8d3c","#e31a1c","#800026"],
    Greens:  ["#f7fcf5","#c7e9c0","#74c476","#31a354","#006d2c","#00441b"],
    Hot:     ["#000000","#5c0000","#b30000","#ff4d00","#ffbb00","#ffffff"],
    RdYlGn:  ["#d73027","#f46d43","#fdae61","#fee08b","#a6d96a","#1a9850"]
  };
  var SCALE_WARN = {RdYlGn: "red-to-green — not safe for colour-blind readers"};

  function rampColour(name, t){
    var ramp = SCALES[name] || SCALES.Viridis;
    t = Math.max(0, Math.min(1, isFinite(t) ? t : 0));
    var x = t * (ramp.length - 1), i = Math.floor(x), f = x - i;
    if(i >= ramp.length - 1) return ramp[ramp.length - 1];
    return mixHex(ramp[i], ramp[i + 1], f);
  }
  function mixHex(a, b, f){
    function p(h){ return [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)]; }
    var A = p(a), B = p(b);
    return "#" + [0,1,2].map(function(k){
      return ("0" + Math.round(A[k] + (B[k] - A[k]) * f).toString(16)).slice(-2); }).join("");
  }
  /* Pick ink that stays readable on top of a ramp cell. */
  function onColour(hex){
    var r = parseInt(hex.substr(1,2),16), g = parseInt(hex.substr(3,2),16), b = parseInt(hex.substr(5,2),16);
    return (0.2126*r + 0.7152*g + 0.0722*b) > 150 ? "#111111" : "#ffffff";
  }

  var SERIES_LIGHT = ["#2a78d6","#eb6834","#1baf7a","#eda100",
                      "#e87ba4","#008300","#4a3aa7","#e34948"];
  var SERIES_DARK  = ["#3987e5","#d95926","#199e70","#c98500",
                      "#d55181","#008300","#9085e9","#e66767"];
  var OTHER_LIGHT = "#8a989e", OTHER_DARK = "#6d8087";

  function isDark(){
    var r = document.documentElement;
    return r.getAttribute("data-theme") === "dark"
      || (!r.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  }
  function seriesPalette(){ return isDark() ? SERIES_DARK : SERIES_LIGHT; }
  function otherColour(){ return isDark() ? OTHER_DARK : OTHER_LIGHT; }

  /* Theme tokens resolved to literals: the SVG is serialised for PNG export,
     and a var(--fg) inside a detached SVG string resolves to nothing — the
     exported image would come out with invisible text. */
  function ink(){
    var cs = getComputedStyle(document.documentElement);
    function v(n, fb){ return (cs.getPropertyValue(n) || "").trim() || fb; }
    return {fg:v("--fg","#0e1517"), fg2:v("--fg-2","#54646a"), fg3:v("--fg-3","#8a989e"),
            line:v("--line","#d7dee1"), surface:v("--surface","#ffffff"),
            surface3:v("--surface-3","#f6f8f9")};
  }

  var CHART = null;

  function defaultFont(){
    return {titleSize:16, axisSize:12, legendSize:11,
            titleText:"", titleBold:false, titleItalic:false,
            chartType:"bar100", showGrid:true,
            xItalic:false, xBold:false, xSize:12,
            colorscale:"Viridis", topNTaxa:8};
  }

  /* ── loading ─────────────────────────────────────────────────────────── */
  function renderCharts(id){
    var listed = STATE.jobs.filter(function(j){ return j.job_id === id; })[0] || {job_id:id};
    CHART = {id:id, tab:null, tabs:[], rows:null, err:"", loading:true,
             font:defaultFont(), colors:{}, aliases:{}, order:[],
             /* sample -> group. Read from the job's metadata.csv and written
                back there, because that is where the pipeline and the
                production console both keep it — not invented in a settings
                file only this editor understands. */
             groups:{}, groupOn:true, groupDirty:false, groupSaved:false,
             hidden:{},
             view:"chart", dirty:false, saved:false};

    work.innerHTML = '<div class="dhdr"><button class="back" id="backBtn">'
        + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 6l-6 6 6 6"/></svg>'
        + 'Back to results</button></div>'
      + '<h2 class="ttl">' + esc(listed.job_name || id) + ' — chart editor</h2>'
      + '<p class="sub" id="cSub">Reading the result folder…</p>'
      + '<div id="cBody"><div class="panel"><div class="skel">Loading…</div></div></div>';

    document.getElementById("backBtn").addEventListener("click", function(){
      go({name:"results", id:id});
    });

    Promise.all([
      api("/results/" + encodeURIComponent(id) + "/tables"),
      api("/results/" + encodeURIComponent(id) + "/edit_charts/settings").catch(function(){ return {}; }),
      api("/results/" + encodeURIComponent(id) + "/metadata").catch(function(){ return {rows:[]}; })
    ]).then(function(r){
      var have = Array.isArray(r[0].tables) ? r[0].tables : [];
      var saved = r[1] || {};
      var meta = (r[2] && Array.isArray(r[2].rows)) ? r[2].rows : [];
      /* Column names vary — the pipeline reads the id column case-insensitively
         and the production console writes "SampleID,Group". Accept both rather
         than requiring one spelling. */
      meta.forEach(function(row){
        var id_ = "", g = "";
        Object.keys(row).forEach(function(k){
          var lk = k.toLowerCase().replace(/[^a-z]/g, "");
          if(!id_ && (lk === "sampleid" || lk === "sample")) id_ = (row[k] || "").trim();
          if(!g   && lk === "group") g = (row[k] || "").trim();
        });
        if(id_ && g) CHART.groups[id_] = g;
      });
      if(saved.font)          CHART.font    = Object.assign(defaultFont(), saved.font);
      if(saved.colors)        CHART.colors  = saved.colors;
      if(saved.sampleAliases) CHART.aliases = saved.sampleAliases;
      if(saved.sampleOrder)   CHART.order   = saved.sampleOrder;

      /* Only offer a tab whose file this run actually wrote. Listing a tab the
         job has no data for means clicking it to find out — the old "Table"
         entry in the rank picker was exactly that: taxonomy_table.csv matched
         a pattern, so it was offered as if it were a rank. */
      CHART.tabs = TABS.filter(function(t){
        return have.indexOf(t.f) !== -1 || (t.alt && have.indexOf(t.alt) !== -1);
      }).map(function(t){
        var o = Object.assign({}, t);
        if(have.indexOf(t.f) === -1 && t.alt) o.f = t.alt;
        return o;
      });

      if(!CHART.tabs.length){
        document.getElementById("cBody").innerHTML =
          '<div class="panel"><div class="skel">This job wrote no CSV tables, so there is '
          + 'nothing to redraw. The figures R produced during the run are on the results '
          + 'screen.</div></div>';
        document.getElementById("cSub").textContent = "";
        return;
      }
      var pref = ["genus","phylum","family","observed","pcoa"];
      var pick = null;
      pref.forEach(function(idv){
        if(!pick) pick = CHART.tabs.filter(function(t){ return t.id === idv; })[0];
      });
      selectTab(pick || CHART.tabs[0]);
    }).catch(function(e){
      document.getElementById("cBody").innerHTML =
        '<div class="panel"><div class="errbox" style="border-radius:var(--r)">'
        + '<b>Could not open the chart editor.</b>\n' + esc(e.message || e) + '</div></div>';
    });
  }

  function selectTab(tab){
    /* Drop the old shape with the old tab. Keeping it meant the new tab's KIND
       was briefly applied to the previous tab's DATA — a dendrogram's matrix
       read as if it were a grouped bar chart, which threw, and would otherwise
       have drawn the last tab's numbers under this tab's title for a moment.
       A chart that is briefly wrong is a chart someone screenshots. */
    CHART.tab = tab; CHART.shape = null; CHART.rows = null;
    CHART.loading = true; CHART.err = "";
    paintCharts();
    fetch("/results/" + encodeURIComponent(CHART.id) + "/table/" + encodeURIComponent(tab.f),
          {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function(text){
        var rows = parseCSV(text);
        if(rows.length < 2) throw new Error("The file has no data rows.");
        CHART.rows = rows;
        CHART.loading = false;
        shapeData();
        paintCharts();
      })
      .catch(function(e){
        CHART.loading = false;
        CHART.err = e.message || String(e);
        paintCharts();
      });
  }

  /* ── shaping ─────────────────────────────────────────────────────────── */
  function shapeData(){
    var rows = CHART.rows, head = rows[0], kind = CHART.tab.kind;
    var first = (head[0] || "").trim().toLowerCase();
    CHART.shape = {};

    if(kind === "stack" || kind === "taxheat"){
      /* taxa × samples, or the transpose. Which way it was read is printed
         above the chart: a silently transposed chart looks plausible and is
         completely wrong. */
      var byRow = !/^(sample|sampleid|id)$/.test(first);
      CHART.orientation = byRow ? "taxa in rows" : "samples in rows";
      var taxa = [], samples = [], matrix = [];
      if(byRow){
        samples = head.slice(1).map(function(h){ return h.trim(); });
        rows.slice(1).forEach(function(r){
          var nm = (r[0]||"").trim(); if(!nm) return;
          taxa.push(nm);
          matrix.push(samples.map(function(_, i){ return num(r[i+1]); }));
        });
      } else {
        taxa = head.slice(1).map(function(h){ return h.trim(); });
        var bs = rows.slice(1).filter(function(r){ return (r[0]||"").trim(); });
        samples = bs.map(function(r){ return r[0].trim(); });
        taxa.forEach(function(_, ti){
          matrix.push(bs.map(function(r){ return num(r[ti+1]); })); });
      }
      CHART.shape = {taxa:taxa, samples:samples, matrix:matrix};
      if(!CHART.order.length) CHART.order = samples.slice();

    } else if(kind === "alpha" || kind === "grouped" || kind === "scree" || kind === "box"){
      /* first column labels, remaining columns numeric */
      var cols = head.slice(1).map(function(h){ return h.trim(); });
      var labels = [], vals = [];
      rows.slice(1).forEach(function(r){
        var nm = (r[0]||"").trim(); if(!nm) return;
        labels.push(nm);
        vals.push(cols.map(function(_, i){ return num(r[i+1]); }));
      });
      CHART.shape = {labels:labels, cols:cols, vals:vals};
      if(kind === "alpha" && !CHART.order.length) CHART.order = labels.slice();

    } else if(kind === "multialpha"){
      var cols2 = head.slice(1).map(function(h){ return h.trim(); });
      var labels2 = [], vals2 = [];
      rows.slice(1).forEach(function(r){
        var nm = (r[0]||"").trim(); if(!nm) return;
        labels2.push(nm);
        vals2.push(cols2.map(function(_, i){ return num(r[i+1]); }));
      });
      CHART.shape = {labels:labels2, cols:cols2, vals:vals2};
      if(!CHART.order.length) CHART.order = labels2.slice();

    } else if(kind === "scatter"){
      /* label, x, y — find the two numeric columns by header name first */
      var lx = head.map(function(h){ return h.trim().toLowerCase(); });
      function col(names, fb){
        for(var i = 0; i < names.length; i++){ var k = lx.indexOf(names[i]); if(k !== -1) return k; }
        return fb;
      }
      var cx = col(["pc1","axis1","mds1","nmds1","dim1","x"], 1);
      var cy = col(["pc2","axis2","mds2","nmds2","dim2","y"], 2);
      var pts = [];
      rows.slice(1).forEach(function(r){
        var nm = (r[0]||"").trim(); if(!nm) return;
        pts.push({name:nm, x:num(r[cx]), y:num(r[cy]), group:""});
      });
      CHART.shape = {pts:pts, xLab:head[cx] || "Axis 1", yLab:head[cy] || "Axis 2"};

    } else if(kind === "matrix" || kind === "dendro"){
      /* square sample × sample matrix */
      var names = head.slice(1).map(function(h){ return h.trim(); });
      var m = [];
      rows.slice(1).forEach(function(r){ m.push(names.map(function(_, i){ return num(r[i+1]); })); });
      var rowNames = rows.slice(1).map(function(r){ return (r[0]||"").trim(); });
      CHART.shape = {names:rowNames.length === names.length ? rowNames : names, m:m};
      if(!CHART.order.length) CHART.order = CHART.shape.names.slice();

    } else if(kind === "lines" || kind === "hist"){
      var xcol = head[0];
      var sers = head.slice(1).map(function(h){ return h.trim(); });
      var xs = [], ys = [];
      rows.slice(1).forEach(function(r){
        xs.push(num(r[0]));
        ys.push(sers.map(function(_, i){ return num(r[i+1]); }));
      });
      CHART.shape = {xLab:xcol, series:sers, xs:xs, ys:ys};
    }
  }

  function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
  function labelOf(s){ return CHART.aliases[s] || s; }

  /* Samples the user has switched off. They stay in the data and in the saved
     metadata — only the chart leaves them out. */
  function visibleIdx(names){
    return orderedIdx(names).filter(function(i){ return !CHART.hidden[names[i]]; });
  }

  function orderedIdx(names){
    var idx = [];
    CHART.order.forEach(function(nm){
      var k = names.indexOf(nm);
      if(k !== -1 && idx.indexOf(k) === -1) idx.push(k);
    });
    names.forEach(function(_, k){ if(idx.indexOf(k) === -1) idx.push(k); });
    return idx;
  }

  /* Taxa ranked by abundance, top N kept, the rest folded into one grey
     "Other". Unassigned reads never take a colour slot however numerous they
     are — NA is routinely the biggest "genus" in a 16S table. */
  function series(){
    var S = CHART.shape;
    if(!S || !S.matrix) return [];
    var isNA = function(n){ return /^(na|unassigned|unclassified|)$/i.test(String(n).trim()); };
    /* Rank over the samples on screen, not over every sample in the file.
       Hiding Pre-R1 and Pre-R2 to show R1 vs R2 must also re-pick the top taxa
       from R1 and R2 — otherwise the chart's eight colours were chosen by two
       samples that are not in it, and "Other" is the wrong size. */
    var vis = visibleIdx(S.samples);
    var totals = S.matrix.map(function(row, i){
      return {i:i, name:S.taxa[i],
              sum:vis.reduce(function(a, k){ return a + (row[k] || 0); }, 0)}; });
    var named = totals.filter(function(t){ return !isNA(t.name) && t.sum > 0; });
    var na    = totals.filter(function(t){ return isNA(t.name) && t.sum > 0; });
    named.sort(function(a,b){ return b.sum - a.sum; });
    var n = Math.max(1, CHART.font.topNTaxa || 8);
    var top = named.slice(0, n), rest = named.slice(n).concat(na);
    var out = top.map(function(t){
      return {name:t.name, values:S.matrix[t.i].slice(), grouped:false}; });
    if(rest.length){
      var acc = S.samples.map(function(){ return 0; });
      rest.forEach(function(t){ S.matrix[t.i].forEach(function(v,k){ acc[k] += v; }); });
      /* acc covers every sample so the hidden ones stay correct if un-hidden. */
      out.push({name:"Other", values:acc, grouped:true, members:rest.length, hasNA:na.length>0});
    }
    return out;
  }

  function colourOf(s, idx){
    if(CHART.colors[s.name]) return CHART.colors[s.name];
    if(s.grouped) return otherColour();
    var p = seriesPalette();
    return p[idx % p.length];
  }

  /* ── drawing ─────────────────────────────────────────────────────────────
     One frame, one renderer per kind. Marks follow the house rules: a 2px
     surface gap between stacked fills, 4px rounded ends on the outermost
     segments only, recessive grid and axes, text in text tokens rather than
     series colour, a tooltip on every mark, and a legend whenever there are
     two or more series. */
  function chartSVG(o){
    o = o || {};
    var W = o.width || 900, H = o.height || 460;
    if(!CHART.tab || !CHART.shape) return "";
    var k = CHART.tab.kind;
    var F = CHART.font, C = ink();
    var legend = k === "stack" || k === "lines" || k === "grouped" || k === "multialpha";
    var padL = 64, padR = legend ? 210 : 28, padT = F.titleText ? 46 : 24, padB = 80;
    /* Facet headers sit above the plot, so make room for them before the
       geometry is fixed — otherwise the first group's label lands on the title. */
    if((k === "stack" || k === "alpha") && CHART.groupOn){
      var nm0 = CHART.shape.samples || CHART.shape.labels || [];
      if(nm0.some(function(x){ return (CHART.groups[x] || "").trim(); })) padT += 30;
    }
    if(k === "taxheat") padR = 150;
    if(k === "matrix")  padL = 128;
    var P = {x:padL, y:padT, w:W - padL - padR, h:H - padT - padB, C:C, F:F, W:W, H:H};
    if(P.w < 40 || P.h < 40) return "";

    var parts = ['<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H
      + '" viewBox="0 0 ' + W + ' ' + H + '" font-family="IBM Plex Sans, system-ui, sans-serif">'];
    parts.push('<rect width="' + W + '" height="' + H + '" fill="' + C.surface + '"/>');
    if(F.titleText)
      parts.push('<text x="' + padL + '" y="28" fill="' + C.fg + '" font-size="' + F.titleSize
        + '" font-weight="' + (F.titleBold ? 700 : 600) + '"'
        + (F.titleItalic ? ' font-style="italic"' : "") + '>' + esc(F.titleText) + '</text>');

    var body =
        k === "stack"      ? drawStack(P)
      : k === "taxheat"    ? drawTaxHeat(P)
      : k === "matrix"     ? drawMatrix(P)
      : k === "dendro"     ? drawDendro(P)
      : k === "alpha"      ? drawBars(P)
      : k === "scree"      ? drawScree(P)
      : k === "grouped"    ? drawGrouped(P)
      : k === "multialpha" ? drawMulti(P)
      : k === "scatter"    ? drawScatter(P)
      : k === "lines"      ? drawLines(P)
      : k === "hist"       ? drawHist(P)
      : k === "box"        ? drawBox(P)
      : '<text x="' + padL + '" y="' + (padT + 20) + '" fill="' + C.fg2 + '">No renderer for this tab.</text>';

    parts.push(body);
    parts.push('</svg>');
    return parts.join("");
  }


  /* ── faceting ────────────────────────────────────────────────────────────
     Split the x axis into one band per group, each band sized to how many
     samples it holds, with a header strip above it — the layout of the
     reference figure (Normal | Stage B1).

     ONE y axis, shared across the bands. Giving each facet its own scale would
     make the panels look comparable while plotting them on different rulers,
     which is the single worst thing a grouped chart can do.

     Group order follows first appearance in the sample order, so dragging a
     sample also moves its group — rather than groups silently re-sorting
     alphabetically under the user. */
  function groupsOf(names, ord){
    if(!CHART.groupOn) return null;
    var any = ord.some(function(i){ return (CHART.groups[names[i]] || "").trim(); });
    if(!any) return null;
    var seen = {}, out = [];
    ord.forEach(function(i){
      var g = (CHART.groups[names[i]] || "").trim() || "(no group)";
      if(!(g in seen)){ seen[g] = out.length; out.push({name:g, idx:[]}); }
      out[seen[g]].idx.push(i);
    });
    return out.length > 1 ? out : null;
  }

  /* Band geometry. Each band gets width in proportion to its sample count, so
     a bar is the same width everywhere — a group with two samples must not get
     bars twice as wide as a group with four. */
  function bands(P, groups, gap){
    gap = gap === undefined ? 26 : gap;
    var total = groups.reduce(function(a, g){ return a + g.idx.length; }, 0) || 1;
    var usable = P.w - gap * (groups.length - 1);
    var x = P.x, out = [];
    groups.forEach(function(g){
      var w = usable * g.idx.length / total;
      out.push({g:g, x:x, w:w});
      x += w + gap;
    });
    return out;
  }

  function facetHeader(P, b){
    var h = 22, y = P.y - h - 6;
    return '<rect x="' + b.x.toFixed(1) + '" y="' + y + '" width="' + b.w.toFixed(1)
      + '" height="' + h + '" rx="4" fill="' + P.C.surface3 + '" stroke="' + P.C.line
      + '" stroke-width="1"/>'
      + '<text x="' + (b.x + b.w/2).toFixed(1) + '" y="' + (y + 15)
      + '" text-anchor="middle" fill="' + P.C.fg + '" font-size="'
      + Math.max(10, P.F.legendSize) + '" font-weight="600">'
      + esc(b.g.name.length > 28 ? b.g.name.slice(0, 27) + "…" : b.g.name) + '</text>';
  }

  /* shared y axis; returns {html, scale(v)->y} */
  function yAxis(P, yMax, label, fmt){
    var out = [], ticks = 5;
    for(var t = 0; t <= ticks; t++){
      var v = yMax * t / ticks, y = P.y + P.h - (P.h * t / ticks);
      if(P.F.showGrid && t > 0)
        out.push('<line x1="' + P.x + '" y1="' + y.toFixed(1) + '" x2="' + (P.x + P.w)
          + '" y2="' + y.toFixed(1) + '" stroke="' + P.C.line + '" stroke-width="1"/>');
      out.push('<text x="' + (P.x - 10) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" fill="'
        + P.C.fg2 + '" font-size="' + P.F.axisSize + '">' + (fmt ? fmt(v) : shortNum(v)) + '</text>');
    }
    out.push('<line x1="' + P.x + '" y1="' + (P.y + P.h) + '" x2="' + (P.x + P.w) + '" y2="'
      + (P.y + P.h) + '" stroke="' + P.C.line + '" stroke-width="1"/>');
    if(label) out.push('<text transform="translate(16,' + (P.y + P.h/2) + ') rotate(-90)" '
      + 'text-anchor="middle" fill="' + P.C.fg2 + '" font-size="' + P.F.axisSize + '">'
      + esc(label) + '</text>');
    return out.join("");
  }

  function xTick(P, cx, text){
    return '<text x="' + cx + '" y="' + (P.y + P.h + 18) + '" text-anchor="end" fill="' + P.C.fg2
      + '" font-size="' + P.F.xSize + '"' + (P.F.xItalic ? ' font-style="italic"' : "")
      + (P.F.xBold ? ' font-weight="700"' : "")
      + ' transform="rotate(-35 ' + cx + ' ' + (P.y + P.h + 18) + ')">' + esc(text) + '</text>';
  }

  function legendBox(P, items){
    var out = [], ly = P.y + 2;
    items.forEach(function(it){
      out.push('<rect x="' + (P.x + P.w + 22) + '" y="' + ly + '" width="11" height="11" rx="2.5" fill="'
        + it.c + '"/>');
      var nm = it.n.length > 26 ? it.n.slice(0, 25) + "…" : it.n;
      out.push('<text x="' + (P.x + P.w + 39) + '" y="' + (ly + 10) + '" fill="' + P.C.fg
        + '" font-size="' + P.F.legendSize + '">' + esc(nm) + '</text>');
      ly += 18;
    });
    return {html:out.join(""), y:ly};
  }

  function drawStack(P){
    var S = series(), SH = CHART.shape, ord = visibleIdx(SH.samples), F = P.F;
    var pct = F.chartType === "bar100";
    var totals = ord.map(function(si){
      return S.reduce(function(a,s){ return a + (s.values[si]||0); }, 0); });
    var yMax = pct ? 100 : niceMax(Math.max.apply(null, totals.concat([1])));
    var out = [yAxis(P, yMax, pct ? "Relative abundance (%)" : "Reads",
                     pct ? function(v){ return v.toFixed(0); } : null)];

    /* Lay the samples out either across the whole plot, or band by band when a
       grouping is set. Both paths produce the same per-sample geometry, so the
       bar drawing below does not need to know which one it is in. */
    var G = groupsOf(SH.samples, ord);
    var pos = {};   /* sample index -> {x, bw} */
    if(G){
      bands(P, G).forEach(function(b){
        out.push(facetHeader(P, b));
        var n2 = b.g.idx.length || 1, slot2 = b.w / n2;
        var bw2 = Math.min(76, slot2 * 0.62);
        b.g.idx.forEach(function(si, k2){
          pos[si] = {x: b.x + slot2*k2 + (slot2 - bw2)/2, bw: bw2};
        });
      });
    } else {
      var n = ord.length || 1, slot = P.w / n, bw0 = Math.min(76, slot * 0.62);
      ord.forEach(function(si, k){ pos[si] = {x: P.x + slot*k + (slot - bw0)/2, bw: bw0}; });
    }

    var GAP = 2;
    ord.forEach(function(si, k){
      var x = pos[si].x, bw = pos[si].bw, total = totals[k] || 0, acc = 0, drawn = [];
      S.forEach(function(s, i){
        var v = s.values[si] || 0; if(v <= 0) return;
        var frac = total > 0 ? v / total : 0;
        var h = (pct ? frac * 100 : v) / yMax * P.h;
        drawn.push({s:s, i:i, v:v, frac:frac, h:h, y0:acc}); acc += h;
      });
      drawn.forEach(function(d, j){
        var yTop = P.y + P.h - d.y0 - d.h;
        var h = Math.max(0, d.h - (j < drawn.length - 1 ? GAP : 0));
        if(h <= 0) return;
        var top = j === drawn.length - 1, bot = j === 0;
        var gnm = (CHART.groups[SH.samples[si]] || "").trim();
        out.push('<path d="' + roundRect(x, yTop, bw, h, top ? 4 : 0, bot ? 4 : 0)
          + '" fill="' + colourOf(d.s, d.i) + '" class="seg"><title>' + esc(d.s.name) + ' · '
          + esc(labelOf(SH.samples[si])) + (gnm ? ' (' + esc(gnm) + ')' : "")
          + '\n' + nfmt(d.v) + ' reads · ' + (d.frac*100).toFixed(1) + '%</title></path>');
      });
      out.push(xTick(P, x + bw/2, labelOf(SH.samples[si])));
    });
    var L = legendBox(P, S.map(function(s,i){ return {n:s.name, c:colourOf(s,i)}; }));
    out.push(L.html);
    if(S.length && S[S.length-1].grouped)
      out.push('<text x="' + (P.x + P.w + 22) + '" y="' + (L.y + 10) + '" fill="' + P.C.fg3
        + '" font-size="' + Math.max(9, P.F.legendSize - 1) + '">'
        + esc(S[S.length-1].members + " more" + (S[S.length-1].hasNA ? ", plus unassigned" : ""))
        + '</text>');
    return out.join("");
  }

  function drawTaxHeat(P){
    var S = series().filter(function(s){ return !s.grouped; });
    var SH = CHART.shape, ord = visibleIdx(SH.samples);
    if(!S.length) return "";
    /* Row-normalised: each taxon against its own maximum, which is what makes
       a low-abundance taxon's pattern across samples visible at all. Said on
       the axis so nobody reads the colours as comparable between rows. */
    var out = [], cw = P.w / (ord.length || 1), ch = P.h / S.length;
    S.forEach(function(s, ri){
      var mx = Math.max.apply(null, ord.map(function(si){ return s.values[si]||0; }).concat([1]));
      ord.forEach(function(si, ci){
        var v = s.values[si] || 0, t = v / mx;
        var col = rampColour(P.F.colorscale, t);
        out.push('<rect x="' + (P.x + ci*cw + 1).toFixed(1) + '" y="' + (P.y + ri*ch + 1).toFixed(1)
          + '" width="' + Math.max(0, cw-2).toFixed(1) + '" height="' + Math.max(0, ch-2).toFixed(1)
          + '" rx="2" fill="' + col + '" class="seg"><title>' + esc(s.name) + ' · '
          + esc(labelOf(SH.samples[si])) + '\n' + nfmt(v) + ' reads · '
          + (t*100).toFixed(0) + '% of this taxon’s max</title></rect>');
      });
      out.push('<text x="' + (P.x + P.w + 10) + '" y="' + (P.y + ri*ch + ch/2 + 4) + '" fill="'
        + P.C.fg + '" font-size="' + Math.min(P.F.legendSize, Math.max(7, ch - 3)) + '">'
        + esc(s.name.length > 22 ? s.name.slice(0,21) + "…" : s.name) + '</text>');
    });
    ord.forEach(function(si, ci){ out.push(xTick(P, P.x + ci*cw + cw/2, labelOf(SH.samples[si]))); });
    out.push(rampLegend(P, "row max", 0, 1));
    return out.join("");
  }

  function drawMatrix(P){
    var SH = CHART.shape, ord = visibleIdx(SH.names);
    var flat = [];
    SH.m.forEach(function(r){ r.forEach(function(v){ if(isFinite(v)) flat.push(v); }); });
    var lo = Math.min.apply(null, flat), hi = Math.max.apply(null, flat);
    if(!isFinite(lo)) { lo = 0; hi = 1; }
    var out = [], cw = P.w / (ord.length||1), ch = P.h / (ord.length||1);
    ord.forEach(function(ri, i){
      ord.forEach(function(ci, j){
        var v = (SH.m[ri] || [])[ci];
        var t = hi > lo ? (v - lo) / (hi - lo) : 0;
        var col = rampColour(P.F.colorscale, t);
        out.push('<rect x="' + (P.x + j*cw + 1).toFixed(1) + '" y="' + (P.y + i*ch + 1).toFixed(1)
          + '" width="' + Math.max(0,cw-2).toFixed(1) + '" height="' + Math.max(0,ch-2).toFixed(1)
          + '" rx="2" fill="' + col + '" class="seg"><title>' + esc(labelOf(SH.names[ri])) + ' ↔ '
          + esc(labelOf(SH.names[ci])) + '\n' + (isFinite(v) ? v.toFixed(3) : "—") + '</title></rect>');
        if(cw > 54 && ch > 22)
          out.push('<text x="' + (P.x + j*cw + cw/2) + '" y="' + (P.y + i*ch + ch/2 + 4)
            + '" text-anchor="middle" fill="' + onColour(col) + '" font-size="'
            + Math.min(11, P.F.axisSize) + '">' + (isFinite(v) ? v.toFixed(2) : "—") + '</text>');
      });
      out.push('<text x="' + (P.x - 10) + '" y="' + (P.y + i*ch + ch/2 + 4) + '" text-anchor="end" fill="'
        + P.C.fg2 + '" font-size="' + P.F.axisSize + '">' + esc(labelOf(SH.names[ri])) + '</text>');
      out.push(xTick(P, P.x + i*cw + cw/2, labelOf(SH.names[ri])));
    });
    out.push(rampLegend(P, "", lo, hi));
    return out.join("");
  }

  function rampLegend(P, note, lo, hi){
    var x = P.x + P.w + (CHART.tab.kind === "taxheat" ? 96 : 14), y = P.y, h = Math.min(160, P.h);
    var out = ['<defs><linearGradient id="rmp" x1="0" y1="1" x2="0" y2="0">'];
    (SCALES[P.F.colorscale] || SCALES.Viridis).forEach(function(c, i, a){
      out.push('<stop offset="' + (i/(a.length-1)*100).toFixed(0) + '%" stop-color="' + c + '"/>');
    });
    out.push('</linearGradient></defs>');
    out.push('<rect x="' + x + '" y="' + y + '" width="12" height="' + h + '" rx="2" fill="url(#rmp)"/>');
    out.push('<text x="' + (x + 17) + '" y="' + (y + 9) + '" fill="' + P.C.fg2 + '" font-size="'
      + Math.max(9, P.F.legendSize - 1) + '">' + esc(fmtNum(hi)) + '</text>');
    out.push('<text x="' + (x + 17) + '" y="' + (y + h) + '" fill="' + P.C.fg2 + '" font-size="'
      + Math.max(9, P.F.legendSize - 1) + '">' + esc(fmtNum(lo)) + '</text>');
    if(note) out.push('<text x="' + x + '" y="' + (y + h + 18) + '" fill="' + P.C.fg3
      + '" font-size="' + Math.max(9, P.F.legendSize - 1) + '">' + esc(note) + '</text>');
    return out.join("");
  }
  function fmtNum(v){ return Math.abs(v) >= 1000 ? shortNum(v) : (Math.round(v*100)/100).toString(); }

  function drawBars(P){
    var SH = CHART.shape, F = P.F;
    var ci = CHART.tab.metric ? SH.cols.map(function(c){ return c.toLowerCase(); })
                 .indexOf(CHART.tab.metric.toLowerCase()) : 0;
    if(ci === -1) ci = 0;
    var ord = visibleIdx(SH.labels);
    var vals = ord.map(function(i){ return (SH.vals[i]||[])[ci] || 0; });
    var yMax = niceMax(Math.max.apply(null, vals.concat([1])));
    var out = [yAxis(P, yMax, SH.cols[ci] || "Value")];
    var G = groupsOf(SH.labels, ord);
    var pos = {};
    if(G){
      bands(P, G).forEach(function(b){
        out.push(facetHeader(P, b));
        var n2 = b.g.idx.length || 1, slot2 = b.w / n2, bw2 = Math.min(84, slot2*0.56);
        b.g.idx.forEach(function(si, k2){
          pos[si] = {x: b.x + slot2*k2 + (slot2 - bw2)/2, bw: bw2}; });
      });
    } else {
      var n = ord.length||1, slot = P.w/n, bw0 = Math.min(84, slot*0.56);
      ord.forEach(function(si, k){ pos[si] = {x: P.x + slot*k + (slot-bw0)/2, bw: bw0}; });
    }
    /* One series, so no legend box — the axis label names it. Colour by entity
       so a sample keeps its hue across every alpha tab. */
    ord.forEach(function(si, k){
      var v = vals[k], h = v / yMax * P.h, x = pos[si].x, bw = pos[si].bw;
      var nm = SH.labels[si];
      var col = CHART.colors[nm] || seriesPalette()[si % seriesPalette().length];
      out.push('<path d="' + roundRect(x, P.y + P.h - h, bw, h, 4, 0) + '" fill="' + col
        + '" class="seg"><title>' + esc(labelOf(nm)) + '\n' + esc(SH.cols[ci]) + ': '
        + fmtNum(v) + '</title></path>');
      out.push('<text x="' + (x + bw/2) + '" y="' + (P.y + P.h - h - 7) + '" text-anchor="middle" fill="'
        + P.C.fg2 + '" font-size="' + Math.max(9, P.F.axisSize - 1) + '">' + esc(fmtNum(v)) + '</text>');
      out.push(xTick(P, x + bw/2, labelOf(nm)));
    });
    return out.join("");
  }

  function drawScree(P){
    var SH = CHART.shape;
    var vals = SH.vals.map(function(v){ return v[0] || 0; });
    var yMax = niceMax(Math.max.apply(null, vals.concat([1])));
    var out = [yAxis(P, yMax, SH.cols[0] || "Variance explained")];
    var n = vals.length||1, slot = P.w/n, bw = Math.min(54, slot*0.6);
    vals.forEach(function(v, k){
      var h = v / yMax * P.h, x = P.x + slot*k + (slot-bw)/2;
      out.push('<path d="' + roundRect(x, P.y + P.h - h, bw, h, 4, 0) + '" fill="'
        + seriesPalette()[0] + '" class="seg"><title>' + esc(SH.labels[k]) + '\n'
        + fmtNum(v) + '</title></path>');
      out.push(xTick(P, x + bw/2, SH.labels[k]));
    });
    return out.join("");
  }

  function drawGrouped(P){
    var SH = CHART.shape, ord = visibleIdx(SH.labels);
    var mx = 0;
    ord.forEach(function(i){ (SH.vals[i]||[]).forEach(function(v){ if(v > mx) mx = v; }); });
    var yMax = niceMax(mx || 1);
    var out = [yAxis(P, yMax, "Reads")];
    var n = ord.length||1, slot = P.w/n, inner = Math.min(78, slot*0.74);
    var bw = Math.max(2, (inner - 2*(SH.cols.length-1)) / SH.cols.length);
    ord.forEach(function(si, k){
      var x0 = P.x + slot*k + (slot-inner)/2;
      SH.cols.forEach(function(c, ci){
        var v = (SH.vals[si]||[])[ci] || 0, h = v / yMax * P.h;
        var x = x0 + ci*(bw+2);
        out.push('<path d="' + roundRect(x, P.y + P.h - h, bw, h, 3, 0) + '" fill="'
          + (CHART.colors[c] || seriesPalette()[ci % seriesPalette().length])
          + '" class="seg"><title>' + esc(labelOf(SH.labels[si])) + ' · ' + esc(c) + '\n'
          + nfmt(v) + '</title></path>');
      });
      out.push(xTick(P, x0 + inner/2, labelOf(SH.labels[si])));
    });
    out.push(legendBox(P, SH.cols.map(function(c, i){
      return {n:c, c:CHART.colors[c] || seriesPalette()[i % seriesPalette().length]}; })).html);
    return out.join("");
  }

  /* Small multiples: the right answer for several measures on different
     scales, and the reason this app never needs a second y axis. */
  function drawMulti(P){
    var SH = CHART.shape, ord = visibleIdx(SH.labels);
    var cols = SH.cols.slice(0, 6);
    var cw = P.w / cols.length, out = [];
    cols.forEach(function(c, ci){
      var vals = ord.map(function(i){ return (SH.vals[i]||[])[ci] || 0; });
      var yMax = niceMax(Math.max.apply(null, vals.concat([1])));
      var x0 = P.x + ci*cw + 8, w = cw - 16;
      out.push('<text x="' + (x0 + w/2) + '" y="' + (P.y - 6) + '" text-anchor="middle" fill="'
        + P.C.fg + '" font-size="' + P.F.legendSize + '" font-weight="600">' + esc(c) + '</text>');
      out.push('<line x1="' + x0 + '" y1="' + (P.y + P.h) + '" x2="' + (x0 + w) + '" y2="'
        + (P.y + P.h) + '" stroke="' + P.C.line + '" stroke-width="1"/>');
      var slot = w / (ord.length||1), bw = Math.min(26, slot*0.6);
      ord.forEach(function(si, k){
        var v = vals[k], h = v / yMax * P.h, x = x0 + slot*k + (slot-bw)/2;
        var nm = SH.labels[si];
        out.push('<path d="' + roundRect(x, P.y + P.h - h, bw, h, 3, 0) + '" fill="'
          + (CHART.colors[nm] || seriesPalette()[si % seriesPalette().length])
          + '" class="seg"><title>' + esc(labelOf(nm)) + ' · ' + esc(c) + '\n'
          + fmtNum(v) + '</title></path>');
      });
    });
    out.push(legendBox(P, ord.map(function(si){
      return {n:labelOf(SH.labels[si]),
              c:CHART.colors[SH.labels[si]] || seriesPalette()[si % seriesPalette().length]}; })).html);
    return out.join("");
  }

  function drawScatter(P){
    var SH = CHART.shape;
    var pts = SH.pts.filter(function(p){ return !CHART.hidden[p.name]; });
    if(!pts.length) return "";
    var xs = pts.map(function(p){ return p.x; }), ys = pts.map(function(p){ return p.y; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var padx = (x1-x0||1)*0.12, pady = (y1-y0||1)*0.12;
    x0 -= padx; x1 += padx; y0 -= pady; y1 += pady;
    var sx = function(v){ return P.x + (v - x0)/(x1-x0) * P.w; };
    var sy = function(v){ return P.y + P.h - (v - y0)/(y1-y0) * P.h; };
    var out = [];
    if(P.F.showGrid)
      for(var t = 0; t <= 4; t++){
        var gy = P.y + P.h*t/4, gx = P.x + P.w*t/4;
        out.push('<line x1="' + P.x + '" y1="' + gy + '" x2="' + (P.x+P.w) + '" y2="' + gy
          + '" stroke="' + P.C.line + '" stroke-width="1"/>');
        out.push('<line x1="' + gx + '" y1="' + P.y + '" x2="' + gx + '" y2="' + (P.y+P.h)
          + '" stroke="' + P.C.line + '" stroke-width="1"/>');
      }
    /* zero lines, which is where an ordination is read from */
    if(x0 < 0 && x1 > 0) out.push('<line x1="' + sx(0) + '" y1="' + P.y + '" x2="' + sx(0)
      + '" y2="' + (P.y+P.h) + '" stroke="' + P.C.fg3 + '" stroke-width="1" stroke-dasharray="3 3"/>');
    if(y0 < 0 && y1 > 0) out.push('<line x1="' + P.x + '" y1="' + sy(0) + '" x2="' + (P.x+P.w)
      + '" y2="' + sy(0) + '" stroke="' + P.C.fg3 + '" stroke-width="1" stroke-dasharray="3 3"/>');
    pts.forEach(function(p, i){
      var col = CHART.colors[p.name] || seriesPalette()[i % seriesPalette().length];
      /* 2px surface ring so overlapping points stay countable */
      out.push('<circle cx="' + sx(p.x).toFixed(1) + '" cy="' + sy(p.y).toFixed(1)
        + '" r="7" fill="' + col + '" stroke="' + P.C.surface + '" stroke-width="2" class="seg">'
        + '<title>' + esc(labelOf(p.name)) + '\n' + esc(SH.xLab) + ' ' + p.x.toFixed(3)
        + '\n' + esc(SH.yLab) + ' ' + p.y.toFixed(3) + '</title></circle>');
      out.push('<text x="' + (sx(p.x)+11).toFixed(1) + '" y="' + (sy(p.y)+4).toFixed(1) + '" fill="'
        + P.C.fg + '" font-size="' + P.F.legendSize + '">' + esc(labelOf(p.name)) + '</text>');
    });
    out.push('<line x1="' + P.x + '" y1="' + (P.y+P.h) + '" x2="' + (P.x+P.w) + '" y2="' + (P.y+P.h)
      + '" stroke="' + P.C.line + '" stroke-width="1"/>');
    out.push('<text x="' + (P.x+P.w/2) + '" y="' + (P.y+P.h+40) + '" text-anchor="middle" fill="'
      + P.C.fg2 + '" font-size="' + P.F.axisSize + '">' + esc(SH.xLab) + '</text>');
    out.push('<text transform="translate(16,' + (P.y+P.h/2) + ') rotate(-90)" text-anchor="middle" fill="'
      + P.C.fg2 + '" font-size="' + P.F.axisSize + '">' + esc(SH.yLab) + '</text>');
    return out.join("");
  }

  function drawLines(P){
    var SH = CHART.shape;
    var sers = SH.series.slice(0, 24);
    var mx = 0;
    SH.ys.forEach(function(row){ sers.forEach(function(_, i){ if(row[i] > mx) mx = row[i]; }); });
    var yMax = niceMax(mx || 1);
    var xmin = Math.min.apply(null, SH.xs), xmax = Math.max.apply(null, SH.xs);
    var sx = function(v){ return P.x + (xmax > xmin ? (v-xmin)/(xmax-xmin) : 0) * P.w; };
    var sy = function(v){ return P.y + P.h - v/yMax * P.h; };
    var out = [yAxis(P, yMax, SH.series.length === 1 ? SH.series[0] : "Value")];
    sers.forEach(function(s, i){
      var col = CHART.colors[s] || seriesPalette()[i % seriesPalette().length];
      var d = SH.xs.map(function(x, k){
        return (k ? "L" : "M") + sx(x).toFixed(1) + "," + sy(SH.ys[k][i] || 0).toFixed(1); }).join("");
      out.push('<path d="' + d + '" fill="none" stroke="' + col
        + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" class="seg">'
        + '<title>' + esc(s) + '</title></path>');
    });
    for(var t = 0; t <= 4; t++){
      var xv = xmin + (xmax-xmin)*t/4;
      out.push(xTick(P, sx(xv), shortNum(xv)));
    }
    out.push('<text x="' + (P.x+P.w/2) + '" y="' + (P.y+P.h+48) + '" text-anchor="middle" fill="'
      + P.C.fg2 + '" font-size="' + P.F.axisSize + '">' + esc(SH.xLab || "") + '</text>');
    if(sers.length > 1)
      out.push(legendBox(P, sers.slice(0, 12).map(function(s, i){
        return {n:s, c:CHART.colors[s] || seriesPalette()[i % seriesPalette().length]}; })).html);
    return out.join("");
  }

  function drawHist(P){
    var SH = CHART.shape;
    var vals = SH.ys.map(function(r){ return r[0] || 0; });
    var yMax = niceMax(Math.max.apply(null, vals.concat([1])));
    var out = [yAxis(P, yMax, SH.series[0] || "Count")];
    var n = vals.length||1, bw = Math.max(1, P.w/n - 1);
    vals.forEach(function(v, k){
      var h = v/yMax * P.h, x = P.x + (P.w/n)*k;
      out.push('<path d="' + roundRect(x, P.y + P.h - h, bw, h, Math.min(3, bw/2), 0) + '" fill="'
        + seriesPalette()[0] + '" class="seg"><title>' + esc(SH.xLab) + ' ' + SH.xs[k]
        + '\n' + nfmt(v) + '</title></path>');
    });
    for(var t = 0; t <= 4; t++){
      var k = Math.round((n-1)*t/4);
      out.push(xTick(P, P.x + (P.w/n)*k + bw/2, String(SH.xs[k])));
    }
    out.push('<text x="' + (P.x+P.w/2) + '" y="' + (P.y+P.h+48) + '" text-anchor="middle" fill="'
      + P.C.fg2 + '" font-size="' + P.F.axisSize + '">' + esc(SH.xLab || "") + '</text>');
    return out.join("");
  }

  function drawBox(P){
    var SH = CHART.shape, ord = visibleIdx(SH.labels);
    var all = [];
    ord.forEach(function(i){ (SH.vals[i]||[]).forEach(function(v){ all.push(v); }); });
    var yMax = niceMax(Math.max.apply(null, all.concat([1])));
    var out = [yAxis(P, yMax, "Value")];
    var n = ord.length||1, slot = P.w/n, bw = Math.min(56, slot*0.42);
    ord.forEach(function(si, k){
      var v = (SH.vals[si]||[]).filter(function(x){ return isFinite(x); }).sort(function(a,b){ return a-b; });
      if(!v.length) return;
      function q(p){ var i = (v.length-1)*p, lo = Math.floor(i), hi = Math.ceil(i);
                     return v[lo] + (v[hi]-v[lo])*(i-lo); }
      var q1 = q(0.25), med = q(0.5), q3 = q(0.75), lo = v[0], hi = v[v.length-1];
      var cx = P.x + slot*k + slot/2;
      var sy = function(y){ return P.y + P.h - y/yMax*P.h; };
      var col = CHART.colors[SH.labels[si]] || seriesPalette()[si % seriesPalette().length];
      out.push('<line x1="' + cx + '" y1="' + sy(hi) + '" x2="' + cx + '" y2="' + sy(lo)
        + '" stroke="' + P.C.fg3 + '" stroke-width="1.5"/>');
      out.push('<rect x="' + (cx-bw/2) + '" y="' + sy(q3) + '" width="' + bw + '" height="'
        + Math.max(1, sy(q1)-sy(q3)) + '" rx="3" fill="' + col + '" opacity=".85" class="seg">'
        + '<title>' + esc(labelOf(SH.labels[si])) + '\nmedian ' + fmtNum(med)
        + '\nIQR ' + fmtNum(q1) + '–' + fmtNum(q3) + '\nrange ' + fmtNum(lo) + '–' + fmtNum(hi)
        + '</title></rect>');
      out.push('<line x1="' + (cx-bw/2) + '" y1="' + sy(med) + '" x2="' + (cx+bw/2) + '" y2="'
        + sy(med) + '" stroke="' + P.C.surface + '" stroke-width="2"/>');
      out.push(xTick(P, cx, labelOf(SH.labels[si])));
    });
    return out.join("");
  }

  /* UPGMA, computed here from the distance matrix rather than read from a
     picture. Average linkage, same as the pipeline's hclust(method="average"). */
  function drawDendro(P){
    var SH = CHART.shape, names = SH.names.slice();
    var n = names.length;
    if(n < 2) return '<text x="' + P.x + '" y="' + (P.y+20) + '" fill="' + P.C.fg2
      + '">A dendrogram needs at least two samples.</text>';
    var clusters = names.map(function(nm, i){ return {leaves:[i], h:0, x:null, kids:null}; });
    var D = SH.m.map(function(r){ return r.slice(); });
    function dist(a, b){
      var s = 0, c = 0;
      a.leaves.forEach(function(i){ b.leaves.forEach(function(j){
        var v = (D[i]||[])[j]; if(isFinite(v)){ s += v; c++; } }); });
      return c ? s/c : 0;
    }
    while(clusters.length > 1){
      var bi = 0, bj = 1, bd = Infinity;
      for(var i = 0; i < clusters.length; i++)
        for(var j = i+1; j < clusters.length; j++){
          var d = dist(clusters[i], clusters[j]);
          if(d < bd){ bd = d; bi = i; bj = j; }
        }
      var merged = {leaves:clusters[bi].leaves.concat(clusters[bj].leaves), h:bd,
                    kids:[clusters[bi], clusters[bj]]};
      clusters = clusters.filter(function(_, k){ return k !== bi && k !== bj; });
      clusters.push(merged);
    }
    var root = clusters[0];
    var maxH = root.h || 1;
    var leafOrder = [];
    (function walk(c){ if(!c.kids) leafOrder.push(c.leaves[0]); else c.kids.forEach(walk); })(root);
    var step = P.h / (leafOrder.length || 1);
    var out = [];
    var sx = function(h){ return P.x + P.w - (h / maxH) * (P.w - 12); };
    (function place(c){
      if(!c.kids){ c.y = P.y + step * (leafOrder.indexOf(c.leaves[0]) + 0.5); c.x = P.x + P.w; return c.y; }
      var ys = c.kids.map(place);
      c.y = (ys[0] + ys[1]) / 2; c.x = sx(c.h);
      out.push('<path d="M' + c.kids[0].x.toFixed(1) + ',' + ys[0].toFixed(1)
        + 'H' + c.x.toFixed(1) + 'V' + ys[1].toFixed(1) + 'H' + c.kids[1].x.toFixed(1)
        + '" fill="none" stroke="' + P.C.fg2 + '" stroke-width="1.6" class="seg">'
        + '<title>joins at ' + c.h.toFixed(3) + '</title></path>');
      return c.y;
    })(root);
    leafOrder.forEach(function(li, k){
      var y = P.y + step*(k + 0.5);
      var col = CHART.colors[names[li]] || seriesPalette()[li % seriesPalette().length];
      out.push('<circle cx="' + (P.x + P.w) + '" cy="' + y.toFixed(1) + '" r="4" fill="' + col + '"/>');
      out.push('<text x="' + (P.x + P.w + 10) + '" y="' + (y + 4).toFixed(1) + '" fill="' + P.C.fg
        + '" font-size="' + P.F.legendSize + '">' + esc(labelOf(names[li])) + '</text>');
    });
    out.push('<text x="' + P.x + '" y="' + (P.y + P.h + 24) + '" fill="' + P.C.fg3
      + '" font-size="' + P.F.axisSize + '">average linkage · height = distance, '
      + maxH.toFixed(2) + ' at the root</text>');
    return out.join("");
  }

  function niceMax(v){
    if(!isFinite(v) || v <= 0) return 1;
    var mag = Math.pow(10, Math.floor(Math.log(v)/Math.LN10));
    return Math.ceil(v / (mag/2)) * (mag/2);
  }
  function roundRect(x, y, w, h, rT, rB){
    rT = Math.min(rT, h/2, w/2); rB = Math.min(rB, h/2, w/2);
    return "M" + (x+rT) + "," + y + "h" + (w-2*rT) + "a" + rT + "," + rT + " 0 0 1 " + rT + "," + rT
      + "v" + (h-rT-rB) + "a" + rB + "," + rB + " 0 0 1 " + (-rB) + "," + rB
      + "h" + (-(w-2*rB)) + "a" + rB + "," + rB + " 0 0 1 " + (-rB) + "," + (-rB)
      + "v" + (-(h-rT-rB)) + "a" + rT + "," + rT + " 0 0 1 " + rT + "," + (-rT) + "z";
  }
  function shortNum(v){
    if(Math.abs(v) >= 1e6) return (v/1e6).toFixed(Math.abs(v) >= 1e7 ? 0 : 1) + "M";
    if(Math.abs(v) >= 1e3) return (v/1e3).toFixed(Math.abs(v) >= 1e4 ? 0 : 1) + "k";
    return String(Math.round(v*100)/100);
  }

  /* The table view. Not a nicety: three light-mode palette slots sit below 3:1
     against the surface, and the rule for that is relief — a reader who cannot
     separate two fills must be able to read the numbers somewhere. */
  function chartTable(){
    var k = CHART.tab.kind, S = CHART.shape;
    if(k === "stack" || k === "taxheat"){
      var ser = series(), ord = visibleIdx(S.samples);
      var pct = CHART.font.chartType === "bar100" && k === "stack";
      var tot = ord.map(function(si){
        return ser.reduce(function(a,s){ return a + (s.values[si]||0); }, 0); });
      return tbl(["Taxon"].concat(ord.map(function(si){ return labelOf(S.samples[si]); })),
        ser.map(function(s, i){
          return [swatch(colourOf(s,i)) + esc(s.name)].concat(ord.map(function(si, c){
            var v = s.values[si] || 0;
            return pct && tot[c] > 0 ? (v/tot[c]*100).toFixed(1) + "%" : nfmt(v); })); }));
    }
    if(k === "matrix" || k === "dendro"){
      var o2 = visibleIdx(S.names);
      return tbl([""].concat(o2.map(function(i){ return labelOf(S.names[i]); })),
        o2.map(function(ri){
          return [esc(labelOf(S.names[ri]))].concat(o2.map(function(ci){
            var v = (S.m[ri]||[])[ci];
            return isFinite(v) ? v.toFixed(3) : "—"; })); }));
    }
    if(k === "scatter"){
      return tbl(["Sample", S.xLab, S.yLab],
        S.pts.filter(function(p){ return !CHART.hidden[p.name]; }).map(function(p, i){
          return [swatch(CHART.colors[p.name] || seriesPalette()[i % seriesPalette().length])
                  + esc(labelOf(p.name)), p.x.toFixed(4), p.y.toFixed(4)]; }));
    }
    if(k === "lines" || k === "hist"){
      return tbl([S.xLab].concat(S.series),
        S.xs.map(function(x, k2){
          return [String(x)].concat(S.ys[k2].map(function(v){ return fmtNum(v); })); }));
    }
    var o3 = visibleIdx(S.labels);
    return tbl(["Sample"].concat(S.cols),
      o3.map(function(si){
        return [swatch(CHART.colors[S.labels[si]] || seriesPalette()[si % seriesPalette().length])
                + esc(labelOf(S.labels[si]))]
          .concat((S.vals[si]||[]).map(function(v){ return fmtNum(v); })); }));
  }
  function swatch(c){
    return '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'
      + c + ';margin-right:7px"></span>';
  }
  function tbl(head, rows){
    return '<div class="tblwrap"><table class="dtab"><thead><tr>'
      + head.map(function(h, i){
          return '<th' + (i ? ' style="text-align:right"' : "") + '>' + esc(h) + '</th>'; }).join("")
      + '</tr></thead><tbody>'
      + rows.map(function(r){
          return '<tr>' + r.map(function(c, i){
            return '<td' + (i ? ' class="n"' : "") + '>' + c + '</td>'; }).join("") + '</tr>'; }).join("")
      + '</tbody></table></div>';
  }

  /* ── the editor shell ────────────────────────────────────────────────── */
  function paintCharts(){
    var body = document.getElementById("cBody");
    if(!body) return;
    var sub = document.getElementById("cSub");
    var T = CHART.tab, F = CHART.font;

    var tabsHtml = TAB_GROUPS.map(function(g){
      var items = CHART.tabs.filter(function(t){ return t.g === g; });
      if(!items.length) return "";
      return '<div class="tabrow"><span class="tabg">' + esc(g) + '</span>'
        + items.map(function(t){
            return '<button class="tabb' + (T && t.id === T.id ? " on" : "") + '" data-tab="'
              + esc(t.id) + '">' + esc(t.label) + '</button>'; }).join("")
        + '</div>';
    }).join("");

    if(sub){
      if(CHART.loading) sub.textContent = "Reading " + (T ? T.f : "") + "…";
      else if(CHART.err) sub.textContent = "";
      else {
        var bits = [];
        if(CHART.shape.taxa) bits.push(CHART.shape.taxa.length + " taxa × "
          + CHART.shape.samples.length + " samples, read as <b>" + esc(CHART.orientation) + "</b>");
        else if(CHART.shape.labels) bits.push(CHART.shape.labels.length + " rows × "
          + CHART.shape.cols.length + " columns");
        else if(CHART.shape.pts) bits.push(CHART.shape.pts.length + " points");
        else if(CHART.shape.names) bits.push(CHART.shape.names.length + " × "
          + CHART.shape.names.length + " matrix");
        else if(CHART.shape.xs) bits.push(CHART.shape.xs.length + " points × "
          + CHART.shape.series.length + " series");
        bits.push('from <span class="mono">' + esc(T.f) + '</span>');
        sub.innerHTML = bits.join(" · ");
      }
    }

    var canvas = CHART.loading ? '<div class="skel">Loading ' + esc(T ? T.f : "") + '…</div>'
      : CHART.err ? '<div class="errbox" style="border-radius:0"><b>Could not read '
          + esc(T.f) + '.</b>\n' + esc(CHART.err) + '</div>'
      : CHART.view === "chart" ? chartSVG({width:900, height:470}) : chartTable();

    body.innerHTML =
        '<div class="panel" style="margin-bottom:12px"><div class="tabbar">' + tabsHtml + '</div></div>'
      + '<div class="rescols" style="grid-template-columns:minmax(0,1fr) 330px">'
        + '<div class="panel">'
          + '<div class="resbar">'
            + '<div class="segbtns" role="group" aria-label="View">'
              + '<button class="segb' + (CHART.view === "chart" ? " on" : "") + '" data-view="chart">Chart</button>'
              + '<button class="segb' + (CHART.view === "table" ? " on" : "") + '" data-view="table">Table</button>'
            + '</div><span class="sp"></span>'
            + '<button class="btn" id="pngBtn"' + (CHART.err ? " disabled" : "") + '>Download PNG</button>'
          + '</div>'
          + '<div id="canvasBox" style="padding:' + (CHART.view === "chart" ? "14px" : "0") + '">'
            + canvas + '</div>'
        + '</div>'
        + '<div class="panel">' + controlsHtml() + '</div>'
      + '</div>'
      + '<div class="runbar">'
        + '<span class="msg" id="saveMsg">Saved into the job folder as '
          + '<span class="mono">edit_charts/settings.json</span> — the same file the production '
          + 'console reads, so a palette set here opens there too.</span>'
        + '<span class="sp"></span>'
        + '<button class="btn" id="revertBtn">Revert</button>'
        + '<button class="btn pri" id="saveBtn">Save settings</button>'
      + '</div>';

    wireCharts();
  }

  function controlsHtml(){
    var T = CHART.tab, F = CHART.font;
    var S = CHART.shape || {};
    /* While a tab is loading there is no shape yet, so the per-series controls
       have nothing to list. Show the ones that do not depend on the data rather
       than guessing at the ones that do. */
    var k = (T && CHART.shape) ? T.kind : "";
    var ramped = k === "taxheat" || k === "matrix";
    var out = ['<div class="sechdr"><h3>Customise</h3><span class="hint" id="savedHint">'
      + (CHART.dirty ? "unsaved" : CHART.saved ? "saved" : "") + '</span></div>'];

    out.push('<div class="grid2" style="grid-template-columns:1fr;padding:14px;gap:13px">');
    if(k === "stack")
      out.push('<div class="f"><label for="c_type">Chart</label><select id="c_type">'
        + '<option value="bar100"' + (F.chartType === "bar100" ? " selected" : "") + '>Relative abundance (100%)</option>'
        + '<option value="bar"' + (F.chartType === "bar" ? " selected" : "") + '>Read counts</option>'
        + '</select></div>');
    if(k === "stack" || k === "taxheat")
      out.push('<div class="f"><label for="c_top">Taxa shown separately</label><select id="c_top">'
        + [4,6,8,10,12,15,20,30].map(function(n){
            return '<option value="' + n + '"' + (n === F.topNTaxa ? " selected" : "")
              + '>Top ' + n + '</option>'; }).join("")
        + '</select><span class="note" id="topNote"></span></div>');
    if(ramped){
      out.push('<div class="f"><label>Colour scale</label><div class="ramps">'
        + Object.keys(SCALES).map(function(nm){
            return '<button class="ramp' + (nm === F.colorscale ? " on" : "") + '" data-ramp="'
              + esc(nm) + '" title="' + esc(nm + (SCALE_WARN[nm] ? " — " + SCALE_WARN[nm] : ""))
              + '"><span style="background:linear-gradient(to right,' + SCALES[nm].join(",")
              + ')"></span>' + esc(nm) + '</button>'; }).join("")
        + '</div>'
        + (SCALE_WARN[F.colorscale]
            ? '<span class="note" style="color:var(--warn)"><b>' + esc(F.colorscale) + '</b> is '
              + esc(SCALE_WARN[F.colorscale]) + '. It is here because the production console offers '
              + 'it; Viridis says the same thing and survives colour-blind simulation.</span>'
            : '<span class="note">Monotonic in lightness, so the order is readable in greyscale '
              + 'and under colour-blind simulation.</span>')
        + '</div>');
    }
    out.push('<div class="f"><label for="c_title">Title</label>'
      + '<input type="text" id="c_title" value="' + esc(F.titleText) + '" placeholder="leave blank for no title"></div>');
    out.push('<div class="grid2" style="padding:0;gap:10px">'
      + '<div class="f"><label for="c_ts">Title size</label><input type="text" id="c_ts" value="' + F.titleSize + '"></div>'
      + '<div class="f"><label for="c_as">Axis size</label><input type="text" id="c_as" value="' + F.axisSize + '"></div>'
      + '<div class="f"><label for="c_ls">Legend size</label><input type="text" id="c_ls" value="' + F.legendSize + '"></div>'
      + '<div class="f"><label for="c_xs">Sample label size</label><input type="text" id="c_xs" value="' + F.xSize + '"></div>'
      + '</div>');
    out.push('<div class="grid2" style="padding:0;gap:10px">'
      + '<div class="f"><label for="c_grid">Grid lines</label><select id="c_grid">'
        + '<option value="true"' + (F.showGrid ? " selected" : "") + '>on</option>'
        + '<option value="false"' + (!F.showGrid ? " selected" : "") + '>off</option></select></div>'
      + '<div class="f"><label for="c_xi">Sample labels</label><select id="c_xi">'
        + '<option value="n"' + (!F.xItalic && !F.xBold ? " selected" : "") + '>plain</option>'
        + '<option value="i"' + (F.xItalic ? " selected" : "") + '>italic</option>'
        + '<option value="b"' + (F.xBold && !F.xItalic ? " selected" : "") + '>bold</option></select></div>'
      + '</div>');
    out.push('</div>');

    /* colours: taxa on a stacked chart, samples everywhere else */
    var items = [];
    if(k === "stack") items = series().map(function(s, i){
      return {name:s.name, c:colourOf(s, i), sub:s.grouped ? s.members + " taxa" : ""}; });
    else if(k === "taxheat" || k === "matrix") items = [];
    else {
      var names = S.labels || S.names || (S.pts ? S.pts.map(function(p){ return p.name; }) : null)
                  || (k === "grouped" ? S.cols : null) || S.series || [];
      if(k === "grouped") names = S.cols || [];
      items = names.slice(0, 24).map(function(nm, i){
        return {name:nm, c:CHART.colors[nm] || seriesPalette()[i % seriesPalette().length], sub:""}; });
    }
    if(items.length){
      out.push('<div class="sechdr" style="border-top:1px solid var(--line)"><h3>Colours</h3>'
        + '<span class="hint"><button class="lnk" id="resetCol">reset to default</button></span></div>'
        + '<div class="swatches">'
        + items.map(function(it){
            return '<label class="sw"><input type="color" data-tax="' + esc(it.name) + '" value="'
              + esc(toHex(it.c)) + '"><span class="nm">' + esc(it.name) + '</span>'
              + (it.sub ? '<span class="gr">' + esc(it.sub) + '</span>' : "") + '</label>'; }).join("")
        + '</div>');
    }

    /* samples: rename and reorder, wherever the chart has samples */
    var sampleNames = S.samples || S.labels || S.names
      || (S.pts ? S.pts.map(function(p){ return p.name; }) : null);
    if(sampleNames && sampleNames.length && k !== "lines" && k !== "hist" && k !== "scree"){
      var ord = orderedIdx(sampleNames);
      var canFacet = k === "stack" || k === "alpha";
      /* Describe the chart on screen, not the metadata file. A group whose only
         members are hidden is not a panel, and a group that looks replicated in
         metadata.csv can be one-sample-per-group once samples are hidden —
         which is exactly the R1-vs-R2 case. The warning has to follow what is
         actually plotted or it says the wrong thing at the worst moment. */
      var shownNames = sampleNames.filter(function(n){ return !CHART.hidden[n]; });
      var nGrouped = shownNames.filter(function(n){
        return (CHART.groups[n] || "").trim(); }).length;
      var gNames = [], gCount = {};
      shownNames.forEach(function(n){
        var g = (CHART.groups[n] || "").trim();
        if(!g) return;
        if(gNames.indexOf(g) === -1) gNames.push(g);
        gCount[g] = (gCount[g] || 0) + 1;
      });

      out.push('<div class="sechdr" style="border-top:1px solid var(--line)"><h3>Groups</h3>'
        + '<span class="hint">' + (nGrouped
            ? gNames.length + " group" + (gNames.length === 1 ? "" : "s")
            : "none set") + '</span></div>'
        + '<div class="grid2" style="grid-template-columns:1fr;padding:12px 14px;gap:10px">'
        + (canFacet
            ? '<div class="f"><label for="c_facet">Split the chart by group</label>'
              + '<select id="c_facet">'
              + '<option value="on"' + (CHART.groupOn ? " selected" : "") + '>on</option>'
              + '<option value="off"' + (!CHART.groupOn ? " selected" : "") + '>off</option>'
              + '</select><span class="note">'
              + (nGrouped
                  ? 'One panel per group, sharing a single y axis. '
                    + (gNames.every(function(g){ return gCount[g] < 2; })
                      ? '<b>Every group here holds one sample</b>, so the panels label the '
                        + 'samples rather than comparing groups — there is nothing to average '
                        + 'and no test is possible.'
                      : "")
                  : 'Give the samples a group below and the chart splits into panels.')
              + '</span></div>'
            : '<div class="f"><span class="note">Splitting by group applies to the taxonomy '
              + 'and alpha-diversity charts.</span></div>')
        + '<div class="f"><div class="row" style="display:flex;gap:7px;flex-wrap:wrap">'
          + '<button class="btn" id="gClear">Clear groups</button>'
          + '<button class="btn" id="gEach">One group per sample</button>'
          + '</div></div>'
        + '</div>');

      var nHidden = sampleNames.filter(function(n){ return CHART.hidden[n]; }).length;
      out.push('<div class="sechdr" style="border-top:1px solid var(--line)"><h3>Samples</h3>'
        + '<span class="hint">' + (nHidden
            ? (sampleNames.length - nHidden) + " of " + sampleNames.length + " shown"
            : "show, group, rename, reorder") + '</span></div>'
        + (nHidden
            ? '<div class="hidnote">' + nHidden + ' sample' + (nHidden === 1 ? " is" : "s are")
              + ' hidden. The top taxa are re-ranked from the samples still shown, so the colours '
              + 'and the size of “Other” describe this chart and not the whole run. Nothing is '
              + 'removed from the data or from the saved metadata.</div>'
            : "")
        + '<div class="samps" id="samps">'
        + ord.map(function(si, pos){
            var nm0 = sampleNames[si];
            return '<div class="samp samp2' + (CHART.hidden[nm0] ? " off" : "") + '">'
              + '<input type="checkbox" class="shw" data-s="' + esc(nm0) + '"'
                + (CHART.hidden[nm0] ? "" : " checked")
                + ' title="Show this sample in the chart"'
                + ' aria-label="Show ' + esc(nm0) + ' in the chart">'
              + '<div class="ar">'
                + '<button class="mv" data-dir="-1" data-pos="' + pos + '" aria-label="Move up"'
                  + (pos === 0 ? " disabled" : "") + '>&#9650;</button>'
                + '<button class="mv" data-dir="1" data-pos="' + pos + '" aria-label="Move down"'
                  + (pos === ord.length - 1 ? " disabled" : "") + '>&#9660;</button></div>'
              + '<div class="sfields">'
                + '<input type="text" class="alias" data-s="' + esc(sampleNames[si]) + '" value="'
                  + esc(labelOf(sampleNames[si])) + '" placeholder="display name">'
                + '<input type="text" class="sgrp" data-s="' + esc(sampleNames[si]) + '" value="'
                  + esc(CHART.groups[sampleNames[si]] || "") + '" placeholder="group" list="grpList">'
              + '</div>'
              + '<span class="raw" title="name in the data">' + esc(sampleNames[si]) + '</span>'
              + '</div>'; }).join("")
        + '</div>'
        + '<datalist id="grpList">' + gNames.map(function(g){
            return '<option value="' + esc(g) + '">'; }).join("") + '</datalist>'
        + '<div class="gsave"><span class="msg" id="gMsg">'
          + (CHART.groupDirty ? 'Groups not saved yet.'
             : CHART.groupSaved ? 'Saved to the job\u2019s metadata.csv.'
             : 'Groups are read from and written to the job\u2019s '
               + '<span class="mono">metadata.csv</span>.')
          + '</span><button class="btn' + (CHART.groupDirty ? " pri" : "")
          + '" id="gSave"' + (CHART.groupDirty ? "" : " disabled") + '>Save groups</button></div>');
    }
    return out.join("");
  }

  function toHex(c){
    if(/^#[0-9a-f]{6}$/i.test(c)) return c;
    var m = /rgba?\((\d+)[,\s]+(\d+)[,\s]+(\d+)/i.exec(c || "");
    if(!m) return "#888888";
    return "#" + [1,2,3].map(function(k){
      return ("0" + parseInt(m[k],10).toString(16)).slice(-2); }).join("");
  }

  function wireCharts(){
    var F = CHART.font;
    function touch(){ CHART.dirty = true; CHART.saved = false; paintCharts(); }
    function on(id, ev, fn){ var el = document.getElementById(id); if(el) el.addEventListener(ev, fn); }

    Array.prototype.forEach.call(document.querySelectorAll(".tabb"), function(b){
      b.addEventListener("click", function(){
        var t = CHART.tabs.filter(function(x){ return x.id === b.dataset.tab; })[0];
        if(t) selectTab(t);

    Array.prototype.forEach.call(document.querySelectorAll(".segb"), function(b){
      b.addEventListener("click", function(){ CHART.view = b.dataset.view; paintCharts(); });

    Array.prototype.forEach.call(document.querySelectorAll(".ramp"), function(b){
      b.addEventListener("click", function(){ F.colorscale = b.dataset.ramp; touch(); });

    on("c_type", "change", function(){ F.chartType = this.value; touch(); });
    on("c_top", "change", function(){ F.topNTaxa = parseInt(this.value, 10); touch(); });
    on("c_title", "input", function(){ F.titleText = this.value; touch(); });
    [["c_ts","titleSize"],["c_as","axisSize"],["c_ls","legendSize"],["c_xs","xSize"]]
      .forEach(function(p){
        on(p[0], "change", function(){

    Array.prototype.forEach.call(document.querySelectorAll('.sw input[type="color"]'), function(inp){
      inp.addEventListener("change", function(){ CHART.colors[inp.dataset.tax] = inp.value; touch(); });

    Array.prototype.forEach.call(document.querySelectorAll(".alias"), function(inp){
      inp.addEventListener("change", function(){
        var raw = inp.dataset.s, v = inp.value.trim();
        if(v && v !== raw) CHART.aliases[raw] = v; else delete CHART.aliases[raw];

      });
    });
    var S = CHART.shape || {};
    var sampleNames = S.samples || S.labels || S.names
      || (S.pts ? S.pts.map(function(p){ return p.name; }) : []);
    Array.prototype.forEach.call(document.querySelectorAll(".mv"), function(b){

        var t = ord[pos]; ord[pos] = ord[to]; ord[to] = t;
        CHART.order = ord; touch();

    on("c_facet", "change", function(){ CHART.groupOn = this.value === "on"; paintCharts(); });

    Array.prototype.forEach.call(document.querySelectorAll(".sgrp"), function(inp){
      inp.addEventListener("change", function(){
        var raw = inp.dataset.s, v = inp.value.trim();

    Array.prototype.forEach.call(document.querySelectorAll(".shw"), function(cb){

    });

      var nm = S2.samples || S2.labels || S2.names || [];
      CHART.groups = {};
      nm.forEach(function(n){ CHART.groups[n] = n; });

    on("saveBtn", "click", saveChartSettings);
    on("revertBtn", "click", function(){

      CHART.order = []; touch();

  }


  /* Groups go back to the job's metadata.csv, in the production console's
     column spelling. "SampleID,Group" is what the production editor already
     writes, and dada2_pipeline.R's loader accepts it along with sampleid /
     sample_id / sample / #sampleid, case-insensitively.

     Until 2.9.13 one merge in that pipeline was hardcoded by.y="SampleID",
     which made this the only spelling that worked everywhere. That merge is
     gone (it joined against a variable that did not exist, so the plot it fed
     had never been produced). Writing one spelling is still the right thing —
     the fewer spellings in circulation, the fewer places a future reader has
     to check — but it is now a convention rather than a constraint. */
  function saveGroups(){
    var S = CHART.shape || {};
    var names = S.samples || S.labels || S.names
      || (S.pts ? S.pts.map(function(p){ return p.name; }) : []);
    if(!names.length) return;
    var btn = document.getElementById("gSave"), msg = document.getElementById("gMsg");
    btn.disabled = true;
    var csv = "SampleID,Group\n" + orderedIdx(names).map(function(i){
      var n = names[i];
      return csvCell(n) + "," + csvCell((CHART.groups[n] || "").trim());
    }).join("\n") + "\n";
    fetch("/results/" + encodeURIComponent(CHART.id) + "/metadata", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({csv: csv})
    }).then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      CHART.groupDirty = false; CHART.groupSaved = true; paintCharts();
    }).catch(function(e){
      btn.disabled = false;
      if(msg) msg.innerHTML = '<span style="color:var(--err)">Could not save the groups — '
        + esc(e.message || e) + '</span>';
    });
  }

  /* A sample called R1,R2 would otherwise split into two columns and silently
     shift every group by one. */
  function csvCell(v){
    v = String(v === undefined || v === null ? "" : v);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }

  function saveChartSettings(){
    var btn = document.getElementById("saveBtn"), msg = document.getElementById("saveMsg");
    btn.disabled = true;
    var S = CHART.shape || {};
    var names = S.samples || S.labels || S.names
      || (S.pts ? S.pts.map(function(p){ return p.name; }) : []);
    /* The production console's exact shape. Anything else and a job's styling
       splits in two depending on which console last touched it. */
    var payload = {
      font: CHART.font,
      colors: CHART.colors,
      sampleAliases: CHART.aliases,
      sampleOrder: names.length ? orderedIdx(names).map(function(i){ return names[i]; })
                                : CHART.order
    };
    fetch("/results/" + encodeURIComponent(CHART.id) + "/edit_charts/settings", {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)
    }).then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      CHART.dirty = false; CHART.saved = true; paintCharts();
    }).catch(function(e){
      btn.disabled = false;
      if(msg) msg.innerHTML = '<span style="color:var(--err)">Could not save — '
        + esc(e.message || e) + '</span>';
    });
  }

  /* PNG via canvas. ink() resolved the theme tokens to literals precisely so
     the serialised SVG still has its text when it leaves the document. */
  function downloadPNG(){
    var W = 900, H = 470, scale = 2;
    var svg = chartSVG({width:W, height:H});
    if(!svg) return;
    var img = new Image();
    var url = URL.createObjectURL(new Blob([svg], {type:"image/svg+xml;charset=utf-8"}));
    img.onload = function(){
      var cv = document.createElement("canvas");
      cv.width = W*scale; cv.height = H*scale;
      var ctx = cv.getContext("2d");
      ctx.scale(scale, scale); ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){
        var a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = CHART.id + "_" + CHART.tab.id + ".png";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
      }, "image/png");
    };
    img.onerror = function(){
      URL.revokeObjectURL(url);
      var msg = document.getElementById("saveMsg");
      if(msg) msg.innerHTML = '<span style="color:var(--err)">The browser would not rasterise '
        + 'this chart. The table view and Download CSV both still work.</span>';
    };
    img.src = url;
  }
