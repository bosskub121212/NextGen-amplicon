  /* The New Job form. Real values, real database list — but it does not submit.
     See the scope note at the top of this file. */
  /* ═══ the New Job form ════════════════════════════════════════════════════
     This posts real jobs. Everything below talks to the same two endpoints the
     production console uses — POST /upload then POST /run/{job_id} — against
     the same job store, so a job started here is indistinguishable from one
     started there and shows up in both.

     The form's job is to make the run REFUSABLE before it starts. A 16S run is
     fifteen minutes of CPU minimum; every check that can be done in the browser
     in a millisecond is a check worth doing there, because the alternative is
     finding out eight minutes in. So: pairing is resolved and shown before
     upload, metadata is matched against the detected samples by name, and the
     Start button stays disabled with a reason attached until both agree. */

  var FORM = null;   /* live state for the form currently on screen */

  /* ── read-direction tokens ───────────────────────────────────────────────
     Ported from frontend/src/lib/fastqPairing.ts (v2.8.3), deliberately
     unchanged in behaviour. The token that says "read 1 / read 2" only ever
     sits at the END of a FASTQ filename. Matching "_R1" anywhere — which this
     app used to do — breaks every dataset whose SAMPLE is called R1 or R2:
     Bacteria_R1_1.fq.gz collapsed to sample "Bacteria", and the mate guess
     rewrote it to Bacteria_R2_2.fq.gz, pairing one sample's forward reads with
     a DIFFERENT sample's reverse reads. That does not fail loudly. It produces
     a plausible ASV table. */
  var EXT       = /\.(fastq|fq)(\.gz)?$/i;
  var FWD_TOKEN = /_(R?)1((?:_\d{3})?)\.(fastq|fq)(\.gz)?$/i;
  var REV_TOKEN = /_(R?)2((?:_\d{3})?)\.(fastq|fq)(\.gz)?$/i;
  var FWD_LOOSE = /_R1/i;
  var REV_LOOSE = /_R2/i;

  function pairingFor(names){
    var fastq = names.filter(function(n){ return EXT.test(n); });
    var hasToken = fastq.some(function(n){ return FWD_TOKEN.test(n) || REV_TOKEN.test(n); });

    var strictMate = function(n){
      return n.replace(FWD_TOKEN, function(_m, r, lane, ext, gz){
        return "_" + r + "2" + (lane || "") + "." + ext + (gz || "");
      });
    };
    var looseMate = function(n){
      return n.replace(FWD_LOOSE, "_R2").replace(/_1\.(fq|fastq)/i, "_2.$1");
    };

    /* Some trimmers put a token at BOTH ends — Trim Galore writes
       S1_R1_val_1.fq.gz — so verify the anchored rule against the actual file
       list before committing to it, once for the whole set. */
    var strict = hasToken;
    if(hasToken){
      var fwd = fastq.filter(function(n){ return FWD_TOKEN.test(n); });
      var misses = fwd.filter(function(n){ return fastq.indexOf(strictMate(n)) === -1; }).length;
      if(misses > 0){
        var lf = fastq.filter(function(n){ return FWD_LOOSE.test(n); });
        var lm = lf.filter(function(n){ return fastq.indexOf(looseMate(n)) === -1; }).length;
        if(lf.length > 0 && lm === 0) strict = false;
      }
    }
    if(strict) return {
      strict:true,
      isR1:  function(n){ return FWD_TOKEN.test(n); },
      isR2:  function(n){ return REV_TOKEN.test(n); },
      sample:function(n){ return n.replace(FWD_TOKEN,"").replace(REV_TOKEN,"").replace(EXT,""); },
      mate:  strictMate
    };
    return {
      strict:false,
      isR1:  function(n){ return FWD_LOOSE.test(n); },
      isR2:  function(n){ return REV_LOOSE.test(n); },
      sample:function(n){ return n.replace(/_R1.*|_R2.*/i,"").replace(EXT,""); },
      mate:  looseMate
    };
  }

  /* Resolve a file list into the sample↔file manifest the backend accepts, and
     say plainly what is wrong when it cannot. */
  function detectSamples(names, single){
    var fastq = names.filter(function(n){ return EXT.test(n); });
    var other = names.filter(function(n){ return !EXT.test(n); });
    var problems = [];
    if(other.length) problems.push({kind:"ignored", detail:other.join(", ")});
    if(!fastq.length) return {map:[], problems:problems, strict:false};

    if(single){
      var map1 = fastq.map(function(f){ return {sample:f.replace(EXT,""), file1:f, file2:""}; });
      return {map:map1, problems:problems.concat(dupCheck(map1)), strict:true};
    }

    var P  = pairingFor(fastq);
    var r1 = fastq.filter(P.isR1);
    var r2 = fastq.filter(P.isR2);
    var map = [];
    var unpaired = [];
    r1.forEach(function(f){
      var mate = P.mate(f);
      if(fastq.indexOf(mate) === -1) unpaired.push(f);
      else map.push({sample:P.sample(f), file1:f, file2:mate});
    });
    var orphanR2 = r2.filter(function(f){
      return !map.some(function(m){ return m.file2 === f; });
    });
    var untokened = fastq.filter(function(f){ return !P.isR1(f) && !P.isR2(f); });

    if(unpaired.length)  problems.push({kind:"unpaired",  detail:unpaired.join(", ")});
    if(orphanR2.length)  problems.push({kind:"orphanR2",  detail:orphanR2.join(", ")});
    if(untokened.length) problems.push({kind:"untokened", detail:untokened.join(", ")});
    return {map:map, problems:problems.concat(dupCheck(map)), strict:P.strict};
  }

  function dupCheck(map){
    var seen = {}, dup = [];
    map.forEach(function(m){
      if(seen[m.sample] && dup.indexOf(m.sample) === -1) dup.push(m.sample);
      seen[m.sample] = 1;
    });
    return dup.length ? [{kind:"duplicate", detail:dup.join(", ")}] : [];
  }

  /* ── metadata CSV ────────────────────────────────────────────────────────
     Parsed here rather than posted as a file, because the backend takes
     metadata as rows on the run payload (MetaRow: sampleId, group, description,
     plus any extra columns). Quoted fields are handled; anything else is left
     exactly as typed. */
  function parseCSV(text){
    var rows = [], row = [], cur = "", q = false;
    text = text.replace(/^﻿/, "").replace(/\r\n?/g, "\n");
    for(var i = 0; i < text.length; i++){
      var c = text[i];
      if(q){
        if(c === '"' && text[i+1] === '"'){ cur += '"'; i++; }
        else if(c === '"') q = false;
        else cur += c;
      } else if(c === '"') q = true;
      else if(c === ","){ row.push(cur); cur = ""; }
      else if(c === "\n"){ row.push(cur); cur = ""; rows.push(row); row = []; }
      else cur += c;
    }
    row.push(cur);
    if(row.length > 1 || row[0] !== "") rows.push(row);
    return rows.filter(function(r){ return r.some(function(c){ return c.trim() !== ""; }); });
  }

  function metaFromCSV(text){
    var rows = parseCSV(text);
    if(rows.length < 2) return {rows:[], err:"The file has no data rows."};
    var head = rows[0].map(function(h){ return h.trim(); });
    var low  = head.map(function(h){ return h.toLowerCase().replace(/[^a-z0-9]/g, ""); });
    var iId  = low.indexOf("sampleid");
    if(iId === -1) iId = low.indexOf("sample");
    if(iId === -1) iId = low.indexOf("id");
    if(iId === -1)
      return {rows:[], err:"No sampleId column. Found: " + head.join(", ")};
    var iGrp = low.indexOf("group");
    var iDsc = low.indexOf("description");
    var out = rows.slice(1).map(function(r){
      var o = {sampleId:(r[iId]||"").trim(),
               group:iGrp === -1 ? "" : (r[iGrp]||"").trim(),
               description:iDsc === -1 ? "" : (r[iDsc]||"").trim()};
      head.forEach(function(h, k){                    /* keep custom columns */
        if(k !== iId && k !== iGrp && k !== iDsc && h && !(h in o)) o[h] = (r[k]||"").trim();
      });
      return o;
    }).filter(function(o){ return o.sampleId; });
    return {rows:out, err:out.length ? "" : "No rows had a sampleId."};
  }

  /* ── settings model ──────────────────────────────────────────────────────
     One row per control: [key, label, kind, default, options|hint]. The keys
     are RunParams field names verbatim, so buildPayload() can read them back
     without a translation table — a translation table is where a UI silently
     sends something the backend never asked for. */
  /* ── amplicon region presets ─────────────────────────────────────────────
     Ported verbatim from frontend/src/components/PipelineSettings.tsx
     (CUTADAPT_PRESETS). Choosing a region sets the primer pair AND the starting
     truncLen together, because those three are one decision: V3–V4 primers with
     V4 truncation is a run that filters almost everything away, and the two
     fields sitting far apart in a form is exactly how that happens.

     truncF/truncR here are STARTING values only. The pipeline measures the real
     ones from the trimmed reads and stops at a checkpoint if these would throw
     the data away — they are never derived as 250 minus the primer length. */
  var REGION_PRESETS = [
    {label:"16S V3–V4  (341F / 805R)",   marker:"16S",  region:"V3-V4",
     f:"CCTACGGGNGGCWGCAG",         r:"GACTACHVGGGTATCTAATCC",  truncF:240, truncR:200},
    {label:"16S V3–V4  (341F / 785R)",   marker:"16S",  region:"V3-V4",
     f:"CCTACGGGNGGCWGCAG",         r:"GGACTACHVGGGTWTCTAAT",   truncF:240, truncR:200},
    {label:"16S V4  (515F / 806R)",      marker:"16S",  region:"V4",
     f:"GTGYCAGCMGCCGCGGTAA",       r:"GGACTACNVGGGTWTCTAAT",   truncF:240, truncR:160},
    {label:"16S V7–V8  (1055F / 1392R)", marker:"16S",  region:"V7-V8",
     f:"AACMGGATTAGATACCCKG",       r:"ACGTCATCCCCACCTTCC",     truncF:250, truncR:200},
    {label:"12S fish  (MiFish-U)",       marker:"12S",  region:"12S",
     f:"GTCGGTAAAACTCGTGCCAGC",     r:"CATAGTGGGGTATCTAATCCCAGTTTG", truncF:0, truncR:0},
    {label:"ITS1  (ITS1F / ITS2)",       marker:"ITS1", region:"ITS1",
     f:"CTTGGTCATTTAGAGGAAGTAA",    r:"GCTGCGTTCTTCATCGATGC"},
    {label:"ITS1  (ITS1 / ITS2, alt)",   marker:"ITS1", region:"ITS1",
     f:"TCCGTAGGTGAACCTGCGG",       r:"GCTGCGTTCTTCATCGATGC"},
    {label:"ITS2  (ITS3 / ITS4)",        marker:"ITS2", region:"ITS2",
     f:"GTGAATCATCGAATCTTTGAA",     r:"TCCTCCGCTTATTGATATGC"},
    {label:"18S V4  (nematode)",         marker:"18S-nema", region:"V4",
     f:"CCAGCASCYGCGGTAATTCC",      r:"ACTTTCGTTCTTGATYRA"},
    {label:"COX1 mlCOIintF / jgHCO2198", marker:"COX1", region:"COI",
     f:"GGWACWGGWTGAACWGTWTAYCCYCC", r:"TANACYTCNGGRTGNCCRAARAAYCA"},
    {label:"PacBio V1–V9  (27F / 1492R)", marker:"PacBio", region:"V1-V9",
     f:"AGRGTTYGATYMTGGCTCAG",      r:"RGYTACCTTGTTACGACTT"},
    {label:"PacBio V1–V3  (8F / 534R)",   marker:"PacBio", region:"V1-V3",
     f:"AGAGTTTGATCMTGGCTCAG",      r:"ATTACCGCGGCTGCTGG"},
    {label:"PacBio V4  (515F / 806R)",    marker:"PacBio", region:"V4",
     f:"GTGYCAGCMGCCGCGGTAA",       r:"GGACTACNVGGGTWTCTAAT"},
    {label:"ONT V1–V9  (27F / 1492R)",    marker:"ONT-16S", region:"V1-V9",
     f:"AGRGTTYGATYMTGGCTCAG",      r:"RGYTACCTTGTTACGACTT"},
    {label:"ONT V7–V8  (1055F / 1392R)",  marker:"ONT-16S", region:"V7-V8",
     f:"AACMGGATTAGATACCCKG",       r:"ACGTCATCCCCACCTTCC"}
  ];

  function presetsFor(marker){
    return REGION_PRESETS.filter(function(p){ return p.marker === marker; });
  }

  /* ── the settings, per marker ────────────────────────────────────────────
     Every field the production console exposes for this marker, under its real
     RunParams key. Which steps apply depends on the pipeline the marker runs:
     ONT-16S goes to Emu, PacBio and COX1 to their own scripts, and none of them
     take a paired-end truncLen — showing one anyway would be inviting a setting
     that the run cannot use. */
  function stepSpec(key){
    var dada2   = ["16S", "12S", "18S-nema"].indexOf(key) !== -1;
    var isONT   = key === "ONT-16S";
    var isPB    = key === "PacBio";
    var isCOX1  = key === "COX1";
    var isITS   = key === "ITS1" || key === "ITS2";
    var steps   = [];

    steps.push({n:1, title:"Cutadapt — primer trimming",
      why:"Removes the primers before the denoiser sees the reads.",
      fields:[
        ["_region",           "Amplicon region",  "region", "", ""],
        ["primer_f",          "Forward primer",   "mono",   "", "leave blank to skip cutadapt"],
        ["primer_r",          "Reverse primer",   "mono",   "", ""],
        ["cutadaptErrorRate", "Error rate",       "num",    "0.1", "fraction of mismatches allowed (-e)"],
        ["cutadaptOverlap",   "Minimum overlap",  "int",    "3",   "bases (-O)"],
        ["discardUntrimmed",  "Discard untrimmed","bool",   "false", "drop reads with no primer found"]
      ]});

    if(dada2) steps.push({n:"1b", title:"Read orientation repair",
      why:"Pairs that start at the reverse primer cannot be merged, and cutadapt only searches one orientation.",
      fields:[
        ["reorient", "Repair orientation", "select", "auto", [
          ["auto",  "auto — check a subsample, repair only if mixed"],
          ["TRUE",  "always repair"],
          ["FALSE", "never repair"]]],
        ["reorientAmbiguous", "Ambiguous reads", "select", "keep", [
          ["keep", "Keep (pass through unchanged)"],
          ["drop", "Drop (cleaner, loses those reads)"]]],
        ["reorientMinPct",    "Auto trigger at",    "num",    "5", "% of pairs found reversed"]
      ]});

    if(dada2) steps.push({n:2, title:"Filtering and trimming",
      why:"truncLen is measured from the trimmed reads at run time; these are the starting values.",
      fields:[
        ["truncLen_F", "truncLen, forward", "int", "240", "0 = no truncation"],
        ["truncLen_R", "truncLen, reverse", "int", "200", "0 = no truncation"],
        ["maxEE_F",    "maxEE, forward",    "num", "2",   "max expected errors"],
        ["maxEE_R",    "maxEE, reverse",    "num", "2",   "max expected errors"],
        ["trimLeft_F", "trimLeft, forward", "int", "0",   ""],
        ["trimLeft_R", "trimLeft, reverse", "int", "0",   ""]
      ]});

    if(isPB) steps.push({n:2, title:"PacBio CCS filtering",
      why:"Full-length reads are filtered by length, not truncated.",
      fields:[
        ["pb_region", "Region", "select", "V1-V9", [
          ["V1-V9",  "V1–V9 (full-length, ~1500 bp)"],
          ["V1-V3",  "V1–V3 (~450 bp)"],
          ["V4",     "V4 (~250 bp)"],
          ["custom", "Custom"]]],
        ["pb_min_len", "Minimum length",    "int",    "1000", "bp"],
        ["pb_max_len", "Maximum length",    "int",    "1600", "bp"],
        ["pb_maxEE",   "Maximum expected errors", "num", "3", ""]
      ]});

    if(isONT) steps.push({n:2, title:"ONT reads and Emu",
      why:"V7–V8 is ~337 bp and resolves to genus; V1–V9 is ~1500 bp and can reach species.",
      fields:[
        ["ont_region", "16S region", "select", "V1-V9", [
          ["V1-V9", "V1–V9 (full-length, ~1500 bp, species-level)"],
          ["V7-V8", "V7–V8 (~337 bp, genus-level)"]]],
        ["ont_min_abundance", "Minimum abundance", "num",    "0.0001", "Emu abundance filter"],
        ["ont_db_path",       "Emu database",      "path",   "", "directory containing the Emu database"],
        ["ontMinLen",         "Minimum read length","int",   "300", "bp"],
        ["ontMaxLen",         "Maximum read length","int",   "600", "bp"]
      ]});

    if(isCOX1) steps.push({n:2, title:"COX1 filtering",
      why:"Codon-aware: a COI read with an internal stop codon is not a real barcode.",
      fields:[
        ["truncLen_cox1_f", "truncLen, forward", "int", "230", ""],
        ["truncLen_cox1_r", "truncLen, reverse", "int", "200", ""],
        ["codon_table", "Codon table", "select", "5", [
          ["5", "5 — Invertebrate Mitochondrial (default)"],
          ["2", "2 — Vertebrate Mitochondrial"],
          ["1", "1 — Standard (nuclear)"]]],
        ["cox1_min_len",    "Minimum ASV length","int", "300", "bp"],
        ["cox1_max_len",    "Maximum ASV length","int", "330", "bp"]
      ]});

    if(isITS) steps.push({n:2, title:"ITS region",
      why:"ITS length varies widely between taxa, so reads are not truncated to a fixed length.",
      fields:[
        ["its_region", "ITS region", "select", key, [["ITS1","ITS1"],["ITS2","ITS2"]]],
        ["maxEE_F",    "maxEE, forward", "num", "2", ""],
        ["maxEE_R",    "maxEE, reverse", "num", "2", ""]
      ]});

    if(dada2 || isPB || isCOX1 || isITS) steps.push({n:3, title:"DADA2 — ASV denoising",
      why:"pseudo-pooling recovers low-abundance variants shared across samples.",
      fields:[
        ["pool", "Pooling mode", "select", "pseudo", [
          ["FALSE",  "FALSE — fast (independent)"],
          ["pseudo", "pseudo — balanced (recommended)"],
          ["TRUE",   "TRUE — most sensitive, slowest"]]],
        ["chimeraMethod", "Chimera method", "select", "consensus", [
          ["consensus",  "consensus (recommended)"],
          ["per-sample", "per-sample"],
          ["pooled",     "pooled (slowest)"]]],
        ["nbases", "Bases to learn from", "select", "100000000", [
          ["10000000",  "10M bases (fast)"],
          ["100000000", "100M bases (default)"],
          ["500000000", "500M bases (accurate)"]]],
        ["nThreads", "CPU threads", "int", "4", "cores for the denoiser"]
      ]});

    if(dada2) steps.push({n:4, title:"Phylogenetic tree",
      why:"Needed for UniFrac. Adds several minutes on a large ASV table.",
      fields:[["_buildTree", "Build tree", "bool", "true", "DECIPHER alignment + phangorn"]]});

    steps.push({n:5, title:"Taxonomy classification",
      why:"The reference decides every name in the report.",
      fields:[
        ["dbPath",   "Taxonomy database", "db",   "", ""],
        ["minBoot",  "Minimum bootstrap", "int",  "50", "% of 100 resamplings"],
        ["_species", "Species assignment","ro",   "exact match (100%)",
                     "addSpecies() is exact matching — minBoot does not apply to it"]
      ]});

    steps.push({n:6, title:"Diversity analysis",
      why:"PERMANOVA needs ≥2 groups with ≥2 samples each; below that it is skipped and says so.",
      fields:[
        ["topN", "Top taxa in plots", "select", "30", [
          ["30",  "Top 30"], ["50", "Top 50"], ["100", "Top 100"]]],
        ["offtargetWarnPct", "Off-target warning at", "num",  "20", "% of reads non-target"],
        ["filterOfftarget",  "Drop off-target ASVs",  "bool", "false",
                             "Eukaryota / Mitochondria / Chloroplast"]
      ]});

    steps.push({n:7, title:"Differential abundance",
      why:"Decontam needs negative-control samples named in the metadata.",
      fields:[
        ["run_lulu",          "LULU curation",      "bool",   "true", ""],
        ["decontam", "Decontam", "select", "none", [
          ["none",       "off"],
          ["prevalence", "prevalence — needs negative controls"]]],
        ["decontamThreshold", "Decontam threshold", "num",    "0.1", ""],
        ["_controls",         "Negative controls",  "controls", "",
                              "sample IDs, comma separated — must match the Sample column above"]
      ]});

    steps.push({n:8, title:"Functional analysis",
      why:"Prediction from 16S is inference, not measurement. Adds run time.",
      fields:[
        ["run_picrust2", "PICRUSt2", "bool", "false", "16S only"],
        ["run_tax4fun",  "Tax4Fun2", "bool", "false", "16S only, needs the reference pack"]
      ]});

    return steps;
  }

  function field(f, dbOpts, marker){
    var key = f[0], label = f[1], kind = f[2], def = f[3], extra = f[4];
    var id = "f_" + key;
    var ctl, wide = false, hint = extra;

    if(kind === "region"){
      /* Region first, because it sets the two primers and the starting
         truncLen together. They are one decision and the production console
         treats them as one; splitting them across a form is how a V3–V4 run
         gets V4 truncation. */
      var ps = presetsFor(marker);
      wide = true;
      ctl = '<select id="f_region" data-region="1">'
        + ps.map(function(p, i){
            return '<option value="' + i + '">' + esc(p.label) + '</option>'; }).join("")
        + '<option value="custom">Custom — type the primers below</option></select>';
      hint = ps.length
        ? "Sets both primers and the starting truncLen. The pipeline still measures the real truncLen from the trimmed reads."
        : "No preset for this marker — enter the primers below.";
    } else if(kind === "select"){
      /* Options are [value, label] pairs so the label can explain the choice —
         "100M bases (default)" rather than a bare 100000000 that the user has
         to count the zeros of. The VALUE is still what gets posted. Bare
         strings are accepted too, for lists where the two are the same. */
      var vals = extra.map(function(o){ return Array.isArray(o) ? o[0] : o; });
      /* A select whose values are all numbers posts numbers. nbases went from a
         text box to a dropdown and would otherwise have started arriving as the
         STRING "100000000" — which pydantic does coerce, so nothing would have
         failed loudly; it just stops being checkable here. */
      var numeric = vals.every(function(v){ return /^-?\d+(\.\d+)?$/.test(v); });
      ctl = '<select id="' + id + '" data-k="' + esc(key) + '"'
        + (numeric ? ' data-kind="num"' : "") + '>'
        + extra.map(function(o){
            var v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : o;
            return '<option value="' + esc(v) + '"' + (v === def ? " selected" : "")
              + '>' + esc(l) + '</option>'; }).join("")
        + '</select>';
      hint = "";
    } else if(kind === "bool"){
      ctl = '<select id="' + id + '" data-k="' + esc(key) + '" data-bool="1">'
        + '<option value="true"'  + (def === "true"  ? " selected" : "") + '>on</option>'
        + '<option value="false"' + (def === "false" ? " selected" : "") + '>off</option></select>';
      hint = "";
    } else if(kind === "db"){
      /* Options come from the real file listing, plus a custom path. See
         databaseOptions(). */
      wide = true;
      ctl = '<select id="' + id + '" data-k="dbPath">' + dbOptionHtml(dbOpts) + '</select>'
        + '<div class="pathrow" id="dbCustomRow" hidden style="margin-top:6px">'
        + '<input type="text" class="mono" id="f_dbPathCustom" '
        + 'placeholder="full path, e.g. /home/you/r16s-app/backend/databases/SILVA/silva_nr99_v144_toGenus_trainset.fa.gz"></div>'
        + '<div class="dbnote" id="dbNote"></div>';
      hint = "";
    } else if(kind === "path"){
      wide = true;
      ctl = '<input type="text" class="mono" id="' + id + '" data-k="' + esc(key) + '" '
        + 'value="' + esc(def) + '" placeholder="full path on this machine">';
    } else if(kind === "controls"){
      wide = true;
      ctl = '<input type="text" id="f_controls" placeholder="e.g. BLANK1, NTC2">';
    } else if(kind === "ro"){
      ctl = '<input type="text" value="' + esc(def) + '" readonly>';
    } else {
      ctl = '<input type="text" id="' + id + '" data-k="' + esc(key) + '"'
        + ' data-kind="' + esc(kind) + '"'
        + (kind === "mono" ? ' class="mono"' : "")
        + ' value="' + esc(def) + '">';
    }
    return '<div class="f' + (wide ? " wide" : "") + '">'
      + '<label for="' + id + '">' + esc(label) + '</label>' + ctl
      + (hint ? '<span class="note">' + esc(hint) + '</span>' : "") + '</div>';
  }

  /* Database options, grouped, with the custom-path escape hatch last. The
     first cut of this built the list by pattern-matching db_paths.json, and on
     a machine whose db_paths.json pointed at files that were not there it
     offered two entries, both marked "file missing on disk", and no way to pick
     anything else. A guess about which files exist, where the production
     console simply asks. */
  function dbOptionHtml(opts){
    if(!opts.length)
      return '<option value="">— no reference file found in the databases folder —</option>'
           + '<option value="__custom__">Custom path…</option>';
    var byDir = {};
    opts.forEach(function(o){
      (byDir[o.dir] = byDir[o.dir] || []).push(o);
    });
    /* Groups that matched the marker come first. Sorting the folder names
       alphabetically put "12S_db — not matched" above "SILVA" on a 16S job,
       so the first thing in the list was the one file you must not pick. */
    var html = "";
    Object.keys(byDir).sort(function(x, y){
      var mx = x.indexOf("not matched") === -1 ? 0 : 1;
      var my = y.indexOf("not matched") === -1 ? 0 : 1;
      return mx !== my ? mx - my : x.localeCompare(y);
    }).forEach(function(d){
      html += '<optgroup label="' + esc(d || "databases/") + '">'
        + byDir[d].map(function(o){
            return '<option value="' + esc(o.path) + '"' + (o.pick ? " selected" : "") + '>'
              + esc(o.label) + '</option>'; }).join("")
        + '</optgroup>';
    });
    return html + '<optgroup label="Other"><option value="__custom__">Custom path…</option></optgroup>';
  }

  function stepCard(st, dbOpts, marker){
    return '<div class="stepgrp" data-step="' + esc(st.n) + '"><h4><span class="n">'
      + esc(st.n) + '</span>' + esc(st.title)
      + '<span class="why">' + esc(st.why) + '</span></h4>'
      + '<div class="grid2">' + st.fields.map(function(f){ return field(f, dbOpts, marker); }).join("")
      + '</div></div>';
  }

  /* Three states, not two. A green tick on a check that had nothing to check —
     "Pairing clean" with no files chosen — looks exactly like a check that
     actually passed, so the row reads as all-clear before anything has
     happened. A check with no input yet says so and stays grey. */
  function pf(state, good, bad, idle){
    if(state === null || state === undefined)
      return '<span class="pf">'
        + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".7"><circle cx="12" cy="12" r="9"/></svg>'
        + esc(idle || bad) + '</span>';
    return '<span class="pf ' + (state ? "ok" : "bad") + '">'
      + (state
        ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>'
        : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>')
      + esc(state ? good : bad) + '</span>';
  }

  function renderForm(it){
    var dbOpts = databaseOptions(it.key);
    var dbCount = dbOpts.length;
    var spec   = stepSpec(it.key);

    FORM = {
      marker: it.key, label: it.label,
      files: [],          /* File objects chosen but not yet uploaded */
      jobId: null,        /* set by POST /upload */
      uploaded: [],       /* filenames the backend says it saved */
      detect: null,       /* detectSamples() result for the uploaded names */
      meta: [],           /* MetaRow[] */
      metaName: "",
      metaErr: "",
      busy: false,
      lastError: ""
    };

    work.innerHTML =
        '<div class="crumb">New job · ' + esc(it.label) + '</div>'
      + '<h2 class="ttl">New ' + esc(it.label) + ' job</h2>'
      + '<p class="sub">Upload the reads, check the detected samples, then start. '
      + 'Every setting below is sent exactly as shown and recorded with the run.</p>'

      + '<div class="panel">'
        + '<div class="sechdr"><h3>Input</h3><span class="hint">FASTQ pairs and sample metadata</span></div>'
        + '<div class="grid2" style="padding-bottom:0">'
          + '<div class="f span2"><label for="jn">Job name</label>'
          + '<input type="text" id="jn" placeholder="e.g. Soil_16S_Run1"></div>'
        + '</div>'
        + '<div class="up">'
          + '<div class="drop" id="dropFq">'
            + '<div class="t">Sequencing reads</div>'
            + '<div class="s">Drop .fastq / .fastq.gz / .fq.gz pairs here, or a .zip containing them</div>'
            + '<div class="row">'
              + '<input type="file" id="fqIn" multiple accept=".fastq,.fq,.gz,.zip" hidden>'
              + '<button class="btn pri" id="fqPick">'
                + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>'
                + 'Choose files</button>'
              + '<button class="btn" id="fqUp" disabled>Upload</button>'
              + '<span class="s" id="fqState">Nothing chosen yet</span>'
            + '</div>'
            + '<div class="files" id="fqList"></div>'
          + '</div>'
          + '<div class="drop" id="dropMd">'
            + '<div class="t">Sample metadata</div>'
            + '<div class="s">CSV with a sampleId column, plus group and description</div>'
            + '<div class="row">'
              + '<input type="file" id="mdIn" accept=".csv,.tsv,.txt" hidden>'
              + '<button class="btn" id="mdPick">Choose CSV</button>'
              + '<button class="btn" id="tplBtn">Download template</button>'
            + '</div>'
            + '<div class="s" id="mdState">Optional. Grouping and diversity plots need it.</div>'
          + '</div>'
        + '</div>'
        + '<div class="pre" id="pre"></div>'
      + '</div>'

      + '<div id="sampleBox"></div>'

      + '<div class="panel adv">'
        + '<div class="sechdr"><h3>Run type</h3>'
        + '<span class="hint">every other setting lives in the pipeline steps below</span></div>'
        + '<div class="grid2">'
          + '<div class="f"><label for="seq">Sequencer</label>'
            + '<select id="seq">'
              + '<option value="illumina">Illumina (paired-end)</option>'
              + '<option value="ont">ONT R10.4+ (single-end)</option>'
              + '<option value="qiime2_vsearch">QIIME2 VSEARCH (OTU clustering)</option>'
            + '</select>'
            + '<span class="note">Single-end changes how the files are paired and how samples are named</span></div>'
          + '<div class="f" id="otuBox" hidden><label for="f_otuSimilarity">OTU identity</label>'
            + '<input type="text" id="f_otuSimilarity" data-k="otuSimilarity" data-kind="num" value="0.97">'
            + '<span class="note">VSEARCH clustering identity — 0.97 is the usual 97% OTU</span></div>'
        + '</div>'
      + '</div>'

      + '<div class="panel adv">'
        + '<button class="advhdr" id="advBtn" aria-expanded="true" aria-controls="advBody">'
          + '<svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>'
          + 'Pipeline settings'
          + '<span class="hint">every value here is sent with the run and recorded with it</span>'
        + '</button>'
        + '<div class="advbody" id="advBody">'
          + spec.map(function(st){ return stepCard(st, dbOpts, it.key); }).join("")
        + '</div>'
      + '</div>'

      + '<div id="runErr"></div>'
      + '<div class="runbar">'
        + '<span class="msg" id="runMsg"></span><span class="sp"></span>'
        + '<button class="btn pri" id="runBtn" disabled>'
          + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4l14 8-14 8z"/></svg>'
          + 'Start analysis</button>'
      + '</div>';

    wireForm(dbOpts, dbCount);
    preflight(dbOpts, dbCount);
  }

  function setVal(id, v){
    var el = document.getElementById(id);
    if(el && el.value !== v) el.value = v;
  }

  function wireForm(dbOpts, dbCount){
    var fqIn = document.getElementById("fqIn");
    var mdIn = document.getElementById("mdIn");

    document.getElementById("fqPick").addEventListener("click", function(){ fqIn.click(); });
    document.getElementById("mdPick").addEventListener("click", function(){ mdIn.click(); });

    fqIn.addEventListener("change", function(){ chooseFastq(fqIn.files, dbOpts, dbCount); });
    mdIn.addEventListener("change", function(){ chooseMeta(mdIn.files[0], dbOpts, dbCount); });

    /* Drag and drop onto either card. */
    var dz = document.getElementById("dropFq");
    ["dragenter","dragover"].forEach(function(e){
      dz.addEventListener(e, function(ev){ ev.preventDefault(); dz.style.borderColor = "var(--accent)"; });
    });
    ["dragleave","drop"].forEach(function(e){
      dz.addEventListener(e, function(ev){ ev.preventDefault(); dz.style.borderColor = ""; });
    });
    dz.addEventListener("drop", function(ev){
      if(ev.dataTransfer && ev.dataTransfer.files.length)
        chooseFastq(ev.dataTransfer.files, dbOpts, dbCount);
    });

    document.getElementById("fqUp").addEventListener("click", function(){
      doUpload(dbOpts, dbCount);
    });

    document.getElementById("tplBtn").addEventListener("click", function(){
      var names = FORM.detect ? FORM.detect.map.map(function(m){ return m.sample; }) : ["Sample1","Sample2"];
      var csv = "sampleId,group,description\n"
        + names.map(function(n){ return n + ",GroupA," + n; }).join("\n") + "\n";
      var url = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
      var a = document.createElement("a");
      a.href = url; a.download = "metadata_template.csv";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    });

    document.getElementById("seq").addEventListener("change", function(){
      var box = document.getElementById("otuBox");
      if(box) box.hidden = this.value !== "qiime2_vsearch";
    });

    document.getElementById("seq").addEventListener("change", function(){
      /* Single-end changes what counts as a sample, so re-detect immediately
         rather than at submit time. */
      if(FORM.uploaded.length)
        FORM.detect = detectSamples(FORM.uploaded, this.value !== "illumina");
      paintSamples();
      preflight(dbOpts, dbCount);
    });

    /* Region preset drives the primers and the starting truncLen together. */
    var rg = document.getElementById("f_region");
    if(rg){
      var ps = presetsFor(FORM.marker);
      rg.addEventListener("change", function(){
        if(rg.value === "custom") return;      /* leave whatever is typed */
        var pr = ps[parseInt(rg.value, 10)];
        if(!pr) return;
        setVal("f_primer_f", pr.f);
        setVal("f_primer_r", pr.r);
        if(pr.truncF !== undefined) setVal("f_truncLen_F", String(pr.truncF));
        if(pr.truncR !== undefined) setVal("f_truncLen_R", String(pr.truncR));
        if(pr.region && document.getElementById("f_ont_region"))
          setVal("f_ont_region", pr.region);
        if(pr.region && document.getElementById("f_pb_region"))
          setVal("f_pb_region", pr.region);
      });
      /* Apply the marker's first preset once, so the form opens consistent
         rather than showing a region that does not match the primers below. */
      if(ps.length){ rg.value = "0"; rg.dispatchEvent(new Event("change")); }
      /* Typing a primer by hand means the preset no longer describes the run. */
      ["f_primer_f", "f_primer_r"].forEach(function(i){
        var el = document.getElementById(i);
        if(el) el.addEventListener("input", function(){
          var pr = ps[parseInt(rg.value, 10)];
          var f = (document.getElementById("f_primer_f") || {}).value;
          var r = (document.getElementById("f_primer_r") || {}).value;
          if(!pr || pr.f !== f || pr.r !== r) rg.value = "custom";
        });
      });
    }

    /* "Custom path…" reveals a text box, and that box becomes the value sent. */
    var dbSel = document.getElementById("f_dbPath");
    var dbRow = document.getElementById("dbCustomRow");
    var dbTxt = document.getElementById("f_dbPathCustom");
    function dbSync(){
      if(!dbSel) return;
      var custom = dbSel.value === "__custom__";
      if(dbRow) dbRow.hidden = !custom;
      var note = document.getElementById("dbNote");
      if(note){
        if(custom) note.innerHTML = "The path is sent exactly as typed. The backend checks it before "
          + "the run starts and refuses a file it cannot use.";
        else if(!dbOpts.length) note.innerHTML = "<b>Nothing was found in the databases folder.</b> "
          + "Either no reference is installed on this machine, or the backend could not read the folder.";
        else note.innerHTML = dbOpts.length + " file" + (dbOpts.length === 1 ? "" : "s")
          + " found in the databases folder" + (dbOpts.matched < dbOpts.length
              ? ", " + (dbOpts.length - dbOpts.matched) + " of them not matching " + esc(FORM.marker)
                + " by name — they are still listed."
              : ".");
      }
    }
    if(dbSel){ dbSel.addEventListener("change", dbSync); dbSync(); }

    var ab = document.getElementById("advBtn"), abody = document.getElementById("advBody");
    ab.addEventListener("click", function(){
      var open = ab.getAttribute("aria-expanded") === "true";
      ab.setAttribute("aria-expanded", String(!open));
      abody.hidden = open;
    });

    document.getElementById("runBtn").addEventListener("click", function(){
      doRun(dbOpts, dbCount);
    });
  }

  function chooseFastq(fileList, dbOpts, dbCount){
    FORM.files    = Array.prototype.slice.call(fileList);
    FORM.jobId    = null;         /* a new selection invalidates the old upload */
    FORM.uploaded = [];
    FORM.detect   = null;
    FORM.lastError = "";
    var names = FORM.files.map(function(f){ return f.name; });
    var bytes = FORM.files.reduce(function(n, f){ return n + f.size; }, 0);
    document.getElementById("fqState").textContent =
      FORM.files.length + " file" + (FORM.files.length === 1 ? "" : "s")
      + " · " + (bytes / 1048576).toFixed(1) + " MB — not uploaded yet";
    document.getElementById("fqList").innerHTML = names.map(function(n){
      return '<span class="file">' + esc(n) + '</span>'; }).join("");
    document.getElementById("fqUp").disabled = !FORM.files.length;

    /* Show the pairing BEFORE the upload, from the local filenames. If the
       names are wrong, the user finds out now instead of after a transfer. */
    var single = document.getElementById("seq").value !== "illumina";
    FORM.detect = detectSamples(names, single);
    paintSamples(true);
    preflight(dbOpts, dbCount);
  }

  function chooseMeta(file, dbOpts, dbCount){
    if(!file) return;
    var r = new FileReader();
    r.onload = function(){
      var res = metaFromCSV(String(r.result));
      FORM.meta     = res.rows;
      FORM.metaErr  = res.err;
      FORM.metaName = file.name;
      document.getElementById("mdState").textContent = res.err
        ? file.name + " — " + res.err
        : file.name + " · " + res.rows.length + " row" + (res.rows.length === 1 ? "" : "s");
      paintSamples();
      preflight(dbOpts, dbCount);
    };
    r.readAsText(file);
  }

  function doUpload(dbOpts, dbCount){
    if(!FORM.files.length || FORM.busy) return;
    FORM.busy = true;
    FORM.lastError = "";
    var btn = document.getElementById("fqUp");
    btn.disabled = true;
    document.getElementById("fqState").textContent = "Uploading…";

    var fd = new FormData();
    FORM.files.forEach(function(f){ fd.append("files", f, f.name); });

    fetch("/upload", {method:"POST", body:fd})
      .then(function(r){
        return r.json().then(function(j){
          if(!r.ok) throw new Error(j.error || ("HTTP " + r.status));
          return j;
        });
      })
      .then(function(j){
        FORM.jobId    = j.job_id;
        /* Trust the backend's file list, not the browser's: a .zip arrives as
           one file and comes back as the FASTQs it contained. */
        FORM.uploaded = Array.isArray(j.files) ? j.files : [];
        var single    = document.getElementById("seq").value !== "illumina";
        FORM.detect   = detectSamples(FORM.uploaded, single);
        document.getElementById("fqState").textContent =
          "Uploaded · " + FORM.uploaded.length + " file"
          + (FORM.uploaded.length === 1 ? "" : "s") + " on the server";
        /* The raw file list has done its job. From here the Detected samples
           table below shows the same filenames with the sample each one was
           assigned to, which is the view worth reading — two lists of the same
           eight names, one of them less informative, is just noise. */
        document.getElementById("fqList").innerHTML = "";
      })
      .catch(function(e){
        FORM.lastError = "Upload failed — " + (e.message || e);
        document.getElementById("fqState").textContent = "Upload failed";
      })
      .then(function(){
        FORM.busy = false;
        btn.disabled = !!FORM.jobId;
        paintSamples();
        preflight(dbOpts, dbCount);
      });
  }

  /* The sample table. This is the screen that decides whether a run is worth
     starting, so it shows the actual file each sample resolved to — not just a
     count. A count of 4 looks identical whether or not the right files are
     behind it. */
  function paintSamples(provisional){
    var box = document.getElementById("sampleBox");
    if(!box) return;
    var D = FORM.detect;
    if(!D || !D.map.length && !D.problems.length){ box.innerHTML = ""; return; }

    var metaIds = FORM.meta.map(function(m){ return m.sampleId; });
    var rows = D.map.map(function(m){
      var matched = metaIds.indexOf(m.sample) !== -1;
      return '<tr><td><b>' + esc(m.sample) + '</b></td>'
        + '<td>' + esc(m.file1) + '</td>'
        + '<td>' + (m.file2 ? esc(m.file2) : '<span style="color:var(--fg-3)">single-end</span>') + '</td>'
        + '<td>' + (!FORM.meta.length ? '<span style="color:var(--fg-3)">—</span>'
            : matched ? '<span style="color:var(--ok)">matched</span>'
                      : '<span style="color:var(--warn)">no metadata row</span>') + '</td></tr>';
    }).join("");

    var extraMeta = metaIds.filter(function(id){
      return !D.map.some(function(m){ return m.sample === id; });
    });

    var PROB = {
      unpaired:  "Forward reads with no matching reverse file",
      orphanR2:  "Reverse reads with no matching forward file",
      untokened: "FASTQ files with no _R1/_R2 or _1/_2 token — they cannot be assigned to a read direction",
      duplicate: "Two files resolved to the SAME sample name — one would overwrite the other",
      ignored:   "Not FASTQ, ignored"
    };
    var probs = D.problems.filter(function(p){ return p.kind !== "ignored" || true; }).map(function(p){
      var bad = p.kind !== "ignored";
      return '<div class="' + (bad ? "errbox" : "warnbox") + '" style="border-radius:0">'
        + '<b>' + esc(PROB[p.kind] || p.kind) + ':</b> ' + esc(p.detail) + '</div>';
    }).join("");

    box.innerHTML = '<div class="panel" style="margin-top:12px">'
      + '<div class="sechdr"><h3>Detected samples</h3><span class="hint">'
      + D.map.length + ' sample' + (D.map.length === 1 ? "" : "s")
      + (provisional && !FORM.jobId ? " · from the filenames, before upload" : "")
      + (D.strict ? "" : " · matched on a loose _R1/_R2 rule") + '</span></div>'
      + (rows ? '<table class="parms samples"><thead><tr><th>Sample</th><th>Forward</th>'
          + '<th>Reverse</th><th>Metadata</th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<div class="skel">No sample could be resolved from these filenames.</div>')
      + probs
      + (extraMeta.length
          ? '<div class="warnbox"><b>' + extraMeta.length + ' metadata row'
            + (extraMeta.length === 1 ? "" : "s") + ' match no sample:</b> ' + esc(extraMeta.join(", "))
            + ' — check the spelling against the Sample column above.</div>'
          : "")
      + (FORM.metaErr ? '<div class="errbox" style="border-radius:0 0 var(--r) var(--r)"><b>Metadata:</b> '
          + esc(FORM.metaErr) + '</div>' : "")
      + '</div>';
  }

  function preflight(dbOpts, dbCount){
    var el = document.getElementById("pre");
    if(!el) return;
    var D  = FORM.detect;
    var n  = D ? D.map.length : 0;
    var hardProblems = D ? D.problems.filter(function(p){ return p.kind !== "ignored"; }) : [];
    var metaOk  = !FORM.meta.length || (!FORM.metaErr && D && D.map.every(function(m){
      return FORM.meta.some(function(x){ return x.sampleId === m.sample; });
    }));
    var dbSel = document.getElementById("f_dbPath");
    var dbTxt = document.getElementById("f_dbPathCustom");
    var dbOk  = !!(dbSel && (dbSel.value === "__custom__"
                     ? (dbTxt && dbTxt.value.trim())
                     : dbSel.value));

    el.innerHTML =
        pf(FORM.files.length ? (!!FORM.jobId && n > 0) : null,
           n + " sample" + (n === 1 ? "" : "s") + " uploaded",
           FORM.jobId ? "No sample detected" : "Chosen, not uploaded yet",
           "No FASTQ files yet")
      + pf(D ? !hardProblems.length : null,
           "Pairing clean",
           hardProblems.length + " pairing problem" + (hardProblems.length === 1 ? "" : "s"),
           "Pairing — nothing to check yet")
      + pf(FORM.meta.length ? metaOk : null,
           "Metadata: " + FORM.meta.length + " rows matched",
           "Metadata does not match the samples",
           "No metadata (optional)")
      + pf(dbOk, "Database selected",
           dbOpts.length ? "No database selected"
                         : "No reference file found in the databases folder");

    var run = document.getElementById("runBtn");
    var msg = document.getElementById("runMsg");
    if(!run || !msg) return;

    var why = !FORM.jobId          ? "Upload the reads first."
            : n === 0              ? "No sample could be resolved from the uploaded filenames."
            : hardProblems.length  ? "Fix the pairing problems above — a run started like this produces a table that looks fine and is not."
            : !dbOk                ? "Choose a taxonomy database."
            : !metaOk              ? "The metadata does not cover every sample. Remove it or fix the names."
            : "";
    run.disabled = !!why || FORM.busy;
    msg.innerHTML = why ? esc(why)
      : 'Ready — ' + n + ' sample' + (n === 1 ? "" : "s") + ' into job <span class="mono">'
        + esc(FORM.jobId) + '</span>.';

    var err = document.getElementById("runErr");
    if(err) err.innerHTML = FORM.lastError
      ? '<div class="note bad"><b>' + esc(FORM.lastError) + '</b></div>' : "";
  }

  /* Build the RunParams payload. Keys come straight off the controls' data-k,
     which are RunParams field names, so nothing is renamed on the way out.
     Anything the form does not offer is simply omitted and the backend's own
     default applies — the UI does not restate defaults it is not in charge of. */
  function buildPayload(){
    var p = {
      job_name: (document.getElementById("jn").value || "").trim(),
      marker:   FORM.marker,
      sequencerType: document.getElementById("seq").value,
      metadata: FORM.meta,
      sampleFileMap: FORM.detect ? FORM.detect.map : []
    };
    Array.prototype.forEach.call(
      document.querySelectorAll("#advBody [data-k]"), function(el){
        var k = el.dataset.k, v = el.value;
        if(k.charAt(0) === "_") return;                 /* display-only rows */
        if(el.dataset.bool)            p[k] = (v === "true");
        else if(el.dataset.kind === "int") p[k] = parseInt(v, 10);
        else if(el.dataset.kind === "num") p[k] = parseFloat(v);
        else p[k] = v;
      });
    /* Step 4's tree toggle has no RunParams field of its own; it is display
       only, and saying so beats inventing a key the backend ignores. */
    var sel = document.getElementById("f_dbPath");
    var txt = document.getElementById("f_dbPathCustom");
    p.dbPath = (sel && sel.value === "__custom__")
      ? (txt ? txt.value.trim() : "")
      : (sel ? sel.value : "");
    p.taxDatabase = p.dbPath ? p.dbPath.split(/[\\/]/).pop() : "";

    var ctl = document.getElementById("f_controls");
    p.controlSamples = ctl
      ? ctl.value.split(",").map(function(x){ return x.trim(); }).filter(Boolean)
      : [];
    return p;
  }

  function doRun(dbOpts, dbCount){
    if(FORM.busy || !FORM.jobId) return;
    var bad = Object.keys(buildPayload()).filter(function(k){
      var v = buildPayload()[k];
      return typeof v === "number" && !isFinite(v);
    });
    if(bad.length){
      FORM.lastError = "These settings are not numbers: " + bad.join(", ");
      preflight(dbOpts, dbCount);
      return;
    }

    FORM.busy = true;
    FORM.lastError = "";
    var run = document.getElementById("runBtn");
    run.disabled = true;
    document.getElementById("runMsg").textContent = "Starting…";

    var jobId = FORM.jobId;
    fetch("/run/" + encodeURIComponent(jobId), {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(buildPayload())
    })
      .then(function(r){
        return r.json().then(function(j){
          if(!r.ok){
            /* The backend refuses with a reason — licence, database, integrity.
               Show the reason it gave, not a generic failure. */
            throw new Error(j.message || j.error || ("HTTP " + r.status));
          }
          return j;
        });
      })
      .then(function(){
        FORM.busy = false;
        return refreshJobs().then(function(){ go({name:"job", id:jobId}); });
      })
      .catch(function(e){
        FORM.busy = false;
        FORM.lastError = "The backend refused this run — " + (e.message || e);
        preflight(dbOpts, dbCount);
      });
  }

  /* Reference files, taken from GET /databases/browse — the actual contents of
     the databases folder, the same listing the production console's file
     browser uses.

     The previous version built this list by pattern-matching the KEYS in
     db_paths.json. On a machine whose db_paths.json still named SILVA 138.1
     files that are not installed, that produced a dropdown of two entries, both
     "file missing on disk", and nothing selectable — the app deciding what you
     are allowed to choose from, incorrectly, with no way to argue. The file
     listing cannot be wrong about what is on disk, and "Custom path…" covers
     everything it cannot see. */
  function databaseOptions(key){
    var files = (STATE.browse && Array.isArray(STATE.browse.files)) ? STATE.browse.files : [];
    if(!files.length) return [];

    var marker = key === "12S"      ? /12s|mifish|pr2/i
               : key === "16S"      ? /silva|16s/i
               : key === "18S-nema" ? /nema|18s|pr2/i
               : key === "ONT-16S"  ? /emu|silva|16s/i
               : key === "PacBio"   ? /silva|16s/i
               : key === "ITS1" || key === "ITS2" ? /unite|its/i
               : key === "COX1"     ? /midori|cox1|coi/i
               : new RegExp(key.replace(/[^\w]/g, ""), "i");

    var hit = [], other = [];
    files.forEach(function(f){
      var base = f.name || "";
      /* An assignSpecies file here is what produced WRONG KIND OF REFERENCE
         FILE. The pipeline finds the matching species file by itself from the
         trainset, so offering it as the main reference can only be a mistake. */
      if(/assignspecies|species_taxid|wspecies/i.test(base)) return;
      var rel = f.rel_path || base;
      var dir = rel.indexOf("/") === -1 ? "" : rel.slice(0, rel.lastIndexOf("/"));
      var o = {
        path:  f.path,
        dir:   dir,
        label: base + (f.size_mb ? "   (" + f.size_mb + " MB)" : ""),
        name:  base
      };
      (marker.test(rel) ? hit : other).push(o);
    });

    /* Matched files first, then everything else still listed but marked — the
       marker match is a filename heuristic and a heuristic must not be allowed
       to hide a file the user knows they installed. */
    function cmp(a, b){ return b.name.localeCompare(a.name, undefined, {numeric:true}); }
    hit.sort(cmp); other.sort(cmp);
    other.forEach(function(o){ o.dir = o.dir + "  — not matched to " + key; });

    var all = hit.concat(other);
    /* Preselect the newest trainset that matches the marker, never a file that
       merely happens to sort first. */
    var pick = hit.filter(function(o){ return /trainset|train_set/i.test(o.name); })[0] || hit[0];
    if(pick) pick.pick = true;
    all.matched = hit.length;
    return all;
  }

  /* ═══ boot ═════════════════════════════════════════════════════════════ */
  njBtn.addEventListener("click", function(){
    var open = njBtn.getAttribute("aria-expanded") === "true";
    njBtn.setAttribute("aria-expanded", String(!open));
    pipes.hidden = open;
  });
  histBtn.addEventListener("click", function(){ go({name:"history"}); });

  document.getElementById("theme").addEventListener("click", function(){
    var r = document.documentElement;
    var dark = r.getAttribute("data-theme") === "dark"
      || (!r.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    r.setAttribute("data-theme", dark ? "light" : "dark");
    try{ localStorage.setItem("nga-beta-theme", dark ? "light" : "dark"); }catch(e){}
  });
  try{
    var saved = localStorage.getItem("nga-beta-theme");
    if(saved) document.documentElement.setAttribute("data-theme", saved);
  }catch(e){}

  /* Licence first: it decides which pipelines are even offered. A failure here
     leaves every pipeline locked, which is the safe direction to fail in. */
  api("/license/status").then(function(L){
    STATE.license = L;
    var names = Array.isArray(L.pipelines) ? L.pipelines : [];
    names.forEach(function(n){ STATE.unlocked[n] = 1; });
  }).catch(function(){
    STATE.license = null;
  }).then(function(){
    renderLicenceBox();
    renderNavPipes();
  });

  api("/databases").then(function(d){ STATE.databases = d; }).catch(function(){});
  /* The authoritative list of what is actually installed. */
  api("/databases/browse").then(function(d){ STATE.browse = d; }).catch(function(){});

  /* Show the BACKEND's version, not a made-up one for this page. The beta badge
     already says what this UI is; claiming a different version number here
     would be the first thing to mislead someone reading a bug report. */
  api("/version").then(function(v){
    if(v && v.version) verLine.textContent = "Company Limited · v" + v.version + " · beta console";
  }).catch(function(){
    verLine.textContent = "Company Limited · beta console";
  });

  go({name:"history"});
})();
</script>
</html>
