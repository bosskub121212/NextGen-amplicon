          + lx.toFixed(1) + '" y2="' + (ly - 4).toFixed(1) + '" stroke="' + P.C.fg3
          + '" stroke-width="0.8"/>');
      out.push('<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" fill="' + P.C.fg
        + '" font-size="' + F.legendSize + '" font-style="italic"'
        + (left ? ' text-anchor="end"' : "") + '>' + esc(d.name) + '</text>');
    });
    return out.join("");
  }

  function prevRange(sets){
    var lo = Infinity, hi = -Infinity;
    sets.forEach(function(D){ D.forEach(function(d){
      var l = Math.log(d.mean) / Math.LN10;
      if(l < lo) lo = l;
      if(l > hi) hi = l;
    }); });
    if(!isFinite(lo)) { lo = -4; hi = 2; }
    return [Math.floor(lo) - 0.2, Math.ceil(hi) + 0.2];
  }

  function prevAxisTitles(P, out){
    out.push('<text transform="translate(' + (P.report ? 30 : 16) + ',' + (P.y + P.h/2)
      + ') rotate(-90)" text-anchor="middle" fill="' + P.C.fg2 + '" font-size="' + P.F.axisSize
      + '">Prevalence across samples (%)</text>');
    out.push('<text x="' + (P.x + P.w/2) + '" y="' + (P.y + P.h + 44) + '" text-anchor="middle" fill="'
      + P.C.fg2 + '" font-size="' + P.F.axisSize
      + '">Mean relative abundance (log10 scale)</text>');
  }

  function drawPrevalence(P){
    var F = P.F;
    if(F.prevFacet === "group" && CHART.groupOn && anyGrouped()) return drawPrevalenceFacets(P);
    var D = prevStats();
    if(!D.length) return '<text x="' + P.x + '" y="' + (P.y + 20) + '" fill="' + P.C.fg2
      + '">No taxon was detected in the samples on screen.</text>';
    var r = prevRange([D]);
    var nLab = Math.min(D.length, Math.max(8, F.topNTaxa || 8));
    var out = [prevPanel(P, {x:P.x, y:P.y, w:P.w, h:P.h}, D, r[0], r[1], nLab,
                         {yTicks:true, xTicks:true})];
    prevAxisTitles(P, out);
    out.push('<text x="' + P.x + '" y="' + (P.y - 8) + '" fill="' + P.C.fg3 + '" font-size="'
      + Math.max(9, F.axisSize - 1) + '">Detected at &gt; 0 per sample; N samples = '
      + visibleIdx(CHART.shape.samples).length + ' · ' + D.length + ' taxa plotted, '
      + nLab + ' named</text>');
    return out.join("");
  }

  /* One panel per group, each recomputing prevalence inside its own samples.
     Prevalence is relative to the group, so a taxon in both samples of a
     two-sample group reads 100% there and 50% overall — different numbers that
     are both right, which is why the panel says how many samples it holds.
     The panels share one x axis: on separate scales they would look comparable
     and not be. */
  function drawPrevalenceFacets(P){
    var S = CHART.shape, F = P.F;
    var vis = visibleIdx(S.samples);
    var gN = [], gIdx = {};
    vis.forEach(function(i){
      var g = groupOf(S.samples[i]) || "(no group)";
      if(gN.indexOf(g) === -1){ gN.push(g); gIdx[g] = []; }
      gIdx[g].push(i);
    });
    var sets = gN.map(function(g){ return prevStats(gIdx[g]); });
    if(!sets.some(function(D){ return D.length; }))
      return '<text x="' + P.x + '" y="' + (P.y + 20) + '" fill="' + P.C.fg2
        + '">No taxon was detected in the samples on screen.</text>';
    var r = prevRange(sets);
    var ncol = Math.min(3, Math.ceil(Math.sqrt(gN.length)));
    var nrow = Math.ceil(gN.length / ncol);
    var gapX = 34, gapY = 46, hdr = 20;
    var pw = (P.w - gapX * (ncol - 1)) / ncol;
    var ph = (P.h - (gapY + hdr) * (nrow - 1) - hdr) / nrow;
    var out = [];
    gN.forEach(function(g, k){
      var c = k % ncol, rw = Math.floor(k / ncol);
      var bx = P.x + c * (pw + gapX), by = P.y + hdr + rw * (ph + gapY + hdr);
      var box = {x:bx, y:by, w:pw, h:ph};
      out.push('<rect x="' + bx + '" y="' + (by - hdr) + '" width="' + pw + '" height="'
        + (hdr - 4) + '" rx="3" fill="' + groupColour(g) + '" fill-opacity="0.18"/>');
      out.push('<text x="' + (bx + pw/2) + '" y="' + (by - 7) + '" text-anchor="middle" fill="'
        + P.C.fg + '" font-size="' + F.legendSize + '" font-weight="600">' + esc(g)
        + ' (n=' + gIdx[g].length + ')</text>');
      /* Fewer names per panel: a quarter-sized panel cannot carry eight
         labels without them colliding into the same smear this plot exists
         to avoid. */
      var nLab = Math.min(sets[k].length, Math.max(3, Math.round((F.topNTaxa || 8) / ncol)));
      out.push(prevPanel(P, box, sets[k], r[0], r[1], nLab,
                         {yTicks: c === 0, xTicks: rw === nrow - 1, small: true}));
      out.push('<rect x="' + bx + '" y="' + by + '" width="' + pw + '" height="' + ph
        + '" fill="none" stroke="' + P.C.line + '" stroke-width="1"/>');
    });
    prevAxisTitles(P, out);
    out.push('<text x="' + P.x + '" y="' + (P.y - 8) + '" fill="' + P.C.fg3 + '" font-size="'
      + Math.max(9, F.axisSize - 1) + '">Detected at &gt; 0 within each group; prevalence is '
      + 'out of that group\u2019s own samples, and the panels share one x axis</text>');
    return out.join("");
  }

  function drawScree(P){
    var SH = CHART.shape;
    var vals = SH.vals.map(function(v){ return v[0] || 0; });
    var yMax = niceMax(Math.max.apply(null, vals.concat([1])));
    var out = [yAxis(P, yMax, SH.cols[0] || "Variance explained")];
    var n = vals.length||1, slot = P.w/n, bw = Math.min(capW(P, 54), slot*0.6);
    vals.forEach(function(v, k){
      var h = v / yMax * P.h, x = P.x + slot*k + (slot-bw)/2;
      out.push('<path d="' + roundRect(x, P.y + P.h - h, bw, h, 4, 0) + '" fill="'
        + seriesPalette()[0] + '" class="seg"><title>' + esc(SH.labels[k]) + '\n'
        + fmtNum(v) + '</title></path>');
      out.push(xTick(P, x + bw/2, SH.labels[k]));
    });
    return out.join("");
  }

  function drawGrouped(P){
    var SH = CHART.shape, ord = visibleIdx(SH.labels);
    var mx = 0;
    ord.forEach(function(i){ (SH.vals[i]||[]).forEach(function(v){ if(v > mx) mx = v; }); });
    var yMax = niceMax(mx || 1);
    var out = [yAxis(P, yMax, "Reads")];
    var n = ord.length||1, slot = P.w/n, inner = Math.min(78, slot*0.74);
    var bw = Math.max(2, (inner - 2*(SH.cols.length-1)) / SH.cols.length);
    ord.forEach(function(si, k){
      var x0 = P.x + slot*k + (slot-inner)/2;
      SH.cols.forEach(function(c, ci){
        var v = (SH.vals[si]||[])[ci] || 0, h = v / yMax * P.h;
        var x = x0 + ci*(bw+2);
        out.push('<path d="' + roundRect(x, P.y + P.h - h, bw, h, 3, 0) + '" fill="'
          + (CHART.colors[c] || seriesColour(ci))
          + '" class="seg"><title>' + esc(labelOf(SH.labels[si])) + ' · ' + esc(c) + '\n'
          + nfmt(v) + '</title></path>');
      });
      out.push(xTick(P, x0 + inner/2, labelOf(SH.labels[si])));
    });
    out.push(legendBox(P, SH.cols.map(function(c, i){
      return {n:c, c:CHART.colors[c] || seriesColour(i)}; })).html);
    return out.join("");
  }

  /* Small multiples: the right answer for several measures on different
     scales, and the reason this app never needs a second y axis. */
  /* One panel per metric, one box per group inside it — the report's
     "Alpha diversity by Breeding" figure. Each panel keeps its own y scale,
     which is right here and wrong on a stacked bar chart: Chao1 runs to 80 and
     Shannon to 3.5, so a shared axis would flatten Shannon into the baseline.
     The panels are different quantities, not parts of one. */
  function drawMultiBox(P){
    var SH = CHART.shape, ord = visibleIdx(SH.labels), F = P.F;
    var gN = [], gIdx = {};
    ord.forEach(function(i){
      var g = groupOf(SH.labels[i]) || "(no group)";
      if(gN.indexOf(g) === -1){ gN.push(g); gIdx[g] = []; }
      gIdx[g].push(i);
    });
    var cols = SH.cols.filter(function(c){ return !/^(se\.|total)/i.test(c); }).slice(0, 6);
    if(!cols.length || !gN.length) return drawMultiBar(P);
    var cw = P.w / cols.length, out = [];
    cols.forEach(function(c, ciRaw){
      var ci = SH.cols.indexOf(c);
      var vals = ord.map(function(i){ return (SH.vals[i]||[])[ci] || 0; });
      var yMax = niceMax(Math.max.apply(null, vals.concat([1])));
      var x0 = P.x + ciRaw*cw + 10, w = cw - 20;
      var sy = function(v){ return P.y + P.h - v / yMax * P.h; };
      out.push('<text x="' + (x0 + w/2) + '" y="' + (P.y - 6) + '" text-anchor="middle" fill="'
        + P.C.fg + '" font-size="' + F.legendSize + '" font-weight="600">' + esc(c) + '</text>');
      out.push('<line x1="' + x0 + '" y1="' + (P.y + P.h) + '" x2="' + (x0 + w) + '" y2="'
        + (P.y + P.h) + '" stroke="' + P.C.line + '" stroke-width="1"/>');
      /* The scale differs per panel, so it has to be printed per panel. */
      out.push('<text x="' + (x0 - 4) + '" y="' + (P.y + 9) + '" text-anchor="end" fill="'
        + P.C.fg3 + '" font-size="' + Math.max(8, F.axisSize - 2) + '">' + fmtNum(yMax) + '</text>');
      out.push('<text x="' + (x0 - 4) + '" y="' + (P.y + P.h) + '" text-anchor="end" fill="'
        + P.C.fg3 + '" font-size="' + Math.max(8, F.axisSize - 2) + '">0</text>');
      var slot = w / (gN.length || 1), bw = Math.min(capW(P, 58), slot * 0.56);
      gN.forEach(function(g, gi){
        var vs = gIdx[g].map(function(i){ return (SH.vals[i]||[])[ci] || 0; })
                        .sort(function(a, b){ return a - b; });
        var cx = x0 + slot*gi + slot/2, x = cx - bw/2;
        var col = groupColour(g);
        var q1 = quantile(vs, 0.25), med = quantile(vs, 0.5), q3 = quantile(vs, 0.75);
        out.push('<line x1="' + cx + '" y1="' + sy(vs[vs.length-1]) + '" x2="' + cx + '" y2="'
          + sy(vs[0]) + '" stroke="' + P.C.fg3 + '" stroke-width="1.3"/>');
        out.push('<rect x="' + x + '" y="' + sy(q3) + '" width="' + bw + '" height="'
          + Math.max(1, sy(q1) - sy(q3)) + '" rx="3" fill="' + col + '" fill-opacity="0.45"'
          + ' stroke="' + col + '" stroke-width="1.3"/>');
        out.push('<line x1="' + x + '" y1="' + sy(med) + '" x2="' + (x + bw) + '" y2="' + sy(med)
          + '" stroke="' + P.C.fg + '" stroke-width="1.8"/>');
        gIdx[g].forEach(function(i, k){
          var v = (SH.vals[i]||[])[ci] || 0;
          var jit = gIdx[g].length > 1 ? (k/(gIdx[g].length-1) - 0.5) * bw * 0.6 : 0;
          out.push('<circle cx="' + (cx + jit).toFixed(1) + '" cy="' + sy(v).toFixed(1)
            + '" r="3.2" fill="' + P.C.fg2 + '" fill-opacity="0.75"><title>'
            + esc(labelOf(SH.labels[i])) + ' · ' + esc(c) + '\n' + fmtNum(v) + '</title></circle>');
        });
        /* Label every panel, not only the first. The panels are side by side
           with a gap between them, so a label under panel 1 does not read as
           applying to panel 4 — it reads as panel 4 having no labels. */
        out.push(xTick(P, cx, g + " (n=" + gIdx[g].length + ")"));
      });
    });
    out.push('<text transform="translate(' + (P.report ? 30 : 16) + ',' + (P.y + P.h/2)
      + ') rotate(-90)" text-anchor="middle" fill="' + P.C.fg2 + '" font-size="' + F.axisSize
      + '">Value — each panel on its own scale</text>');
    if(gN.every(function(g){ return gIdx[g].length < 2; }))
      out.push('<text x="' + P.x + '" y="' + (P.y + P.h + 62) + '" fill="' + P.C.fg3
        + '" font-size="' + F.axisSize + '">Every group holds one sample, so each box is a '
        + 'single value — a label, not a distribution.</text>');
    return out.join("");
  }

  function drawMulti(P){
    if(P.F.alphaShape === "box" && anyGrouped() && CHART.groupOn) return drawMultiBox(P);
    return drawMultiBar(P);
  }

  function drawMultiBar(P){
    var SH = CHART.shape, ord = visibleIdx(SH.labels);
    var cols = SH.cols.slice(0, 6);
    var cw = P.w / cols.length, out = [];
    cols.forEach(function(c, ci){
      var vals = ord.map(function(i){ return (SH.vals[i]||[])[ci] || 0; });
      var yMax = niceMax(Math.max.apply(null, vals.concat([1])));
      var x0 = P.x + ci*cw + 8, w = cw - 16;
      out.push('<text x="' + (x0 + w/2) + '" y="' + (P.y - 6) + '" text-anchor="middle" fill="'
        + P.C.fg + '" font-size="' + P.F.legendSize + '" font-weight="600">' + esc(c) + '</text>');
      out.push('<line x1="' + x0 + '" y1="' + (P.y + P.h) + '" x2="' + (x0 + w) + '" y2="'
        + (P.y + P.h) + '" stroke="' + P.C.line + '" stroke-width="1"/>');
      var slot = w / (ord.length||1), bw = Math.min(capW(P, 26), slot*0.6);
      ord.forEach(function(si, k){
        var v = vals[k], h = v / yMax * P.h, x = x0 + slot*k + (slot-bw)/2;
        var nm = SH.labels[si];
        out.push('<path d="' + roundRect(x, P.y + P.h - h, bw, h, 3, 0) + '" fill="'
          + (CHART.colors[nm] || seriesColour(si))
          + '" class="seg"><title>' + esc(labelOf(nm)) + ' · ' + esc(c) + '\n'
          + fmtNum(v) + '</title></path>');
      });
    });
    out.push(legendBox(P, ord.map(function(si){
      return {n:labelOf(SH.labels[si]),
              c:CHART.colors[SH.labels[si]] || seriesColour(si)}; })).html);
    return out.join("");
  }

  function drawScatter(P){
    var SH = CHART.shape;
    var pts = SH.pts.filter(function(p){ return isShown(p.name); });
    if(!pts.length) return "";
    var xs = pts.map(function(p){ return p.x; }), ys = pts.map(function(p){ return p.y; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var padx = (x1-x0||1)*0.12, pady = (y1-y0||1)*0.12;
    x0 -= padx; x1 += padx; y0 -= pady; y1 += pady;
    var sx = function(v){ return P.x + (v - x0)/(x1-x0) * P.w; };
    var sy = function(v){ return P.y + P.h - (v - y0)/(y1-y0) * P.h; };
    var out = [];
    if(P.F.showGrid)
      for(var t = 0; t <= 4; t++){
        var gy = P.y + P.h*t/4, gx = P.x + P.w*t/4;
        out.push('<line x1="' + P.x + '" y1="' + gy + '" x2="' + (P.x+P.w) + '" y2="' + gy
          + '" stroke="' + P.C.line + '" stroke-width="1"/>');
        out.push('<line x1="' + gx + '" y1="' + P.y + '" x2="' + gx + '" y2="' + (P.y+P.h)
          + '" stroke="' + P.C.line + '" stroke-width="1"/>');
      }
    /* zero lines, which is where an ordination is read from */
    if(x0 < 0 && x1 > 0) out.push('<line x1="' + sx(0) + '" y1="' + P.y + '" x2="' + sx(0)
      + '" y2="' + (P.y+P.h) + '" stroke="' + P.C.fg3 + '" stroke-width="1" stroke-dasharray="3 3"/>');
    if(y0 < 0 && y1 > 0) out.push('<line x1="' + P.x + '" y1="' + sy(0) + '" x2="' + (P.x+P.w)
      + '" y2="' + sy(0) + '" stroke="' + P.C.fg3 + '" stroke-width="1" stroke-dasharray="3 3"/>');
    /* Colour by group when there is one. An ordination with 34 points in 34
       colours tells you nothing; the question it is drawn to answer is whether
       the groups separate. Fall back to per-sample colours when nothing is
       grouped, so the chart still works before any grouping is set. */
    var byGrp = CHART.groupOn && anyGrouped();
    pts.forEach(function(p, i){
      var g = groupOf(p.name);
      var col = CHART.colors[p.name] || (byGrp && g ? groupColour(g)
                                         : byGrp ? otherColour() : seriesColour(i));
      /* 2px surface ring so overlapping points stay countable */
      out.push('<circle cx="' + sx(p.x).toFixed(1) + '" cy="' + sy(p.y).toFixed(1)
        + '" r="7" fill="' + col + '" stroke="' + P.C.surface + '" stroke-width="2" class="seg">'
        + '<title>' + esc(labelOf(p.name)) + '\n' + esc(SH.xLab) + ' ' + p.x.toFixed(3)
        + '\n' + esc(SH.yLab) + ' ' + p.y.toFixed(3) + '</title></circle>');
      out.push('<text x="' + (sx(p.x)+11).toFixed(1) + '" y="' + (sy(p.y)+4).toFixed(1) + '" fill="'
        + P.C.fg + '" font-size="' + P.F.legendSize + '">' + esc(labelOf(p.name)) + '</text>');
    });
    out.push('<line x1="' + P.x + '" y1="' + (P.y+P.h) + '" x2="' + (P.x+P.w) + '" y2="' + (P.y+P.h)
      + '" stroke="' + P.C.line + '" stroke-width="1"/>');
    out.push('<text x="' + (P.x+P.w/2) + '" y="' + (P.y+P.h+40) + '" text-anchor="middle" fill="'
      + P.C.fg2 + '" font-size="' + P.F.axisSize + '">' + esc(SH.xLab) + '</text>');
    out.push('<text transform="translate(' + (P.report ? 30 : 16) + ',' + (P.y+P.h/2)
      + ') rotate(-90)" text-anchor="middle" fill="'
      + P.C.fg2 + '" font-size="' + P.F.axisSize + '">' + esc(SH.yLab) + '</text>');
    if(byGrp) out.push(groupLegend(P, P.y));
    return out.join("");
  }

  /* Collapse the per-sample curves into one per group: the mean at each depth
     with a band from the group's lowest to its highest sample there. The report
     draws a ribbon this way, and it answers the question a pile of 34 curves
     cannot — whether the groups differ, or whether their spreads overlap so
     much that the difference is noise. */
  function groupCurves(SH){
    var gN = [], gIdx = {};
    SH.series.forEach(function(nm, i){
      if(!isShown(nm)) return;
      var g = groupOf(nm);
      if(!g) return;
      if(gN.indexOf(g) === -1){ gN.push(g); gIdx[g] = []; }
      gIdx[g].push(i);
    });
    if(!gN.length) return null;
    return {names:gN, at: SH.xs.map(function(_, k){
      return gN.map(function(g){
        var vs = gIdx[g].map(function(i){ return SH.ys[k][i]; })
                        .filter(function(v){ return isFinite(v); });
        if(!vs.length) return null;
        var sum = vs.reduce(function(a, b){ return a + b; }, 0);
        return {m: sum / vs.length, lo: Math.min.apply(null, vs),
                hi: Math.max.apply(null, vs), n: vs.length};
      }); })};
  }

  function drawLinesByGroup(P){
    var SH = CHART.shape, G = groupCurves(SH);
    if(!G) return drawLinesBySample(P);
    var mx = 0;
    G.at.forEach(function(row){ row.forEach(function(c){
      if(c && c.hi > mx) mx = c.hi; }); });
    var yMax = niceMax(mx || 1);
    var xmin = Math.min.apply(null, SH.xs), xmax = Math.max.apply(null, SH.xs);
    var sx = function(v){ return P.x + (xmax > xmin ? (v-xmin)/(xmax-xmin) : 0) * P.w; };
    var sy = function(v){ return P.y + P.h - v/yMax * P.h; };
    var out = [yAxis(P, yMax, "Value")];
    G.names.forEach(function(g, gi){
      var col = groupColour(g);
      var up = [], dn = [], line = [], pen = false;
      SH.xs.forEach(function(x, k){
        var c = G.at[k][gi];
        if(!c){ pen = false; return; }
        up.push(sx(x).toFixed(1) + "," + sy(c.hi).toFixed(1));
        dn.unshift(sx(x).toFixed(1) + "," + sy(c.lo).toFixed(1));
        line.push((pen ? "L" : "M") + sx(x).toFixed(1) + "," + sy(c.m).toFixed(1));
        pen = true;
      });
      if(up.length > 1)
        out.push('<path d="M' + up.join("L") + "L" + dn.join("L") + 'Z" fill="' + col
          + '" fill-opacity="0.16" stroke="none"/>');
      if(line.length)
        out.push('<path d="' + line.join("") + '" fill="none" stroke="' + col
          + '" stroke-width="2.4" stroke-linejoin="round" class="seg"><title>' + esc(g)
          + '</title></path>');
    });
    for(var t = 0; t <= 4; t++){
      var xv = xmin + (xmax-xmin)*t/4;
      out.push(xTick(P, sx(xv), shortNum(xv)));
    }
    out.push('<text x="' + (P.x+P.w/2) + '" y="' + (P.y+P.h+48) + '" text-anchor="middle" fill="'
      + P.C.fg2 + '" font-size="' + P.F.axisSize + '">' + esc(SH.xLab || "") + '</text>');
    out.push(legendBox(P, G.names.map(function(g){ return {n:g, c:groupColour(g)}; })).html);
    var lone = G.names.filter(function(g, gi){
      return (G.at[0] && G.at[0][gi] ? G.at[0][gi].n : 0) < 2; });
    if(lone.length)
      out.push('<text x="' + P.x + '" y="' + (P.y - 8) + '" fill="' + P.C.fg3
        + '" font-size="' + P.F.axisSize + '">'
        + esc(lone.join(", ")) + (lone.length === 1 ? ' holds' : ' hold')
        + ' one sample, so that line is the sample and the band is absent.</text>');
    return out.join("");
  }

  function drawLines(P){
    if(P.F.curveMode === "group" && anyGrouped() && CHART.groupOn) return drawLinesByGroup(P);
    return drawLinesBySample(P);
  }

  function drawLinesBySample(P){
    var SH = CHART.shape;
    /* A curve per sample is a curve that a hidden sample must not draw. */
    var keep = SH.series.map(function(s, i){ return i; })
      .filter(function(i){ return isShown(SH.series[i]); });
    var sers = keep.slice(0, 24).map(function(i){ return SH.series[i]; });
    var cols = keep.slice(0, 24);
    var mx = 0;
    SH.ys.forEach(function(row){ cols.forEach(function(i){
      if(isFinite(row[i]) && row[i] > mx) mx = row[i]; }); });
    var yMax = niceMax(mx || 1);
    var xmin = Math.min.apply(null, SH.xs), xmax = Math.max.apply(null, SH.xs);
    var sx = function(v){ return P.x + (xmax > xmin ? (v-xmin)/(xmax-xmin) : 0) * P.w; };
    var sy = function(v){ return P.y + P.h - v/yMax * P.h; };
    var out = [yAxis(P, yMax, sers.length === 1 ? sers[0] : "Value")];
    sers.forEach(function(s, i){
      var ci = cols[i];
      var col = CHART.colors[s] || seriesColour(i);
      /* Lift the pen over a gap rather than drawing through it at zero. */
      var pen = false;
      var d = SH.xs.map(function(x, k){
        var v = SH.ys[k][ci];
        if(!isFinite(v)){ pen = false; return ""; }
        var cmd = (pen ? "L" : "M") + sx(x).toFixed(1) + "," + sy(v).toFixed(1);
        pen = true; return cmd;
      }).join("");
      if(!d) return;
      out.push('<path d="' + d + '" fill="none" stroke="' + col
        + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" class="seg">'
        + '<title>' + esc(s) + '</title></path>');
    });
    for(var t = 0; t <= 4; t++){
      var xv = xmin + (xmax-xmin)*t/4;
      out.push(xTick(P, sx(xv), shortNum(xv)));
    }
    out.push('<text x="' + (P.x+P.w/2) + '" y="' + (P.y+P.h+48) + '" text-anchor="middle" fill="'
      + P.C.fg2 + '" font-size="' + P.F.axisSize + '">' + esc(SH.xLab || "") + '</text>');
    if(sers.length > 1)
      out.push(legendBox(P, sers.slice(0, 12).map(function(s, i){
        return {n:s, c:CHART.colors[s] || seriesColour(i)}; })).html);
    return out.join("");
  }

  function drawHist(P){
    var SH = CHART.shape;
    var vals = SH.ys.map(function(r){ return r[0] || 0; });
    var yMax = niceMax(Math.max.apply(null, vals.concat([1])));
    var out = [yAxis(P, yMax, SH.series[0] || "Count")];
    var n = vals.length||1, bw = Math.max(1, P.w/n - 1);
    vals.forEach(function(v, k){
      var h = v/yMax * P.h, x = P.x + (P.w/n)*k;
      out.push('<path d="' + roundRect(x, P.y + P.h - h, bw, h, Math.min(3, bw/2), 0) + '" fill="'
        + seriesPalette()[0] + '" class="seg"><title>' + esc(SH.xLab) + ' ' + SH.xs[k]
        + '\n' + nfmt(v) + '</title></path>');
    });
    for(var t = 0; t <= 4; t++){
      var k = Math.round((n-1)*t/4);
      out.push(xTick(P, P.x + (P.w/n)*k + bw/2, String(SH.xs[k])));
    }
    out.push('<text x="' + (P.x+P.w/2) + '" y="' + (P.y+P.h+48) + '" text-anchor="middle" fill="'
      + P.C.fg2 + '" font-size="' + P.F.axisSize + '">' + esc(SH.xLab || "") + '</text>');
    return out.join("");
  }

  function drawBox(P){
    var SH = CHART.shape, ord = visibleIdx(SH.labels);
    var all = [];
    ord.forEach(function(i){ (SH.vals[i]||[]).forEach(function(v){ all.push(v); }); });
    var yMax = niceMax(Math.max.apply(null, all.concat([1])));
    var out = [yAxis(P, yMax, "Value")];
    var n = ord.length||1, slot = P.w/n, bw = Math.min(56, slot*0.42);
    ord.forEach(function(si, k){
      var v = (SH.vals[si]||[]).filter(function(x){ return isFinite(x); }).sort(function(a,b){ return a-b; });
      if(!v.length) return;
      function q(p){ var i = (v.length-1)*p, lo = Math.floor(i), hi = Math.ceil(i);
                     return v[lo] + (v[hi]-v[lo])*(i-lo); }
      var q1 = q(0.25), med = q(0.5), q3 = q(0.75), lo = v[0], hi = v[v.length-1];
      var cx = P.x + slot*k + slot/2;
      var sy = function(y){ return P.y + P.h - y/yMax*P.h; };
      var col = CHART.colors[SH.labels[si]] || seriesColour(si);
      out.push('<line x1="' + cx + '" y1="' + sy(hi) + '" x2="' + cx + '" y2="' + sy(lo)
        + '" stroke="' + P.C.fg3 + '" stroke-width="1.5"/>');
      out.push('<rect x="' + (cx-bw/2) + '" y="' + sy(q3) + '" width="' + bw + '" height="'
        + Math.max(1, sy(q1)-sy(q3)) + '" rx="3" fill="' + col + '" opacity=".85" class="seg">'
        + '<title>' + esc(labelOf(SH.labels[si])) + '\nmedian ' + fmtNum(med)
        + '\nIQR ' + fmtNum(q1) + '–' + fmtNum(q3) + '\nrange ' + fmtNum(lo) + '–' + fmtNum(hi)
        + '</title></rect>');
      out.push('<line x1="' + (cx-bw/2) + '" y1="' + sy(med) + '" x2="' + (cx+bw/2) + '" y2="'
        + sy(med) + '" stroke="' + P.C.surface + '" stroke-width="2"/>');
      out.push(xTick(P, cx, labelOf(SH.labels[si])));
    });
    return out.join("");
  }

  /* UPGMA, computed here from the distance matrix rather than read from a
     picture. Average linkage, same as the pipeline's hclust(method="average"). */
  /* ── average-linkage clustering, used by both trees ──────────────────────
     The sample dendrogram and the row tree beside the taxonomic heatmap are the
     same computation on different distances, so it lives in one place. Written
     twice they would drift, and two trees in one report that disagree about
     what clusters with what is worse than having only one of them.

     D is a full square matrix of distances. The merge height is the mean
     distance between every pair across the two clusters — that is what
     "average linkage" means, and it is what hclust(method="average") does. */
  function upgma(D){
    var clusters = D.map(function(_, i){ return {leaves:[i], h:0, x:null, kids:null}; });
    function dist(a, b){
      var s = 0, c = 0;
      a.leaves.forEach(function(i){ b.leaves.forEach(function(j){
        var v = (D[i]||[])[j]; if(isFinite(v)){ s += v; c++; } }); });
      return c ? s/c : 0;
    }
    while(clusters.length > 1){
      var bi = 0, bj = 1, bd = Infinity;
      for(var i = 0; i < clusters.length; i++)
        for(var j = i+1; j < clusters.length; j++){
          var d = dist(clusters[i], clusters[j]);
          if(d < bd){ bd = d; bi = i; bj = j; }
        }
      var merged = {leaves:clusters[bi].leaves.concat(clusters[bj].leaves), h:bd,
                    kids:[clusters[bi], clusters[bj]]};
      clusters = clusters.filter(function(_, k){ return k !== bi && k !== bj; });
      clusters.push(merged);
    }
    return clusters[0];
  }

  function leafOrderOf(root){
    var order = [];
    (function walk(c){ if(!c.kids) order.push(c.leaves[0]); else c.kids.forEach(walk); })(root);
    return order;
  }

  /* Euclidean distance between every pair of rows. The report clusters the
     heatmap's rows this way (clustering_distance_rows = "euclidean"), and the
     rows are compared on the values the heatmap actually shows — each taxon
     against its own maximum — so two taxa cluster for having the same PATTERN
     across samples, not for being the same size. Clustering the raw values
     would simply sort the taxa by abundance again, which the row order on a
     heatmap already does. */
  function rowDistances(rows){
    var norm = rows.map(function(r){
      var mx = Math.max.apply(null, r.concat([0])) || 1;
      return r.map(function(v){ return (v || 0) / mx; });
    });
    return norm.map(function(a){
      return norm.map(function(b){
        var s = 0;
        for(var i = 0; i < a.length; i++){ var d = a[i] - b[i]; s += d * d; }
        return Math.sqrt(s);
      });
    });
  }

  /* The tree drawn flat against the left edge of a heatmap: leaves on the
     right at the row centres, root at the left. */
  function rowTree(root, x0, w, yOf){
    if(!root || !root.kids) return "";
    var maxH = root.h || 1, out = [];
    var sx = function(h){ return x0 + w - (h / maxH) * (w - 4); };
    (function place(c, k){
      if(!c.kids){ c.y = yOf(c.leaves[0]); c.x = x0 + w; return c.y; }
      var ys = c.kids.map(place);
      c.y = (ys[0] + ys[1]) / 2; c.x = sx(c.h);
      out.push('<path d="M' + c.kids[0].x.toFixed(1) + ',' + ys[0].toFixed(1)
        + 'H' + c.x.toFixed(1) + 'V' + ys[1].toFixed(1) + 'H' + c.kids[1].x.toFixed(1)
        + '" fill="none" stroke="currentColor" stroke-width="1.2"/>');
      return c.y;
    })(root);
    return out.join("");
  }

  function drawDendro(P){
    /* Cluster the samples that are on screen. Clustering all four and then
       labelling two is a different tree: average linkage merges in the order
       the distances dictate, so a hidden sample changes where the visible ones
       join. The tree has to be built from the submatrix. */
    var SH = CHART.shape;
    var keep = visibleIdx(SH.names);
    var names = keep.map(function(i){ return SH.names[i]; });
    var n = names.length;
    if(n < 2) return '<text x="' + P.x + '" y="' + (P.y+20) + '" fill="' + P.C.fg2
      + '">A dendrogram needs at least two samples' + (keep.length < SH.names.length
        ? ' — ' + (SH.names.length - keep.length) + ' of ' + SH.names.length + ' are hidden.' : '.')
      + '</text>';
    var D = keep.map(function(i){
      return keep.map(function(j){ return (SH.m[i] || [])[j]; }); });
    var root = upgma(D);
    var maxH = root.h || 1;
    var leafOrder = leafOrderOf(root);
    var step = P.h / (leafOrder.length || 1);
    var out = [];
    var sx = function(h){ return P.x + P.w - (h / maxH) * (P.w - 12); };
    (function place(c){
      if(!c.kids){ c.y = P.y + step * (leafOrder.indexOf(c.leaves[0]) + 0.5); c.x = P.x + P.w; return c.y; }
      var ys = c.kids.map(place);
      c.y = (ys[0] + ys[1]) / 2; c.x = sx(c.h);
      out.push('<path d="M' + c.kids[0].x.toFixed(1) + ',' + ys[0].toFixed(1)
        + 'H' + c.x.toFixed(1) + 'V' + ys[1].toFixed(1) + 'H' + c.kids[1].x.toFixed(1)
        + '" fill="none" stroke="' + P.C.fg2 + '" stroke-width="1.6" class="seg">'
        + '<title>joins at ' + c.h.toFixed(3) + '</title></path>');
      return c.y;
    })(root);
    var byG = CHART.groupOn && anyGrouped();
    leafOrder.forEach(function(li, k){
      var y = P.y + step*(k + 0.5);
      var g = groupOf(names[li]);
      var col = CHART.colors[names[li]]
        || (byG ? (g ? groupColour(g) : otherColour()) : seriesColour(li));
      out.push('<circle cx="' + (P.x + P.w) + '" cy="' + y.toFixed(1) + '" r="4" fill="' + col + '"/>');
      out.push('<text x="' + (P.x + P.w + 10) + '" y="' + (y + 4).toFixed(1) + '" fill="' + P.C.fg
        + '" font-size="' + P.F.legendSize + '">' + esc(labelOf(names[li])) + '</text>');
    });
    out.push('<text x="' + P.x + '" y="' + (P.y + P.h + 24) + '" fill="' + P.C.fg3
      + '" font-size="' + P.F.axisSize + '">average linkage · height = distance, '
      + maxH.toFixed(2) + ' at the root</text>');
    if(byG) out.push(groupLegend(P, P.y));
    return out.join("");
  }

  function niceMax(v){
    if(!isFinite(v) || v <= 0) return 1;
    var mag = Math.pow(10, Math.floor(Math.log(v)/Math.LN10));
    return Math.ceil(v / (mag/2)) * (mag/2);
  }
  function roundRect(x, y, w, h, rT, rB){
    rT = Math.min(rT, h/2, w/2); rB = Math.min(rB, h/2, w/2);
    return "M" + (x+rT) + "," + y + "h" + (w-2*rT) + "a" + rT + "," + rT + " 0 0 1 " + rT + "," + rT
      + "v" + (h-rT-rB) + "a" + rB + "," + rB + " 0 0 1 " + (-rB) + "," + rB
      + "h" + (-(w-2*rB)) + "a" + rB + "," + rB + " 0 0 1 " + (-rB) + "," + (-rB)
      + "v" + (-(h-rT-rB)) + "a" + rT + "," + rT + " 0 0 1 " + rT + "," + (-rT) + "z";
  }
  function shortNum(v){
    if(Math.abs(v) >= 1e6) return (v/1e6).toFixed(Math.abs(v) >= 1e7 ? 0 : 1) + "M";
    if(Math.abs(v) >= 1e3) return (v/1e3).toFixed(Math.abs(v) >= 1e4 ? 0 : 1) + "k";
    return String(Math.round(v*100)/100);
  }

  /* The table view. Not a nicety: three light-mode palette slots sit below 3:1
     against the surface, and the rule for that is relief — a reader who cannot
     separate two fills must be able to read the numbers somewhere. */
  function chartTable(){
    var k = CHART.tab.kind, S = CHART.shape;
    if(k === "stack" || k === "taxheat"){
      S = viewShape();
      var ser = series(), ord = shownIdx(S);
      var pct = CHART.font.chartType === "bar100" && k === "stack";
      var tot = ord.map(function(si){
        return ser.reduce(function(a,s){ return a + (s.values[si]||0); }, 0); });
      return tbl(["Taxon"].concat(ord.map(function(si){ return labelOf(S.samples[si]); })),
        ser.map(function(s, i){
          return [swatch(colourOf(s,i)) + esc(s.name)].concat(ord.map(function(si, c){
            var v = s.values[si] || 0;
            return pct && tot[c] > 0 ? (v/tot[c]*100).toFixed(1) + "%" : nfmt(v); })); }));
    }
    if(k === "stepbox"){
      var oq = visibleIdx(S.labels);
      return tbl(["Sample"].concat(S.cols),
        oq.map(function(si){
          return [esc(labelOf(S.labels[si]))].concat(
            S.cols.map(function(_, ci){ return nfmt((S.vals[si]||[])[ci] || 0); })); }));
    }
    if(k === "prevalence"){
      var np = visibleIdx(S.samples).length;
      return tbl(["Taxon", "Samples detected", "Prevalence", "Mean relative abundance (%)"],
        prevStats().map(function(d, i){
          return [swatch(seriesColour(i)) + esc(d.name), d.seen + " of " + np,
                  d.prev.toFixed(0) + "%", d.mean.toPrecision(3)]; }));
    }
    if(k === "taxsum"){
      /* The report's "Summary of Species Detection": how many samples a species
         turned up in, and how many reads it accounts for. The reads are DERIVED
         — percentage per sample times that sample's non-chimeric depth — so the
         column header says so rather than passing an estimate off as a count. */
      var ordT = visibleIdx(S.samples);
      var dep2 = CHART.depths || {};
      var haveDep = Object.keys(dep2).length > 0;
      var rowsT = S.taxa.map(function(t, i){
        var row = S.matrix[i] || [], seen = 0, sum = 0, reads = 0;
        ordT.forEach(function(si){
          var v = row[si] || 0;
          if(v > 0) seen++;
          sum += v;
          reads += v / 100 * (dep2[S.samples[si]] || 0);
        });
        return {name:t, seen:seen, mean:sum / (ordT.length || 1), reads:Math.round(reads)};
      }).filter(function(d){ return d.seen > 0; })
        .sort(function(a, b){ return haveDep ? b.reads - a.reads : b.mean - a.mean; });
      var head2 = ["Species", "Samples detected", "Mean relative abundance (%)"];
      if(haveDep) head2.push("Reads (derived from " + (CHART.depthCol || "depth") + ")");
      return tbl(head2, rowsT.map(function(d){
        var r = [esc(d.name), String(d.seen) + " of " + ordT.length, d.mean.toPrecision(3)];
        if(haveDep) r.push(nfmt(d.reads));
        return r;
      })) + (haveDep ? "" :
        '<div class="hidnote">Read counts are not shown: read_tracking.csv could not be read '
        + 'for this job, and the taxonomy table holds percentages, not reads. The detection '
        + 'counts and mean abundances above come from the taxonomy table itself and are '
        + 'unaffected.</div>');
    }
    if(k === "matrix" || k === "dendro"){
      var o2 = visibleIdx(S.names);
      return tbl([""].concat(o2.map(function(i){ return labelOf(S.names[i]); })),
        o2.map(function(ri){
          return [esc(labelOf(S.names[ri]))].concat(o2.map(function(ci){
            var v = (S.m[ri]||[])[ci];
            return isFinite(v) ? v.toFixed(3) : "—"; })); }));
    }
    if(k === "scatter"){
      return tbl(["Sample", S.xLab, S.yLab],
        S.pts.filter(function(p){ return isShown(p.name); }).map(function(p, i){
          return [swatch(CHART.colors[p.name] || seriesColour(i))
                  + esc(labelOf(p.name)), p.x.toFixed(4), p.y.toFixed(4)]; }));
    }
    if(k === "lines" || k === "hist"){
      return tbl([S.xLab].concat(S.series),
        S.xs.map(function(x, k2){
          return [String(x)].concat(S.ys[k2].map(function(v){ return fmtNum(v); })); }));
    }
    var o3 = visibleIdx(S.labels);
    return tbl(["Sample"].concat(S.cols),
      o3.map(function(si){
        return [swatch(CHART.colors[S.labels[si]] || seriesColour(si))
                + esc(labelOf(S.labels[si]))]
          .concat((S.vals[si]||[]).map(function(v){ return fmtNum(v); })); }));
  }
  function swatch(c){
    return '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'
      + c + ';margin-right:7px"></span>';
  }
  function tbl(head, rows){
    return '<div class="tblwrap"><table class="dtab"><thead><tr>'
      + head.map(function(h, i){
          return '<th' + (i ? ' style="text-align:right"' : "") + '>' + esc(h) + '</th>'; }).join("")
      + '</tr></thead><tbody>'
      + rows.map(function(r){
          return '<tr>' + r.map(function(c, i){
            return '<td' + (i ? ' class="n"' : "") + '>' + c + '</td>'; }).join("") + '</tr>'; }).join("")
      + '</tbody></table></div>';
  }

  /* ── the editor shell ────────────────────────────────────────────────── */

            return '<button class="tabb' + (T && t.id === T.id ? " on" : "") + '" data-tab="'
              + esc(t.id) + '">' + esc(t.label) + '</button>'; }).join("")

    }).join("");

    if(sub){
      if(CHART.loading) sub.textContent = "Reading " + (T ? T.f : "") + "…";

    var canvas = CHART.loading ? '<div class="skel">Loading ' + esc(T ? T.f : "") + '…</div>'
      : CHART.err ? '<div class="errbox" style="border-radius:0"><b>Could not read '
          + esc(T.f) + '.</b>\n' + esc(CHART.err) + '</div>'

    body.innerHTML =
        '<div class="panel" style="margin-bottom:12px"><div class="tabbar">' + tabsHtml + '</div></div>'
      + '<div class="rescols" style="grid-template-columns:minmax(0,1fr) 330px">'
        + '<div class="panel">'
          + '<div class="resbar">'
            + '<div class="segbtns" role="group" aria-label="View">'
              + '<button class="segb' + (CHART.view === "chart" ? " on" : "") + '" data-view="chart">Chart</button>'
              + '<button class="segb' + (CHART.view === "table" ? " on" : "") + '" data-view="table">Table</button>'
            + '</div><span class="sp"></span>'
            + '<span class="msg" id="allPngMsg" style="margin-right:10px">' + esc(EXPORT.msg) + '</span>'
            + '<button class="btn" id="rrBtn"'
              + (CHART.rr.state === "running" ? " disabled" : "") + '>'
              + (CHART.rr.state === "running" ? "R is drawing…" : "Re-render in R") + '</button>'
            + (CHART.rr.files && CHART.rr.files.length
                ? '<button class="btn" id="rrZip">Download R figures ('
                  + CHART.rr.files.length + ')</button>' : "")
            + '<button class="btn" id="allPngBtn"' + (EXPORT.busy ? " disabled" : "") + '>'
            + (EXPORT.busy ? "Exporting…" : "Export all charts (ZIP)") + '</button>'
            + '<button class="btn" id="pngBtn"' + (CHART.err ? " disabled" : "") + '>Download PNG</button>'
          + '</div>'

                    ? '<div class="mono" style="white-space:pre-wrap;max-height:160px;'
                      + 'overflow:auto;margin-top:6px;font-size:11px">'
                      + esc(CHART.rr.log.split("\n").slice(-14).join("\n")) + '</div>'
                    : "")
                + (CHART.rr.state === "done"
                    ? ' These are R\u2019s own figures, drawn with the colours and Top-N saved '

                      + 'are untouched.'
                    : "")
                + '</div>'

          + '<div id="canvasBox" style="padding:' + (CHART.view === "chart" ? "14px" : "0") + '">'

        + '<button class="btn' + (CHART.dirty ? " pri" : "") + '" id="saveBtn">'
        + (CHART.dirty ? "Save settings \u2022 unsaved" : "Save settings") + '</button>'
      + '</div>';
