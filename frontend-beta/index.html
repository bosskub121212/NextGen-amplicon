            return '<button class="ramp' + (nm === F.colorscale ? " on" : "") + '" data-ramp="'
              + esc(nm) + '" title="' + esc(nm + (SCALE_WARN[nm] ? " — " + SCALE_WARN[nm] : ""))
              + '"><span style="background:linear-gradient(to right,' + SCALES[nm].join(",")
              + ')"></span>' + esc(nm) + '</button>'; }).join("")
        + '</div>'
        + (SCALE_WARN[F.colorscale]
            ? '<span class="note" style="color:var(--warn)"><b>' + esc(F.colorscale) + '</b> is '
              + esc(SCALE_WARN[F.colorscale]) + '. It is here because the production console offers '
              + 'it; Viridis says the same thing and survives colour-blind simulation.</span>'
            : '<span class="note">Monotonic in lightness, so the order is readable in greyscale '
              + 'and under colour-blind simulation.</span>')
        + '</div>');
    }
    out.push('<div class="f"><label for="c_title">Title</label>'
      + '<input type="text" id="c_title" value="' + esc(F.titleText) + '" placeholder="leave blank for no title"></div>');
    out.push('<div class="grid2" style="padding:0;gap:10px">'
      + '<div class="f"><label for="c_ts">Title size</label><input type="text" id="c_ts" value="' + F.titleSize + '"></div>'
      + '<div class="f"><label for="c_as">Axis size</label><input type="text" id="c_as" value="' + F.axisSize + '"></div>'
      + '<div class="f"><label for="c_ls">Legend size</label><input type="text" id="c_ls" value="' + F.legendSize + '"></div>'
      + '<div class="f"><label for="c_xs">Sample label size</label><input type="text" id="c_xs" value="' + F.xSize + '"></div>'
      + '</div>');
    out.push('<div class="grid2" style="padding:0;gap:10px">'
      + '<div class="f"><label for="c_grid">Grid lines</label><select id="c_grid">'
        + '<option value="true"' + (F.showGrid ? " selected" : "") + '>on</option>'
        + '<option value="false"' + (!F.showGrid ? " selected" : "") + '>off</option></select></div>'
      + '<div class="f"><label for="c_xi">Sample labels</label><select id="c_xi">'
        + '<option value="n"' + (!F.xItalic && !F.xBold ? " selected" : "") + '>plain</option>'
        + '<option value="i"' + (F.xItalic ? " selected" : "") + '>italic</option>'
        + '<option value="b"' + (F.xBold && !F.xItalic ? " selected" : "") + '>bold</option></select></div>'
      + '</div>');
    out.push('</div>');

    /* colours: taxa on a stacked chart, samples everywhere else */
    var items = [];
    if(k === "stack") items = series().map(function(s, i){
      return {name:s.name, c:colourOf(s, i), sub:s.grouped ? s.members + " taxa" : ""}; });
    else if(k === "taxheat" || k === "matrix") items = [];
    else {
      var names = S.labels || S.names || (S.pts ? S.pts.map(function(p){ return p.name; }) : null)
                  || (k === "grouped" ? S.cols : null) || S.series || [];
      if(k === "grouped") names = S.cols || [];
      items = names.slice(0, 24).map(function(nm, i){
        return {name:nm, c:CHART.colors[nm] || seriesColour(i), sub:""}; });
    }
    if(items.length){
      out.push('<div class="sechdr" style="border-top:1px solid var(--line)"><h3>Colours</h3>'
        + '<span class="hint"><button class="lnk" id="resetCol">reset to default</button></span></div>'
        + '<div class="swatches">'
        + items.map(function(it){
            return '<label class="sw"><input type="color" data-tax="' + esc(it.name) + '" value="'
              + esc(toHex(it.c)) + '"><span class="nm">' + esc(it.name) + '</span>'
              + (it.sub ? '<span class="gr">' + esc(it.sub) + '</span>' : "") + '</label>'; }).join("")
        + '</div>');
    }

    /* samples: rename and reorder, wherever the chart has samples */
    var sampleNames = S.samples || S.labels || S.names
      || (S.pts ? S.pts.map(function(p){ return p.name; }) : null);
    if(sampleNames && sampleNames.length && k !== "lines" && k !== "hist" && k !== "scree"){
      var ord = orderedIdx(sampleNames);
      var canFacet = (k === "stack" && !aggOn()) || k === "alpha";
      /* Describe the chart on screen, not the metadata file. A group whose only
         members are hidden is not a panel, and a group that looks replicated in
         metadata.csv can be one-sample-per-group once samples are hidden —
         which is exactly the R1-vs-R2 case. The warning has to follow what is
         actually plotted or it says the wrong thing at the worst moment. */
      var shownNames = sampleNames.filter(function(n){ return !CHART.hidden[n]; });
      var nGrouped = shownNames.filter(function(n){
        return (CHART.groups[n] || "").trim(); }).length;
      var gNames = [], gCount = {};
      shownNames.forEach(function(n){
        var g = (CHART.groups[n] || "").trim();
        if(!g) return;
        if(gNames.indexOf(g) === -1) gNames.push(g);
        gCount[g] = (gCount[g] || 0) + 1;
      });

      var nOut = ungroupedCount();
      var nHiddenNow = sampleNames.filter(function(n){ return CHART.hidden[n]; }).length;
      out.push('<div class="sechdr" style="border-top:1px solid var(--line)"><h3>Groups</h3>'
        + '<span class="hint">' + (nGrouped
            ? gNames.length + " group" + (gNames.length === 1 ? "" : "s")
            : "none set") + '</span></div>'
        + '<div class="grid2" style="grid-template-columns:1fr;padding:12px 14px;gap:10px">'
        /* A job can carry more than one grouping. dada2_pipeline.R already reads
           every non-id column of metadata.csv as a grouping and draws a figure
           per column, so keeping Grouping1 and Grouping2 in the same file is
           not a private convention of this editor — a re-run honours both. */
        + '<div class="f"><label for="gCol">Grouping</label>'
          + '<select id="gCol">'
          + CHART.groupCols.map(function(k){
              return '<option value="' + esc(k) + '"'
                + (k === CHART.groupCol ? " selected" : "") + '>' + esc(k) + '</option>'; }).join("")
          + '<option value="__newgrouping__">＋ New grouping…</option>'
          + '</select><span class="note">'
          + (CHART.groupCols.length > 1
              ? 'This job holds ' + CHART.groupCols.length + ' groupings. The chart splits by '
                + 'the one selected here; all of them are written to metadata.csv when you save.'
              : 'Add a second grouping to keep, say, “all four” and “R1 vs R2” in one job '
                + 'instead of one run each.')
          + '</span></div>'
        + (canFacet
            ? '<div class="f"><label for="c_facet">Split the chart by group</label>'
              + '<select id="c_facet">'
              + '<option value="on"' + (CHART.groupOn ? " selected" : "") + '>on</option>'
              + '<option value="off"' + (!CHART.groupOn ? " selected" : "") + '>off</option>'
              + '</select><span class="note">'
              + (nGrouped
                  ? 'One panel per group, sharing a single y axis. '
                    + (gNames.every(function(g){ return gCount[g] < 2; })
                      ? '<b>Every group here holds one sample</b>, so the panels label the '
                        + 'samples rather than comparing groups — there is nothing to average '
                        + 'and no test is possible.'
                      : "")
                  : 'Give the samples a group below and the chart splits into panels.')
              + '</span></div>'
            : '<div class="f"><span class="note">Splitting by group applies to the taxonomy '
              + 'and alpha-diversity charts.</span></div>')
        + (nOut
            ? '<div class="f"><label for="c_ungrp">Ungrouped samples</label>'
              + '<select id="c_ungrp">'
              + '<option value="drop"' + (CHART.font.ungrouped !== "show" ? " selected" : "")
                + '>Leave out of the chart</option>'
              + '<option value="show"' + (CHART.font.ungrouped === "show" ? " selected" : "")
                + '>Show in a “(no group)” panel</option>'
              + '</select><span class="note">'
              + '<b>' + nOut + ' sample' + (nOut === 1 ? " has" : "s have") + ' no value in “'
              + esc(CHART.groupCol || "Group") + '”</b>, so '
              + (CHART.font.ungrouped !== "show"
                  ? 'they are not in this chart. That is how a second grouping holds fewer '
                    + 'samples than the job: leave a sample blank and it stays out, saved in '
                    + 'metadata.csv, every time the job is opened.'
                  : 'they are drawn together in a “(no group)” panel.')
              + '</span></div>'
            : "")
        + '<div class="f"><div class="row" style="display:flex;gap:7px;flex-wrap:wrap">'
          + '<button class="btn" id="gClear">Clear groups</button>'
          + '<button class="btn" id="gEach">One group per sample</button>'
          + (nHiddenNow
              ? '<button class="btn" id="gDropHidden">Take hidden samples out of this grouping</button>'
              : "")
          + (CHART.groupCols.length > 1
              ? '<button class="btn" id="gDrop">Delete this grouping</button>' : "")
          + '</div></div>'
        + '</div>');

      var nHidden = sampleNames.filter(function(n){ return CHART.hidden[n]; }).length;
      out.push('<div class="sechdr" style="border-top:1px solid var(--line)"><h3>Samples</h3>'
        + '<span class="hint">' + (nHidden
            ? (sampleNames.length - nHidden) + " of " + sampleNames.length + " shown"
            : "show, group, rename, reorder") + '</span></div>'
        + (nHidden
            ? '<div class="hidnote">' + nHidden + ' sample' + (nHidden === 1 ? " is" : "s are")
              + ' hidden. The top taxa are re-ranked from the samples still shown, so the colours '
              + 'and the size of “Other” describe this chart and not the whole run. Nothing is '
              + 'removed from the data or from the saved metadata.</div>'
            : "")
        + '<div class="samps" id="samps">'
        + ord.map(function(si, pos){
            var nm0 = sampleNames[si];
            return '<div class="samp samp2' + (CHART.hidden[nm0] ? " off" : "") + '">'
              + '<input type="checkbox" class="shw" data-s="' + esc(nm0) + '"'
                + (CHART.hidden[nm0] ? "" : " checked")
                + ' title="Show this sample in the chart"'
                + ' aria-label="Show ' + esc(nm0) + ' in the chart">'
              + '<div class="ar">'
                + '<button class="mv" data-dir="-1" data-pos="' + pos + '" aria-label="Move up"'
                  + (pos === 0 ? " disabled" : "") + '>&#9650;</button>'
                + '<button class="mv" data-dir="1" data-pos="' + pos + '" aria-label="Move down"'
                  + (pos === ord.length - 1 ? " disabled" : "") + '>&#9660;</button></div>'
              + '<div class="sfields">'
                + '<input type="text" class="alias" data-s="' + esc(sampleNames[si]) + '" value="'
                  + esc(labelOf(sampleNames[si])) + '" placeholder="display name">'
                + '<input type="text" class="sgrp" data-s="' + esc(sampleNames[si]) + '" value="'
                  + esc(CHART.groups[sampleNames[si]] || "") + '" placeholder="group" list="grpList">'
              + '</div>'
              + '<span class="raw" title="name in the data">' + esc(sampleNames[si]) + '</span>'
              + '</div>'; }).join("")
        + '</div>'
        + '<datalist id="grpList">' + gNames.map(function(g){
            return '<option value="' + esc(g) + '">'; }).join("") + '</datalist>'
        /* A greyed-out button with no reason beside it reads as broken. Say
           what it is waiting for — and in particular that hiding a sample is
           not a change to the groups, which is the thing that most looks like
           one and is not. */
        + '<div class="gsave"><span class="msg" id="gMsg">'
          + (CHART.groupDirty ? 'Groups not saved yet.'
             : CHART.groupSaved ? 'Saved to the job\u2019s metadata.csv.'
             : nHiddenNow
             ? 'Nothing to save — the groups match metadata.csv. Hiding a sample only '
               + 'affects the chart; use “Take hidden samples out of this grouping” to '
               + 'put that into the file.'
             : 'Groups are read from and written to the job\u2019s '
               + '<span class="mono">metadata.csv</span>.')
          + '</span><button class="btn' + (CHART.groupDirty ? " pri" : "")
          + '" id="gSave"' + (CHART.groupDirty ? "" : " disabled") + '>Save groups</button></div>');
    }
    return out.join("");
  }

  function toHex(c){
    if(/^#[0-9a-f]{6}$/i.test(c)) return c;
    var m = /rgba?\((\d+)[,\s]+(\d+)[,\s]+(\d+)/i.exec(c || "");
    if(!m) return "#888888";
    return "#" + [1,2,3].map(function(k){
      return ("0" + parseInt(m[k],10).toString(16)).slice(-2); }).join("");
  }

  function wireCharts(){
    var F = CHART.font;
    function touch(){ CHART.dirty = true; CHART.saved = false; paintCharts(); }
    function on(id, ev, fn){ var el = document.getElementById(id); if(el) el.addEventListener(ev, fn); }

    Array.prototype.forEach.call(document.querySelectorAll(".tabb"), function(b){
      b.addEventListener("click", function(){
        var t = CHART.tabs.filter(function(x){ return x.id === b.dataset.tab; })[0];
        if(t) selectTab(t);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".segb"), function(b){
      b.addEventListener("click", function(){ CHART.view = b.dataset.view; paintCharts(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".ramp"), function(b){
      b.addEventListener("click", function(){ F.colorscale = b.dataset.ramp; touch(); });
    });

    on("c_type", "change", function(){ F.chartType = this.value; touch(); });
    on("c_top", "change", function(){ F.topNTaxa = parseInt(this.value, 10); touch(); });
    on("c_metric", "change", function(){ F.alphaMetric = this.value; touch(); });
    on("c_agg", "change", function(){ F.aggMode = this.value; touch(); });
    on("c_curve", "change", function(){ F.curveMode = this.value; touch(); });
    on("c_rowclust", "change", function(){ F.rowCluster = this.value; touch(); });
    on("c_prevfacet", "change", function(){ F.prevFacet = this.value; touch(); });
    on("c_ashape", "change", function(){ F.alphaShape = this.value; touch(); });
    on("c_title", "input", function(){ F.titleText = this.value; touch(); });
    [["c_ts","titleSize"],["c_as","axisSize"],["c_ls","legendSize"],["c_xs","xSize"]]
      .forEach(function(p){
        on(p[0], "change", function(){
          var v = parseFloat(this.value);
          if(isFinite(v) && v >= 6 && v <= 40){ F[p[1]] = v; touch(); } else this.value = F[p[1]];
        });
      });
    on("c_grid", "change", function(){ F.showGrid = this.value === "true"; touch(); });
    on("c_xi", "change", function(){
      F.xItalic = this.value === "i"; F.xBold = this.value === "b"; touch(); });

    Array.prototype.forEach.call(document.querySelectorAll('.sw input[type="color"]'), function(inp){
      inp.addEventListener("change", function(){ CHART.colors[inp.dataset.tax] = inp.value; touch(); });
    });
    on("resetCol", "click", function(){ CHART.colors = {}; touch(); });

    Array.prototype.forEach.call(document.querySelectorAll(".alias"), function(inp){
      inp.addEventListener("change", function(){
        var raw = inp.dataset.s, v = inp.value.trim();
        if(v && v !== raw) CHART.aliases[raw] = v; else delete CHART.aliases[raw];
        touch();
      });
    });
    var S = CHART.shape || {};
    var sampleNames = S.samples || S.labels || S.names
      || (S.pts ? S.pts.map(function(p){ return p.name; }) : []);
    Array.prototype.forEach.call(document.querySelectorAll(".mv"), function(b){
      b.addEventListener("click", function(){
        var ord = orderedIdx(sampleNames).map(function(i){ return sampleNames[i]; });
        var pos = parseInt(b.dataset.pos, 10), to = pos + parseInt(b.dataset.dir, 10);
        if(to < 0 || to >= ord.length) return;
        var t = ord[pos]; ord[pos] = ord[to]; ord[to] = t;
        CHART.order = ord; touch();
      });
    });

    on("c_facet", "change", function(){ CHART.groupOn = this.value === "on"; paintCharts(); });

    Array.prototype.forEach.call(document.querySelectorAll(".sgrp"), function(inp){
      inp.addEventListener("change", function(){
        var raw = inp.dataset.s, v = inp.value.trim();
        if(v) CHART.groups[raw] = v; else delete CHART.groups[raw];
        CHART.groupDirty = true; CHART.groupSaved = false;
        paintCharts();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".shw"), function(cb){
      cb.addEventListener("change", function(){
        if(cb.checked) delete CHART.hidden[cb.dataset.s];
        else CHART.hidden[cb.dataset.s] = true;
        paintCharts();
      });
    });

    on("gCol", "change", function(){
      var v = this.value;
      syncGroupCol();
      if(v === "__newgrouping__"){
        var nm = prompt("Name for the new grouping (it becomes a column in metadata.csv):",
                        nextGroupingName());
        nm = (nm || "").trim().replace(/[,\n\r"]/g, "");
        if(!nm || CHART.groupCols.indexOf(nm) !== -1){ paintCharts(); return; }
        CHART.groupCols.push(nm);
        CHART.groupAll[nm] = {};
        CHART.groupCol = nm;
        CHART.groups = {};
        CHART.groupDirty = true; CHART.groupSaved = false;
      } else {
        CHART.groupCol = v;
        CHART.groups = Object.assign({}, CHART.groupAll[v] || {});
      }
      paintCharts();
    });
    on("gDrop", "click", function(){
      if(CHART.groupCols.length < 2) return;
      var gone = CHART.groupCol;
      CHART.groupCols = CHART.groupCols.filter(function(k){ return k !== gone; });
      delete CHART.groupAll[gone];
      CHART.groupCol = CHART.groupCols[0];
      CHART.groups = Object.assign({}, CHART.groupAll[CHART.groupCol] || {});
      CHART.groupDirty = true; CHART.groupSaved = false;
      paintCharts();
    });
    on("c_ungrp", "change", function(){ CHART.font.ungrouped = this.value; touch(); });
    /* Turn a hidden sample into a blank cell in this grouping — the same thing
       the chart is already showing, but written down, so it survives a reload
       and a re-run instead of having to be re-ticked every time. */
    on("gDropHidden", "click", function(){
      var S2 = CHART.shape || {};
      var nm = S2.samples || S2.labels || S2.names || [];
      var n = 0;
      nm.forEach(function(x){
        if(CHART.hidden[x] && CHART.groups[x]){ delete CHART.groups[x]; n++; }
        if(CHART.hidden[x]) delete CHART.hidden[x];
      });
      CHART.groupDirty = true; CHART.groupSaved = false;
      CHART.presetMsg = "";
      paintCharts();
    });
    on("gClear", "click", function(){
      CHART.groups = {}; CHART.groupDirty = true; CHART.groupSaved = false; paintCharts();
    });
    on("gEach", "click", function(){
      var S2 = CHART.shape || {};
      var nm = S2.samples || S2.labels || S2.names || [];
      CHART.groups = {};
      nm.forEach(function(n){ CHART.groups[n] = n; });
      CHART.groupDirty = true; CHART.groupSaved = false; paintCharts();
    });
    on("gSave", "click", saveGroups);

    var note = document.getElementById("topNote");
    if(note){
      var pal = seriesPalette().length;
      /* The picker tops out at 30 and the sequence yields 32 distinct swatches,
         so nothing here can reach an exact repeat. If a larger option is ever
         added, extend the steps in seriesColour() rather than letting two taxa
         share one colour. */
      note.innerHTML = F.topNTaxa > pal
        ? "<b>Only the first " + pal + " colours are chosen to stay apart from each other</b>, "
          + "including for colour-blind readers. Past that they are shifted shades of those "
          + "eight: every taxon still has its own swatch, but neighbouring ones get harder to "
          + "tell apart. The table view carries the exact numbers."
        : "Everything past this falls into a single grey “Other”. Unassigned reads always go "
          + "there rather than taking a colour slot.";
    }

    /* Remember which preset is picked. Applying one repaints the panel, and a
       <select> rebuilt from scratch comes back on its first option — so the
       next click on Delete had nothing selected and did nothing at all, with
       no sign that it had been ignored. */
    on("c_preset", "change", function(){ CHART.presetSel = this.value; });
    on("presetApply", "click", function(){
      var v = (document.getElementById("c_preset") || {}).value;
      if(!v) return nudgePreset("Choose a preset first, then Apply.");
      CHART.presetSel = v; applyPreset(v);
    });
    on("presetSave", "click", savePreset);
    on("presetDel", "click", function(){
      var v = (document.getElementById("c_preset") || {}).value;
      if(!v) return nudgePreset("Choose a preset first, then Delete.");
      CHART.presetSel = v; deletePreset(v);
    });

    on("pngBtn", "click", downloadPNG);
    on("allPngBtn", "click", exportAllPNG);
    on("rrBtn", "click", startRRender);
    on("rrZip", "click", downloadRZip);
    on("saveBtn", "click", saveChartSettings);
    on("revertBtn", "click", function(){
      CHART.font = defaultFont(); CHART.colors = {}; CHART.aliases = {};
      CHART.order = []; touch();
    });
  }


  /* Groups go back to the job's metadata.csv, in the production console's
     column spelling. "SampleID,Group" is what the production editor already
     writes, and dada2_pipeline.R's loader accepts it along with sampleid /
     sample_id / sample / #sampleid, case-insensitively.

     Until 2.9.13 one merge in that pipeline was hardcoded by.y="SampleID",
     which made this the only spelling that worked everywhere. That merge is
     gone (it joined against a variable that did not exist, so the plot it fed
     had never been produced). Writing one spelling is still the right thing —
     the fewer spellings in circulation, the fewer places a future reader has
     to check — but it is now a convention rather than a constraint. */
  /* The editor works on one grouping at a time; this puts the edits back into
     the set of all of them before anything reads or writes the whole file. */
  function syncGroupCol(){
    if(!CHART.groupCol) return;
    var m = {};
    Object.keys(CHART.groups).forEach(function(n){
      var v = (CHART.groups[n] || "").trim();
      if(v) m[canonName(n)] = v;
    });
    CHART.groupAll[CHART.groupCol] = m;
    if(CHART.groupCols.indexOf(CHART.groupCol) === -1) CHART.groupCols.push(CHART.groupCol);
  }

  function nextGroupingName(){
    for(var i = 1; i < 99; i++){
      var n = "Grouping" + i;
      if(CHART.groupCols.indexOf(n) === -1) return n;
    }
    return "Grouping";
  }

  function saveGroups(){
    var S = CHART.shape || {};
    var names = S.samples || S.labels || S.names
      || (S.pts ? S.pts.map(function(p){ return p.name; }) : []);
    if(!names.length) return;
    var btn = document.getElementById("gSave"), msg = document.getElementById("gMsg");
    btn.disabled = true;

    /* Write the whole file back, not just the column being edited.
       Every grouping column goes out, so Grouping1 and Grouping2 live together
       in one metadata.csv and a re-run draws a figure for each. Columns this
       editor does not understand — the description column the U2BI-139
       metadata was prepared with — are carried through untouched: saving a
       grouping is not a reason to delete someone else's column.
       Rows come from the file first, then any sample the chart has that the
       file does not, so a sample is never dropped by being off-screen. */
    syncGroupCol();
    var cols = CHART.groupCols.slice();
    (CHART.metaRows || []).forEach(function(rec){
      Object.keys(rec).forEach(function(k){
        if(k !== "id" && cols.indexOf(k) === -1) cols.push(k); });
    });
    if(!cols.length) cols = ["Group"];

    var seen = {}, order = [];
    (CHART.metaRows || []).forEach(function(rec){
      var cn = canonName(rec.id);
      if(!seen[sampKey(cn)]){ seen[sampKey(cn)] = rec; order.push(cn); }
    });
    orderedIdx(names).forEach(function(i){
      var cn = canonName(names[i]);
      if(!seen[sampKey(cn)]){ seen[sampKey(cn)] = {id: cn}; order.push(cn); }
    });

    var csv = [csvCell(CHART.metaIdCol || "SampleID")]
      .concat(cols.map(csvCell)).join(",") + "\n"
      + order.map(function(n){
          var rec = seen[sampKey(n)] || {};
          return [csvCell(n)].concat(cols.map(function(k){
            /* For a grouping column the in-memory map is the whole truth: a
               missing key means the user cleared that cell, not that we have
               no opinion. Falling back to the file's old value here undid
               every clear — "Clear groups" followed by Save wrote the original
               groups straight back, and taking a sample out of a grouping put
               it back in. Other columns, which this editor does not manage,
               still come from the file so they are not lost. */
            if(CHART.groupCols.indexOf(k) !== -1){
              var m = CHART.groupAll[k] || {};
              return csvCell((m[n] == null ? "" : String(m[n])).trim());
            }
            return csvCell((rec[k] == null ? "" : String(rec[k])).trim());
          })).join(",");
        }).join("\n") + "\n";
    fetch("/results/" + encodeURIComponent(CHART.id) + "/metadata", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({csv: csv})
    }).then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      CHART.groupDirty = false; CHART.groupSaved = true; paintCharts();
    }).catch(function(e){
      btn.disabled = false;
      if(msg) msg.innerHTML = '<span style="color:var(--err)">Could not save the groups — '
        + esc(e.message || e) + '</span>';
    });
  }

  /* A sample called R1,R2 would otherwise split into two columns and silently
     shift every group by one. */
  function csvCell(v){
    v = String(v === undefined || v === null ? "" : v);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }

  function saveChartSettings(then){
    var btn = document.getElementById("saveBtn"), msg = document.getElementById("saveMsg");
    if(btn) btn.disabled = true;
    var S = CHART.shape || {};
    var names = S.samples || S.labels || S.names
      || (S.pts ? S.pts.map(function(p){ return p.name; }) : []);
    /* The production console's exact shape. Anything else and a job's styling
       splits in two depending on which console last touched it. */
    var payload = {
      font: CHART.font,
      colors: CHART.colors,
      sampleAliases: CHART.aliases,
      sampleOrder: names.length ? orderedIdx(names).map(function(i){ return names[i]; })
                                : CHART.order
    };
    fetch("/results/" + encodeURIComponent(CHART.id) + "/edit_charts/settings", {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)
    }).then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      CHART.dirty = false; CHART.saved = true; paintCharts();
      if(typeof then === "function") then();
    }).catch(function(e){
      if(btn) btn.disabled = false;
      if(msg) msg.innerHTML = '<span style="color:var(--err)">Could not save — '
        + esc(e.message || e) + '</span>';
      /* Do not run the follow-up: whatever it was going to do would have been
         done against settings the server never received. */
      if(typeof then === "function"){
        CHART.rr.state = "failed";
        CHART.rr.msg = "The settings could not be saved, so R was not started: "
          + (e.message || e);
        paintCharts();
      }
    });
  }

  /* PNG via canvas. ink() resolved the theme tokens to literals precisely so
     the serialised SVG still has its text when it leaves the document. */
  function downloadPNG(){
    /* The file that leaves the app is the report figure, not a picture of the
       screen: titled, framed, with axis titles and a headed legend, at a size
       that survives being dropped into a document. The on-screen chart keeps
       its plain look because the page around it already supplies the rest. */
    var svg = chartSVG({width:REPORT_W, height:REPORT_H, report:true});
    if(!svg) return;
    var sz = svgSize(svg), W = sz.w, H = sz.h, scale = 2;
    var img = new Image();
    var url = URL.createObjectURL(new Blob([svg], {type:"image/svg+xml;charset=utf-8"}));
    img.onload = function(){
      var cv = document.createElement("canvas");
      cv.width = W*scale; cv.height = H*scale;
      var ctx = cv.getContext("2d");
      ctx.scale(scale, scale); ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){
        var a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = CHART.id + "_" + CHART.tab.id + ".png";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
      }, "image/png");
    };
    img.onerror = function(){
      URL.revokeObjectURL(url);
      var msg = document.getElementById("saveMsg");
      if(msg) msg.innerHTML = '<span style="color:var(--err)">The browser would not rasterise '
        + 'this chart. The table view and Download CSV both still work.</span>';
    };
    img.src = url;
  }

  /* ── export every tab in one go ────────────────────────────────────────
     Coming back to change a palette and then clicking through twenty-odd tabs,
     saving each one by hand, is the part of this screen that wastes the most
     time. The colours, fonts, grouping, sample order and hidden samples are
     already settled by the time anyone wants pictures, so render each tab with
     those settings and hand over the files.

     Sequential on purpose: one tab's CSV is fetched, shaped, drawn and
     rasterised before the next starts. Firing them in parallel would have
     several tabs writing CHART.shape at once and the PNGs would carry each
     other's data — the failure this editor already had once, when a tab switch
     left the previous tab's shape in place. */
  /* ── the R figures ───────────────────────────────────────────────────────
     Everything above draws in the browser, which is right for working: it is
     instant and it responds to every control. It is not what the reports are
     made of. Those come from R, and a customer comparing a PNG from here with
     a PDF from r_plots/ is comparing two renderers.

     So: save the settings, hand them to viz_pipeline.R, and let R draw its own
     forty figures again with the chosen colours and Top-N — into a SEPARATE
     folder, edit_charts/r_png/, so the delivered figures in r_plots/ are still
     there to compare against and a re-render cannot destroy them. Then the
     same ZIP button brings them down. */
  function rrPoll(){
    fetch("/results/" + encodeURIComponent(CHART.id) + "/render_r", {cache:"no-store"})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if(!j) return;
        CHART.rr.state = j.state || "idle";
        CHART.rr.files = j.files || [];
        CHART.rr.log   = j.log || "";
        if(j.state === "running"){
          CHART.rr.msg = "R is drawing the figures… this takes a few minutes.";
          paintCharts();
          setTimeout(rrPoll, 4000);
          return;
        }
        CHART.rr.msg = j.state === "done"
          ? CHART.rr.files.length + " figures rendered by R."
          : j.state === "failed"
          ? "R could not finish. " + (CHART.rr.log ? "Last lines are below." : "")
          : "";
        paintCharts();
      })
      .catch(function(){ /* a dropped poll is not a failure; the next one tells us */ });
  }

  function startRRender(){
    if(CHART.rr.state === "running") return;
    CHART.rr.state = "running";
    CHART.rr.msg = "Saving the settings, then starting R…";
    paintCharts();
    /* Save first, unconditionally. R reads the settings FILE, so a palette that
       is only in the browser's memory would not reach it — the figures would
       come back in the default colours and look like the button had not
       worked. */
    saveChartSettings(function(){
      syncGroupCol();
      fetch("/results/" + encodeURIComponent(CHART.id) + "/render_r", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({group_col: CHART.groupCol || ""})
      }).then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(){ setTimeout(rrPoll, 1500); })
        .catch(function(e){
          CHART.rr.state = "failed";
          CHART.rr.msg = "Could not start the render: " + (e.message || e);
          paintCharts();
        });
    });
  }

  function downloadRZip(){
    var files = CHART.rr.files || [];
    if(!files.length) return;
    CHART.rr.msg = "Collecting " + files.length + " figures…";
    paintCharts();
    var base = "/results/" + encodeURIComponent(CHART.id) + "/render_r/";
    Promise.all(files.map(function(f){
      return fetch(base + encodeURIComponent(f), {cache:"no-store"})
        .then(function(r){ if(!r.ok) throw new Error(f + ": HTTP " + r.status);
                           return r.arrayBuffer(); })
        .then(function(ab){ return {name:f, bytes:new Uint8Array(ab)}; });
    })).then(function(got){
      saveBlob(zipStore(got), CHART.id + "_r_figures.zip");
      CHART.rr.msg = got.length + " figures saved to " + CHART.id + "_r_figures.zip";
      paintCharts();
    }).catch(function(e){
      CHART.rr.msg = "Could not build the archive: " + (e.message || e);
      paintCharts();
    });
  }

  var EXPORT = {busy:false, msg:""};
  var REPORT_W = 1240, REPORT_H = 780;

  /* ── a ZIP, written by hand ──────────────────────────────────────────────
     Twenty-nine charts used to arrive as twenty-nine downloads, which on a
     browser set to ask where to put each file is twenty-nine Save As dialogs.
     One archive, one dialog.

     Written here rather than pulled from a CDN because this console is served
     off the user's own machine and may have no route out; a chart export that
     depends on fetching a library is an export that fails on the one network
     that matters. STORED, not deflated: a PNG is already compressed, so
     deflating it again costs time and saves nothing, and "store" needs no
     compressor at all. */
  var CRC_TABLE = null;
  function crc32(bytes){
    if(!CRC_TABLE){
      CRC_TABLE = new Int32Array(256);
      for(var n = 0; n < 256; n++){
        var c = n;
        for(var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        CRC_TABLE[n] = c;
      }
    }
    var crc = -1;
    for(var i = 0; i < bytes.length; i++)
      crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xFF];
    return (crc ^ -1) >>> 0;
  }

  function zipStore(files){
    var enc = new TextEncoder();
    var parts = [], central = [], offset = 0;
    /* Fixed DOS timestamp. The alternative is the local clock, which would make
       two archives of the same charts differ byte for byte for no reason. */
    var dosTime = 0, dosDate = (2020 - 1980) << 9 | (1 << 5) | 1;

    function u8(n){ return [n & 0xFF]; }
    function u16(n){ return [n & 0xFF, (n >>> 8) & 0xFF]; }
    function u32(n){ return [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF]; }

    files.forEach(function(f){
      var nameB = enc.encode(f.name);
      var crc = crc32(f.bytes), size = f.bytes.length;
      var local = [].concat(
        u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
        u32(crc), u32(size), u32(size), u16(nameB.length), u16(0));
      parts.push(new Uint8Array(local), nameB, f.bytes);
      central.push({name:nameB, crc:crc, size:size, off:offset});
      offset += local.length + nameB.length + size;
    });

    var cdStart = offset, cd = [];
    central.forEach(function(c){
      var h = [].concat(
        u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
        u32(c.crc), u32(c.size), u32(c.size),
        u16(c.name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(c.off));
      cd.push(new Uint8Array(h), c.name);
      offset += h.length + c.name.length;
    });
    var eocd = [].concat(
      u32(0x06054b50), u16(0), u16(0), u16(central.length), u16(central.length),
      u32(offset - cdStart), u32(cdStart), u16(0));
    return new Blob(parts.concat(cd, [new Uint8Array(eocd)]), {type:"application/zip"});
  }

  function saveBlob(blob, name){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  }

  /* The report figure grows to fit its legend, so its size is whatever
     chartSVG decided — reading it back off the markup rather than assuming the
     starting size, which would crop the extra legend columns straight off the
     right-hand edge of the PNG. */
  function svgSize(svg){
    var w = /width="(\d+)"/.exec(svg), h = /height="(\d+)"/.exec(svg);
    return {w: w ? +w[1] : REPORT_W, h: h ? +h[1] : REPORT_H};
  }

  function pngBlob(){
    return new Promise(function(resolve){
      var svg = chartSVG({width:REPORT_W, height:REPORT_H, report:true});
      if(!svg) return resolve(null);
      var sz = svgSize(svg), W = sz.w, H = sz.h, scale = 2;
      var img = new Image();
      var url = URL.createObjectURL(new Blob([svg], {type:"image/svg+xml;charset=utf-8"}));
      img.onload = function(){
        var cv = document.createElement("canvas");
        cv.width = W*scale; cv.height = H*scale;
        var ctx = cv.getContext("2d");
        ctx.scale(scale, scale); ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        cv.toBlob(function(b){ resolve(b || null); }, "image/png");
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }

  function exportAllPNG(){
    if(!CHART || !CHART.tabs.length || EXPORT.busy) return;
    var back = CHART.tab, tabs = CHART.tabs.slice();
    var made = [], skipped = [];
    EXPORT.busy = true;
    /* Disable the live button now, not at the next repaint. The flag alone only
       reaches the DOM when paintCharts() next runs, which is after the first
       tab has been fetched — a window in which the button still looks ready and
       a second click would start a second export over the top of this one. */
    var liveBtn = document.getElementById("allPngBtn");
    if(liveBtn){ liveBtn.disabled = true; liveBtn.textContent = "Exporting…"; }
    /* The progress line lives outside the DOM, because every tab rendered
       during the export calls paintCharts() and rebuilds that bar. Held in a
       node it would be wiped on the first tab and the export would look frozen
       for however long it takes. */
    function say(t){
      EXPORT.msg = t;
      var el = document.getElementById("allPngMsg");
      if(el) el.textContent = t;
    }

    function finish(){
      EXPORT.busy = false;
      if(!made.length){
        say("Nothing could be rendered.");
        return selectTab(back);
      }
      say("Packing " + made.length + " charts…");
      /* Read every blob into bytes, then write one archive. Done after all the
         rendering rather than as each chart finishes, so a failure while
         packing cannot leave the user with half an archive and no warning. */
      Promise.all(made.map(function(f){
        return f.blob.arrayBuffer().then(function(ab){
          return {name:f.name, bytes:new Uint8Array(ab)}; });
      })).then(function(files){
        saveBlob(zipStore(files), CHART.id + "_charts.zip");
        say(files.length + " charts saved to " + CHART.id + "_charts.zip"
            + (skipped.length ? " · " + skipped.length + " skipped ("
                 + skipped.slice(0, 3).join(", ")
                 + (skipped.length > 3 ? "…" : "") + ")" : "") + ".");
      }).catch(function(e){
        /* If the archive cannot be built, hand over the files one by one rather
           than leaving the user with nothing after a long render. */
        say("Could not build the archive (" + (e.message || e)
            + "), so the charts are coming one at a time.");
        made.forEach(function(f, i){
          setTimeout(function(){ saveBlob(f.blob, f.name); }, i * 350);
        });
      }).then(function(){ selectTab(back); });
    }

    function step(i){
      if(i >= tabs.length) return finish();
      var t = tabs[i];
      say("Rendering " + (i + 1) + " of " + tabs.length + " — " + t.label + "…");
      fetch("/results/" + encodeURIComponent(CHART.id) + "/table/" + encodeURIComponent(t.f),
            {cache:"no-store"})
        .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
        .then(function(text){
          var rows = parseCSV(text);
          if(rows.length < 2) throw new Error("no data rows");
          CHART.tab = t; CHART.rows = rows; CHART.loading = false; CHART.err = "";
          shapeData();
          paintCharts();
          return pngBlob();
        })
        .then(function(blob){
          if(blob) made.push({name: CHART.id + "_" + t.id + ".png", blob: blob});
          else skipped.push(t.label);
        })
        .catch(function(){ skipped.push(t.label); })
        .then(function(){ say(EXPORT.msg); setTimeout(function(){ step(i + 1); }, 160); });
    }
    step(0);
  }

  /* ═══ pipeline pages ═══════════════════════════════════════════════════ */
